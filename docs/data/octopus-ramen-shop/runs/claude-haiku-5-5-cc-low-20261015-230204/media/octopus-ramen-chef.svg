<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1f3d"/>
      <stop offset="0.6" stop-color="#5b3550"/>
      <stop offset="1" stop-color="#e0785a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86b3c"/>
      <stop offset="1" stop-color="#6b3f22"/>
    </linearGradient>
    <linearGradient id="octo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a577e6"/>
      <stop offset="1" stop-color="#7a4cc2"/>
    </linearGradient>
  </defs>

  <!-- Sky / night backdrop -->
  <rect width="800" height="600" fill="url(#dusk)"/>
  <circle cx="660" cy="110" r="38" fill="#ffe6b0" opacity="0.85"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="90" cy="60" r="2"/><circle cx="180" cy="30" r="1.5"/>
    <circle cx="260" cy="80" r="1.5"/><circle cx="740" cy="40" r="2"/>
    <circle cx="520" cy="50" r="1.5"/><circle cx="30" cy="150" r="1.5"/>
  </g>

  <!-- Back wall of the booth -->
  <rect x="100" y="200" width="600" height="220" fill="#f3dcb4"/>
  <rect x="100" y="200" width="600" height="10" fill="#d9b888"/>

  <!-- Noren curtain -->
  <g>
    <rect x="150" y="200" width="120" height="70" fill="#c8323a"/>
    <rect x="280" y="200" width="120" height="70" fill="#f2ead8"/>
    <rect x="410" y="200" width="120" height="70" fill="#c8323a"/>
    <rect x="540" y="200" width="110" height="70" fill="#f2ead8"/>
    <g fill="none" stroke="#f2ead8" stroke-width="5" stroke-linecap="round">
      <path d="M200 225 v22 M200 252 h0"/>
      <path d="M330 225 q12 0 0 22 q-12 0 0 22"/>
      <path d="M460 230 h22 M471 230 v40"/>
      <path d="M590 228 l14 14 l-14 14"/>
    </g>
  </g>

  <!-- Awning -->
  <path d="M60 110 L740 110 L720 150 L80 150 Z" fill="#c8323a"/>
  <g fill="#f2ead8">
    <path d="M60 110 h60 v20 q-30 14 -60 0 Z"/>
    <path d="M180 110 h60 v20 q-30 14 -60 0 Z"/>
    <path d="M300 110 h60 v20 q-30 14 -60 0 Z"/>
    <path d="M420 110 h60 v20 q-30 14 -60 0 Z"/>
    <path d="M540 110 h60 v20 q-30 14 -60 0 Z"/>
    <path d="M660 110 h60 v20 q-30 14 -60 0 Z"/>
  </g>

  <!-- Hanging lanterns -->
  <g stroke="#3a2418" stroke-width="2">
    <line x1="210" y1="150" x2="210" y2="172"/>
    <line x1="590" y1="150" x2="590" y2="172"/>
  </g>
  <g>
    <ellipse cx="210" cy="186" rx="18" ry="22" fill="#ff7a3d"/>
    <ellipse cx="590" cy="186" rx="18" ry="22" fill="#ff7a3d"/>
    <text x="210" y="192" font-family="serif" font-size="16" fill="#fff3d6" text-anchor="middle">ラ</text>
    <text x="590" y="192" font-family="serif" font-size="16" fill="#fff3d6" text-anchor="middle">麺</text>
  </g>

  <!-- Shop sign -->
  <rect x="300" y="290" width="200" height="0" fill="none"/>

  <!-- Wooden posts -->
  <rect x="62" y="150" width="22" height="380" fill="url(#wood)"/>
  <rect x="716" y="150" width="22" height="380" fill="url(#wood)"/>

  <!-- Steam from broth pot -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <path d="M285 320 C270 300 295 285 282 265 C272 250 290 240 284 225"/>
    <path d="M312 318 C300 298 325 284 314 262 C304 246 320 236 314 222"/>
  </g>

  <!-- Octopus chef: hat -->
  <g>
    <circle cx="470" cy="190" r="26" fill="#ffffff"/>
    <circle cx="500" cy="178" r="30" fill="#ffffff"/>
    <circle cx="532" cy="190" r="26" fill="#ffffff"/>
    <rect x="446" y="200" width="108" height="26" rx="4" fill="#ffffff"/>
    <rect x="446" y="216" width="108" height="8" fill="#e5e5ea"/>
  </g>

  <!-- Octopus chef: back tentacles behind head -->
  <g fill="none" stroke="#6a3fb0" stroke-width="16" stroke-linecap="round">
    <path d="M410 300 C380 280 360 240 340 250"/>
    <path d="M590 300 C620 280 640 240 660 255"/>
  </g>

  <!-- Octopus chef: head -->
  <ellipse cx="500" cy="282" rx="92" ry="80" fill="url(#octo)"/>
  <!-- Head spots -->
  <g fill="#c9a6f2" opacity="0.5">
    <circle cx="450" cy="250" r="6"/><circle cx="548" cy="255" r="5"/>
    <circle cx="520" cy="230" r="4"/><circle cx="478" cy="232" r="3"/>
  </g>

  <!-- Face -->
  <ellipse cx="478" cy="290" rx="10" ry="13" fill="#ffffff"/>
  <ellipse cx="524" cy="290" rx="10" ry="13" fill="#ffffff"/>
  <circle cx="480" cy="292" r="6" fill="#222233"/>
  <circle cx="526" cy="292" r="6" fill="#222233"/>
  <circle cx="482" cy="289" r="2" fill="#ffffff"/>
  <circle cx="528" cy="289" r="2" fill="#ffffff"/>
  <path d="M464 268 q14 -10 26 0" fill="none" stroke="#3a1f5c" stroke-width="3" stroke-linecap="round"/>
  <path d="M510 268 q14 -10 26 0" fill="none" stroke="#3a1f5c" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="462" cy="312" rx="9" ry="5" fill="#ff8fb0" opacity="0.7"/>
  <ellipse cx="538" cy="312" rx="9" ry="5" fill="#ff8fb0" opacity="0.7"/>
  <path d="M488 316 q12 12 24 0" fill="none" stroke="#3a1f5c" stroke-width="3" stroke-linecap="round"/>

  <!-- Front tentacles (holding things) -->
  <g fill="none" stroke="#7a4cc2" stroke-width="20" stroke-linecap="round">
    <path d="M440 335 C405 350 395 330 375 340 C355 352 368 378 348 384"/>
    <path d="M560 335 C590 350 600 340 618 352 C632 362 620 372 632 368"/>
  </g>
  <!-- Suckers -->
  <g fill="#d8c2f5" opacity="0.7">
    <circle cx="405" cy="346" r="2.5"/><circle cx="385" cy="339" r="2.5"/>
    <circle cx="368" cy="360" r="2.5"/><circle cx="356" cy="378" r="2.5"/>
    <circle cx="585" cy="345" r="2.5"/><circle cx="604" cy="345" r="2.5"/>
    <circle cx="621" cy="356" r="2.5"/>
  </g>

  <!-- Counter -->
  <rect x="110" y="390" width="580" height="30" fill="url(#wood)"/>
  <rect x="110" y="386" width="580" height="8" rx="3" fill="#c98a52"/>
  <rect x="110" y="420" width="580" height="180" fill="#4a2a18"/>

  <!-- Broth pot -->
  <rect x="240" y="332" width="120" height="14" rx="4" fill="#55555f"/>
  <path d="M250 340 L350 340 L345 395 L255 395 Z" fill="#3c3c44"/>
  <ellipse cx="300" cy="340" rx="45" ry="7" fill="#d9822b"/>
  <path d="M352 352 q14 -6 22 4" fill="none" stroke="#55555f" stroke-width="5" stroke-linecap="round"/>

  <!-- Ramen bowl with chopsticks -->
  <g stroke="#f5efe2" stroke-width="3" stroke-linecap="round">
    <line x1="660" y1="368" x2="690" y2="312"/>
    <line x1="650" y1="368" x2="672" y2="310"/>
  </g>
  <path d="M600 372 L700 372 Q695 412 650 414 Q605 412 600 372 Z" fill="#2b2b2e"/>
  <ellipse cx="650" cy="372" rx="50" ry="8" fill="#e9a23b"/>
  <g fill="none" stroke="#f6d37a" stroke-width="2.5" stroke-linecap="round">
    <path d="M620 370 q6 -4 12 0 t12 0 t12 0"/>
    <path d="M636 376 q6 -4 12 0 t12 0"/>
    <path d="M618 378 q6 -4 12 0 t12 0"/>
  </g>
  <circle cx="632" cy="368" r="8" fill="#fffaf0"/>
  <circle cx="632" cy="368" r="4" fill="#f5a623"/>
  <rect x="664" y="362" width="8" height="14" fill="#1f5b2e" transform="rotate(-18 668 369)"/>
  <circle cx="660" cy="376" r="1.8" fill="#7cc46a"/>
  <circle cx="676" cy="378" r="1.8" fill="#7cc46a"/>

  <!-- Menu board on wall -->
  <rect x="130" y="250" width="70" height="90" rx="4" fill="#2b2b2e"/>
  <g stroke="#f2ead8" stroke-width="3" stroke-linecap="round">
    <line x1="142" y1="270" x2="188" y2="270"/>
    <line x1="142" y1="286" x2="182" y2="286"/>
    <line x1="142" y1="302" x2="186" y2="302"/>
    <line x1="142" y1="318" x2="176" y2="318"/>
  </g>

  <!-- Chef's sign -->
  <text x="400" y="560" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffe6b0" text-anchor="middle" letter-spacing="3">TAKO RAMEN</text>
</svg>
