<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Octopus chef at a ramen booth</title>
  <desc id="desc">A coral octopus in a chef's toque and apron leans over a wooden night-market stall, offering a bowl of ramen beside a steaming pot, noren curtains, and a paper lantern.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16122e"/>
      <stop offset="60%" stop-color="#2a1b44"/>
      <stop offset="100%" stop-color="#412848"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7a8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffb14a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffb14a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="100%" stop-color="#e7c56e"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8743a"/>
      <stop offset="100%" stop-color="#5e3118"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d09a"/>
      <stop offset="100%" stop-color="#c48a48"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3038"/>
      <stop offset="100%" stop-color="#5a141c"/>
    </linearGradient>
    <linearGradient id="noren" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4534e"/>
      <stop offset="100%" stop-color="#9b2228"/>
    </linearGradient>
    <radialGradient id="mantle" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#ffc2a2"/>
      <stop offset="38%" stop-color="#ff7a40"/>
      <stop offset="100%" stop-color="#d44720"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6d4"/>
      <stop offset="100%" stop-color="#f0b08a"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9460"/>
      <stop offset="100%" stop-color="#e25528"/>
    </linearGradient>
    <radialGradient id="broth" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffe59a"/>
      <stop offset="72%" stop-color="#e39b2b"/>
      <stop offset="100%" stop-color="#c07816"/>
    </radialGradient>
    <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#efe0cc"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="steamBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#140c18" flood-opacity="0.38"/>
    </filter>
    <mask id="moonMask">
      <rect width="1200" height="900" fill="white"/>
      <circle cx="1048" cy="102" r="48" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <circle cx="1004" cy="124" r="56" fill="url(#moon)" mask="url(#moonMask)"/>
  <g fill="#fff4d2">
    <circle cx="90" cy="70" r="1.7"/><circle cx="180" cy="150" r="1.2"/>
    <circle cx="300" cy="64" r="1.8"/><circle cx="430" cy="120" r="1.1"/>
    <circle cx="690" cy="58" r="1.5"/><circle cx="820" cy="150" r="1.2"/>
    <circle cx="1120" cy="210" r="1.4"/><circle cx="70" cy="230" r="1.1"/>
    <circle cx="540" cy="46" r="1.3"/><circle cx="760" cy="200" r="1"/>
  </g>
  <ellipse cx="600" cy="560" rx="460" ry="70" fill="#ffb14a" opacity="0.1" filter="url(#soft)"/>

  <!-- roof -->
  <path d="M140 268 L600 128 L1060 268 L1004 286 L600 168 L196 286 Z" fill="url(#roof)"/>
  <path d="M188 258 L600 156 L1012 258" fill="none" stroke="#f3d7ad" stroke-width="7" stroke-linecap="round"/>
  <!-- tile hints -->
  <g stroke="#6e1c24" stroke-width="2" opacity="0.45" fill="none">
    <path d="M240 240 L600 150 L960 240"/>
    <path d="M280 252 L600 168 L920 252"/>
  </g>

  <!-- fascia sign -->
  <g filter="url(#shadow)">
    <rect x="390" y="196" width="420" height="58" rx="8" fill="#f8ead0" stroke="#5c3016" stroke-width="4"/>
    <text x="600" y="234" text-anchor="middle" fill="#6d2418"
          font-family="Georgia, 'Palatino Linotype', 'Hiragino Mincho ProN', serif"
          font-size="34" font-weight="700" letter-spacing="3">OCTOPUS RAMEN</text>
  </g>

  <!-- posts -->
  <rect x="196" y="268" width="30" height="400" rx="5" fill="#5a3018"/>
  <rect x="974" y="268" width="30" height="400" rx="5" fill="#5a3018"/>
  <rect x="204" y="268" width="8" height="400" fill="#d7a15c" opacity="0.4"/>
  <rect x="982" y="268" width="8" height="400" fill="#d7a15c" opacity="0.4"/>

  <!-- lantern -->
  <ellipse cx="250" cy="250" rx="100" ry="78" fill="url(#lanternGlow)"/>
  <line x1="250" y1="196" x2="250" y2="228" stroke="#5a3018" stroke-width="3"/>
  <path d="M220 236 Q250 216 280 236 L274 298 Q250 312 226 298 Z" fill="#ffd27a" stroke="#e39a30" stroke-width="2"/>
  <path d="M230 246 Q250 234 270 246" fill="none" stroke="#fff6d0" stroke-width="2"/>
  <rect x="234" y="226" width="32" height="10" rx="2" fill="#6a3a1e"/>
  <rect x="236" y="296" width="28" height="8" rx="2" fill="#6a3a1e"/>
  <text x="250" y="276" text-anchor="middle" fill="#a84818" font-family="Georgia, serif" font-size="16">暖</text>

  <!-- noren rod and curtains -->
  <rect x="236" y="262" width="728" height="14" rx="3" fill="#3f2414"/>
  <path d="M252 276 h156 v138 q-78 26 -156 0 Z" fill="url(#noren)"/>
  <path d="M430 276 h160 v148 q-80 22 -160 0 Z" fill="url(#noren)"/>
  <path d="M792 276 h156 v136 q-78 24 -156 0 Z" fill="url(#noren)"/>
  <g fill="none" stroke="#f6e3b8" stroke-width="3">
    <circle cx="330" cy="342" r="20"/>
    <circle cx="510" cy="348" r="20"/>
    <circle cx="870" cy="340" r="20"/>
  </g>
  <g fill="#f6e3b8" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Hiragino Sans', Georgia, serif" font-size="20" text-anchor="middle">
    <text x="330" y="348">味</text>
    <text x="510" y="354">ラ</text>
    <text x="870" y="346">麺</text>
  </g>

  <!-- stall interior -->
  <rect x="228" y="400" width="744" height="175" fill="#342016"/>
  <rect x="260" y="418" width="150" height="78" rx="6" fill="#24140f" stroke="#7a4a28" stroke-width="3"/>
  <text x="335" y="452" text-anchor="middle" fill="#f6e2b8" font-family="Georgia, serif" font-size="16">shoyu</text>
  <text x="335" y="474" text-anchor="middle" fill="#f6e2b8" font-family="Georgia, serif" font-size="16">miso</text>
  <g>
    <rect x="860" y="430" width="16" height="46" rx="3" fill="#1b3d2c"/>
    <rect x="882" y="422" width="15" height="54" rx="3" fill="#7c1f22"/>
    <rect x="902" y="438" width="13" height="38" rx="3" fill="#c4894a"/>
    <rect x="860" y="426" width="16" height="7" fill="#eadcc0"/>
    <rect x="882" y="418" width="15" height="7" fill="#1a1a1a"/>
  </g>

  <!-- octopus, behind the counter -->
  <g>
    <ellipse cx="610" cy="478" rx="172" ry="132" fill="url(#mantle)"/>
    <ellipse cx="610" cy="512" rx="112" ry="82" fill="url(#belly)"/>
    <ellipse cx="498" cy="508" rx="22" ry="12" fill="#ff8aa0" opacity="0.4"/>
    <ellipse cx="724" cy="508" rx="22" ry="12" fill="#ff8aa0" opacity="0.4"/>
    <g fill="#c9441e" opacity="0.5">
      <ellipse cx="492" cy="410" rx="16" ry="11" transform="rotate(-18 492 410)"/>
      <ellipse cx="736" cy="400" rx="14" ry="10" transform="rotate(16 736 400)"/>
      <ellipse cx="560" cy="372" rx="11" ry="8"/>
    </g>

    <ellipse cx="546" cy="470" rx="36" ry="40" fill="#fffaf4"/>
    <ellipse cx="678" cy="470" rx="36" ry="40" fill="#fffaf4"/>
    <ellipse cx="556" cy="478" rx="18" ry="21" fill="#24160f"/>
    <ellipse cx="688" cy="478" rx="18" ry="21" fill="#24160f"/>
    <circle cx="564" cy="470" r="6.5" fill="#fff"/>
    <circle cx="696" cy="470" r="6.5" fill="#fff"/>
    <path d="M512 452 Q546 432 582 454" fill="none" stroke="#c44722" stroke-width="5" stroke-linecap="round"/>
    <path d="M644 454 Q678 432 714 452" fill="none" stroke="#c44722" stroke-width="5" stroke-linecap="round"/>
    <path d="M572 528 Q612 562 654 528" fill="none" stroke="#8f3016" stroke-width="5" stroke-linecap="round"/>
    <path d="M594 542 Q612 554 630 542" fill="#e25a6a"/>

    <!-- toque -->
    <ellipse cx="610" cy="352" rx="86" ry="26" fill="#f3eee6"/>
    <path d="M540 350
             C 522 308, 546 268, 592 264
             C 604 240, 646 234, 666 258
             C 718 250, 738 304, 706 348 Z" fill="#fffaf4" stroke="#e6d9c6" stroke-width="2"/>
    <ellipse cx="584" cy="304" rx="24" ry="16" fill="#fff" opacity="0.75"/>
    <ellipse cx="650" cy="286" rx="26" ry="18" fill="#fff" opacity="0.5"/>
    <rect x="542" y="344" width="136" height="24" rx="6" fill="#f7f2e8" stroke="#e6d9c6"/>
    <path d="M568 572 L612 618 L656 572 L634 560 L612 594 L590 560 Z" fill="#c23b3b"/>
  </g>

  <!-- counter -->
  <path d="M150 628 H1050 V770 Q600 812 150 770 Z" fill="url(#wood)"/>
  <path d="M138 596 H1062 V646 Q600 678 138 646 Z" fill="url(#woodTop)"/>
  <path d="M170 626 H1030" stroke="#8d5a2c" stroke-width="3" opacity="0.45"/>
  <g stroke="#5c3018" stroke-width="2" opacity="0.22" fill="none">
    <path d="M210 690 Q420 676 560 700"/>
    <path d="M640 714 Q820 694 990 724"/>
    <path d="M250 744 Q460 732 560 754"/>
  </g>

  <!-- apron -->
  <path d="M498 612 C 486 656, 498 724, 534 752 H688 C 724 724, 734 656, 722 612 Z" fill="url(#apron)" stroke="#e3d2b8"/>
  <path d="M610 624 V748" stroke="#edd5d0" stroke-width="2"/>
  <circle cx="610" cy="688" r="15" fill="none" stroke="#c23b3b" stroke-width="3"/>
  <path d="M610 678 v20 M600 688 h20" stroke="#c23b3b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- eight tentacles: four drape the counter, two work, two curl at the base -->
  <g fill="none" stroke="url(#arm)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 610 C 400 640, 330 700, 280 760" stroke-width="38"/>
    <path d="M430 624 C 390 690, 360 760, 330 820" stroke-width="26"/>
    <path d="M520 630 C 500 710, 460 790, 500 840" stroke-width="30"/>
    <path d="M560 636 C 530 720, 560 800, 610 830" stroke-width="24"/>
    <path d="M680 624 C 730 690, 760 770, 720 840" stroke-width="30"/>
    <path d="M730 616 C 810 650, 880 700, 930 680" stroke-width="36"/>
    <path d="M780 608 C 860 640, 940 690, 1000 660" stroke-width="28"/>
    <path d="M500 618 C 430 600, 360 560, 300 580" stroke-width="32"/>
  </g>
  <!-- undersides where arms curl toward camera -->
  <g fill="#ffd3b8">
    <ellipse cx="330" cy="730" rx="8" ry="5.5" transform="rotate(28 330 730)"/>
    <ellipse cx="292" cy="754" rx="7" ry="5"/>
    <ellipse cx="348" cy="790" rx="6" ry="4.5"/>
    <ellipse cx="338" cy="816" rx="5.5" ry="4"/>
    <ellipse cx="478" cy="800" rx="6.5" ry="4.5"/>
    <ellipse cx="498" cy="832" rx="5.5" ry="4"/>
    <ellipse cx="590" cy="812" rx="6" ry="4"/>
    <ellipse cx="612" cy="828" rx="5" ry="3.5"/>
    <ellipse cx="742" cy="790" rx="6.5" ry="4.5"/>
    <ellipse cx="724" cy="828" rx="5.5" ry="4"/>
    <ellipse cx="860" cy="692" rx="8" ry="5.5"/>
    <ellipse cx="910" cy="682" rx="7" ry="5"/>
    <ellipse cx="960" cy="674" rx="6.5" ry="4.5"/>
    <ellipse cx="992" cy="662" rx="5.5" ry="4"/>
    <ellipse cx="360" cy="568" rx="7" ry="5"/>
    <ellipse cx="314" cy="578" rx="6" ry="4.5"/>
  </g>

  <!-- arm reaching over the counter to present the bowl -->
  <path d="M520 612 C 470 640, 430 660, 400 688" fill="none" stroke="url(#arm)" stroke-width="34" stroke-linecap="round"/>
  <ellipse cx="430" cy="672" rx="7" ry="5" fill="#ffd3b8" transform="rotate(-20 430 672)"/>
  <ellipse cx="404" cy="686" rx="6" ry="4.5" fill="#ffd3b8"/>

  <!-- pot -->
  <g>
    <ellipse cx="900" cy="590" rx="86" ry="24" fill="#3e434b"/>
    <path d="M814 590 V552 Q900 524 986 552 V590" fill="#5b616b" stroke="#2c3036" stroke-width="2"/>
    <ellipse cx="900" cy="552" rx="86" ry="22" fill="#343940"/>
    <ellipse cx="900" cy="552" rx="64" ry="14" fill="url(#broth)"/>
    <rect x="804" y="572" width="18" height="12" rx="2" fill="#2c3036"/>
    <rect x="978" y="572" width="18" height="12" rx="2" fill="#2c3036"/>
  </g>

  <!-- ladle -->
  <line x1="928" y1="676" x2="978" y2="548" stroke="#d2ae74" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="994" cy="534" rx="30" ry="16" fill="#e4e0d8" stroke="#8d9098" stroke-width="2" transform="rotate(-36 994 534)"/>
  <ellipse cx="998" cy="532" rx="16" ry="8" fill="#f2c14a" transform="rotate(-36 998 532)"/>

  <!-- ramen bowl -->
  <g>
    <ellipse cx="390" cy="712" rx="100" ry="30" fill="#c24e28"/>
    <path d="M292 712 Q296 778 390 790 Q484 778 488 712" fill="#e86a3c" stroke="#a33e1c" stroke-width="3"/>
    <ellipse cx="390" cy="710" rx="92" ry="26" fill="#f7f3ee" stroke="#ddd3c6" stroke-width="2"/>
    <ellipse cx="390" cy="710" rx="78" ry="19" fill="url(#broth)"/>
    <g fill="none" stroke="#f8e6ae" stroke-width="3.2" stroke-linecap="round">
      <path d="M332 706 Q360 692 386 708 Q414 724 444 700"/>
      <path d="M346 716 Q386 698 430 716"/>
      <path d="M358 698 Q392 718 436 700"/>
    </g>
    <ellipse cx="352" cy="704" rx="18" ry="12" fill="#fff6d6" stroke="#e4cc8e"/>
    <ellipse cx="352" cy="704" rx="8" ry="6" fill="#f0b429"/>
    <rect x="418" y="694" width="26" height="16" rx="3" fill="#f7f8f4" stroke="#d4546a" stroke-width="2"/>
    <path d="M436 692 v20" stroke="#2a6b3a" stroke-width="3"/>
    <path d="M424 702 q10 5 20 0" fill="#1e4e2c"/>
    <circle cx="408" cy="718" r="5.5" fill="#e23b3b"/>
    <circle cx="444" cy="714" r="4.5" fill="#f3d24b"/>
    <!-- bowl held by a curl of tentacle -->
    <path d="M470 760 C 500 800, 430 824, 360 800" fill="none" stroke="url(#arm)" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="400" cy="808" rx="6" ry="4" fill="#ffd3b8"/>
    <ellipse cx="368" cy="800" rx="5" ry="3.5" fill="#ffd3b8"/>
  </g>

  <!-- chopsticks -->
  <g stroke="#f0dcb4" stroke-width="4.5" stroke-linecap="round">
    <line x1="470" y1="676" x2="575" y2="642"/>
    <line x1="476" y1="686" x2="581" y2="652"/>
  </g>

  <!-- steam -->
  <g fill="none" stroke="#fffaf4" stroke-linecap="round" opacity="0.62" filter="url(#steamBlur)">
    <path stroke-width="5" d="M860 510 Q844 478 864 448">
      <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
        values="M860 510 Q844 478 864 448;M860 502 Q880 468 850 434;M860 510 Q844 478 864 448"/>
    </path>
    <path stroke-width="4" d="M900 500 Q922 462 892 430">
      <animate attributeName="d" dur="3.6s" repeatCount="indefinite"
        values="M900 500 Q922 462 892 430;M900 492 Q874 452 910 416;M900 500 Q922 462 892 430"/>
    </path>
    <path stroke-width="4" d="M940 516 Q958 482 934 456">
      <animate attributeName="d" dur="2.7s" repeatCount="indefinite"
        values="M940 516 Q958 482 934 456;M940 508 Q922 470 952 442;M940 516 Q958 482 934 456"/>
    </path>
    <path stroke-width="4" d="M360 670 Q344 640 362 612">
      <animate attributeName="d" dur="3s" repeatCount="indefinite"
        values="M360 670 Q344 640 362 612;M360 662 Q380 630 348 600;M360 670 Q344 640 362 612"/>
    </path>
    <path stroke-width="3.5" d="M410 662 Q428 634 404 608">
      <animate attributeName="d" dur="3.4s" repeatCount="indefinite"
        values="M410 662 Q428 634 404 608;M410 654 Q392 626 422 598;M410 662 Q428 634 404 608"/>
    </path>
  </g>

  <!-- order slip -->
  <g transform="rotate(-8 730 628)">
    <rect x="694" y="608" width="78" height="40" rx="3" fill="#fff8e8" stroke="#e2d2b4"/>
    <text x="733" y="626" text-anchor="middle" fill="#6a3a1e" font-family="Georgia, serif" font-size="11">tonkotsu</text>
    <text x="733" y="640" text-anchor="middle" fill="#6a3a1e" font-family="Georgia, serif" font-size="11">extra nori</text>
  </g>
</svg>
