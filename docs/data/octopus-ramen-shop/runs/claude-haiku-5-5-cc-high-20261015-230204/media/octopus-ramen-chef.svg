<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Octopus chef at a ramen booth</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b33"/>
      <stop offset="1" stop-color="#3b2a4f"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#c75f2a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a77bd8"/>
      <stop offset="1" stop-color="#6a3d9a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" x="90" y="0" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="40" fill="#c8102e"/>
      <rect x="40" y="0" width="40" height="40" fill="#fff4e0"/>
    </pattern>
  </defs>

  <style>
    .steam {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4;
      stroke-linecap: round;
      animation: rise 3s ease-in-out infinite;
    }
    .steam.b { animation-delay: 1s; }
    .steam.c { animation-delay: 2s; }
    @keyframes rise {
      0%, 100% { opacity: 0.15; transform: translateY(6px); }
      50% { opacity: 0.7; transform: translateY(-8px); }
    }
  </style>

  <!-- Night sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="25" cy="20" r="1.5"/>
    <circle cx="140" cy="12" r="1.5"/>
    <circle cx="260" cy="18" r="1.5"/>
    <circle cx="520" cy="14" r="1.5"/>
    <circle cx="600" cy="28" r="1.5"/>
    <circle cx="760" cy="20" r="1.5"/>
    <circle cx="30" cy="150" r="1.5"/>
    <circle cx="55" cy="330" r="1.5"/>
    <circle cx="745" cy="130" r="1.5"/>
    <circle cx="770" cy="380" r="1.5"/>
  </g>
  <circle cx="50" cy="60" r="22" fill="#f6e7b4" opacity="0.9"/>

  <!-- Back wall of the booth -->
  <rect x="124" y="84" width="552" height="320" fill="url(#wall)"/>

  <!-- Awning: striped valance, scalloped edge -->
  <rect x="84" y="26" width="632" height="10" fill="#7a0c1f"/>
  <rect x="90" y="34" width="620" height="40" fill="url(#stripes)"/>
  <g>
    <circle cx="110" cy="70" r="20" fill="#c8102e"/>
    <circle cx="150" cy="70" r="20" fill="#fff4e0"/>
    <circle cx="190" cy="70" r="20" fill="#c8102e"/>
    <circle cx="230" cy="70" r="20" fill="#fff4e0"/>
    <circle cx="270" cy="70" r="20" fill="#c8102e"/>
    <circle cx="310" cy="70" r="20" fill="#fff4e0"/>
    <circle cx="350" cy="70" r="20" fill="#c8102e"/>
    <circle cx="390" cy="70" r="20" fill="#fff4e0"/>
    <circle cx="430" cy="70" r="20" fill="#c8102e"/>
    <circle cx="470" cy="70" r="20" fill="#fff4e0"/>
    <circle cx="510" cy="70" r="20" fill="#c8102e"/>
    <circle cx="550" cy="70" r="20" fill="#fff4e0"/>
    <circle cx="590" cy="70" r="20" fill="#c8102e"/>
    <circle cx="630" cy="70" r="20" fill="#fff4e0"/>
    <circle cx="670" cy="70" r="20" fill="#c8102e"/>
    <circle cx="710" cy="70" r="20" fill="#fff4e0"/>
  </g>

  <!-- Lanterns hanging from the awning -->
  <g transform="translate(170 0)">
    <line x1="0" y1="90" x2="0" y2="157" stroke="#2a1a10" stroke-width="2"/>
    <circle cx="0" cy="185" r="70" fill="url(#glow)"/>
    <ellipse cx="0" cy="185" rx="24" ry="28" fill="#e53b2b" stroke="#7a1a10" stroke-width="2"/>
    <ellipse cx="0" cy="185" rx="11" ry="28" fill="none" stroke="#7a1a10" stroke-width="1.5" opacity="0.6"/>
    <rect x="-14" y="157" width="28" height="6" fill="#2b1a12"/>
    <rect x="-14" y="207" width="28" height="6" fill="#2b1a12"/>
  </g>
  <g transform="translate(630 0)">
    <line x1="0" y1="90" x2="0" y2="157" stroke="#2a1a10" stroke-width="2"/>
    <circle cx="0" cy="185" r="70" fill="url(#glow)"/>
    <ellipse cx="0" cy="185" rx="24" ry="28" fill="#e53b2b" stroke="#7a1a10" stroke-width="2"/>
    <ellipse cx="0" cy="185" rx="11" ry="28" fill="none" stroke="#7a1a10" stroke-width="1.5" opacity="0.6"/>
    <rect x="-14" y="157" width="28" height="6" fill="#2b1a12"/>
    <rect x="-14" y="207" width="28" height="6" fill="#2b1a12"/>
  </g>

  <!-- Wall signs -->
  <rect x="205" y="190" width="110" height="46" rx="5" fill="#2b1a12" stroke="#f3d28a" stroke-width="2"/>
  <text x="260" y="221" text-anchor="middle" font-size="22" fill="#ffe9b0" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif">ラーメン</text>
  <rect x="485" y="190" width="110" height="46" rx="5" fill="#2b1a12" stroke="#f3d28a" stroke-width="2"/>
  <text x="540" y="221" text-anchor="middle" font-size="22" fill="#ffe9b0" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif">営業中</text>

  <!-- Octopus chef: mantle head -->
  <path d="M 330 250 C 320 170 360 140 400 140 C 440 140 480 170 470 250 C 466 300 440 335 400 340 C 360 335 334 300 330 250 Z" fill="url(#body)" stroke="#4a2a70" stroke-width="3"/>
  <ellipse cx="365" cy="185" rx="12" ry="20" fill="#ffffff" opacity="0.15" transform="rotate(-15 365 185)"/>
  <g fill="#c99ae8" opacity="0.45">
    <circle cx="338" cy="236" r="4"/>
    <circle cx="380" cy="190" r="4"/>
    <circle cx="420" cy="200" r="4"/>
    <circle cx="362" cy="178" r="6"/>
    <circle cx="440" cy="178" r="5"/>
    <circle cx="458" cy="206" r="6"/>
  </g>

  <!-- Face -->
  <ellipse cx="370" cy="256" rx="20" ry="24" fill="#ffffff" stroke="#2a1040" stroke-width="3"/>
  <ellipse cx="430" cy="256" rx="20" ry="24" fill="#ffffff" stroke="#2a1040" stroke-width="3"/>
  <circle cx="374" cy="262" r="10" fill="#1a0a20"/>
  <circle cx="426" cy="262" r="10" fill="#1a0a20"/>
  <circle cx="378" cy="256" r="3.5" fill="#ffffff"/>
  <circle cx="430" cy="256" r="3.5" fill="#ffffff"/>
  <ellipse cx="346" cy="292" rx="12" ry="7" fill="#ff7f9c" opacity="0.55"/>
  <ellipse cx="454" cy="292" rx="12" ry="7" fill="#ff7f9c" opacity="0.55"/>
  <path d="M 386 296 Q 400 312 414 296" fill="none" stroke="#2a1040" stroke-width="3" stroke-linecap="round"/>

  <!-- Chef's toque (hat) -->
  <g fill="#ffffff" stroke="#d5dbe5" stroke-width="2">
    <circle cx="360" cy="142" r="24"/>
    <circle cx="400" cy="124" r="30"/>
    <circle cx="440" cy="142" r="24"/>
    <circle cx="378" cy="148" r="20"/>
    <circle cx="422" cy="148" r="20"/>
  </g>
  <rect x="334" y="150" width="132" height="22" rx="5" fill="#ffffff" stroke="#d5dbe5" stroke-width="2"/>

  <!-- Apron -->
  <path d="M 342 300 Q 400 318 458 300 L 474 398 L 326 398 Z" fill="#b8323a" stroke="#7d1a22" stroke-width="2"/>
  <path d="M 342 300 Q 400 332 458 300" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Counter -->
  <rect x="124" y="398" width="552" height="14" fill="#a8703a" stroke="#6b4422" stroke-width="2"/>
  <rect x="124" y="412" width="552" height="108" fill="#5c3a1e"/>
  <g stroke="#472b14" stroke-width="2" opacity="0.6">
    <line x1="124" y1="440" x2="676" y2="440"/>
    <line x1="124" y1="470" x2="676" y2="470"/>
    <line x1="124" y1="500" x2="676" y2="500"/>
  </g>

  <!-- Street below the booth -->
  <rect x="0" y="520" width="800" height="80" fill="#221c2a"/>
  <ellipse cx="400" cy="535" rx="280" ry="10" fill="#ffb35c" opacity="0.12"/>

  <!-- Posts (drawn over the ground line edges) -->
  <rect x="110" y="84" width="14" height="436" fill="#4a2c18"/>
  <rect x="676" y="84" width="14" height="436" fill="#4a2c18"/>

  <!-- Tentacle draped over the counter edge -->
  <path d="M 300 404 C 288 430 318 446 306 470 C 296 490 316 500 326 486" fill="none" stroke="#7d4fb0" stroke-width="16" stroke-linecap="round"/>
  <path d="M 300 404 C 288 430 318 446 306 470 C 296 490 316 500 326 486" fill="none" stroke="#e9d3ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 9" opacity="0.75"/>

  <!-- Left arm holding a ladle -->
  <path d="M 340 330 C 290 330 250 350 242 396" fill="none" stroke="#7d4fb0" stroke-width="24" stroke-linecap="round"/>
  <path d="M 340 330 C 290 330 250 350 242 396" fill="none" stroke="#e9d3ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 11" opacity="0.75"/>
  <path d="M 242 390 L 200 322" stroke="#6b4a2a" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="194" cy="312" rx="14" ry="11" fill="#9aa5b1" stroke="#4a5560" stroke-width="2" transform="rotate(-30 194 312)"/>

  <!-- Right arm holding chopsticks -->
  <path d="M 460 330 C 510 330 550 350 558 396" fill="none" stroke="#7d4fb0" stroke-width="24" stroke-linecap="round"/>
  <path d="M 460 330 C 510 330 550 350 558 396" fill="none" stroke="#e9d3ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 11" opacity="0.75"/>
  <path d="M 552 388 L 612 312 M 560 392 L 622 318" stroke="#f0d9a8" stroke-width="4" stroke-linecap="round"/>

  <!-- Ramen bowl -->
  <path d="M 322 366 Q 322 404 400 404 Q 478 404 478 366 Z" fill="#2c3e6b" stroke="#1a2540" stroke-width="2"/>
  <ellipse cx="400" cy="366" rx="78" ry="13" fill="#f7f3ea" stroke="#1a2540" stroke-width="2"/>
  <ellipse cx="400" cy="367" rx="70" ry="9" fill="#d88a2c"/>
  <path d="M 345 367 q 10 -4 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0" fill="none" stroke="#ffe27a" stroke-width="3"/>
  <path d="M 350 372 q 10 -4 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0" fill="none" stroke="#ffd65a" stroke-width="3"/>
  <ellipse cx="362" cy="363" rx="14" ry="8" fill="#e88a73" stroke="#fff5e6" stroke-width="3"/>
  <rect x="424" y="352" width="14" height="20" fill="#1f4d24" transform="rotate(15 431 362)"/>
  <ellipse cx="442" cy="368" rx="13" ry="9" fill="#fffdf5" stroke="#e8dcc0" stroke-width="1"/>
  <circle cx="444" cy="367" r="5" fill="#ffa51f"/>
  <g fill="#7fdc6a">
    <circle cx="386" cy="372" r="3"/>
    <circle cx="394" cy="368" r="3"/>
    <circle cx="378" cy="374" r="2.5"/>
  </g>

  <!-- Steam rising from the bowl -->
  <path class="steam" d="M 382 352 C 372 335 392 325 382 306"/>
  <path class="steam b" d="M 402 350 C 392 332 412 320 402 300"/>
  <path class="steam c" d="M 420 352 C 410 336 430 326 420 308"/>
</svg>
