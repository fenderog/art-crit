<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1640"/><stop offset="1" stop-color="#4a2c5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.8"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a0623a"/><stop offset="1" stop-color="#6b3a1e"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff9a9a"/><stop offset="1" stop-color="#d9475a"/>
    </radialGradient>
    <radialGradient id="broth" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f5c06a"/><stop offset="1" stop-color="#c9822f"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="80" cy="60" r="1.5"/><circle cx="200" cy="30" r="1"/><circle cx="620" cy="50" r="1.5"/>
    <circle cx="720" cy="110" r="1"/><circle cx="350" cy="20" r="1"/><circle cx="500" cy="80" r="1.2"/>
  </g>
  <circle cx="690" cy="70" r="30" fill="#fdf1c7"/>
  <!-- ground -->
  <rect y="520" width="800" height="80" fill="#2a1f2e"/>
  <!-- booth posts & roof -->
  <rect x="110" y="140" width="22" height="390" fill="#5a2f17"/>
  <rect x="668" y="140" width="22" height="390" fill="#5a2f17"/>
  <path d="M80 150 L400 90 L720 150 L720 175 L80 175 Z" fill="#8a2a24"/>
  <path d="M80 150 L400 90 L720 150" fill="none" stroke="#5e1a16" stroke-width="8"/>
  <!-- noren curtains -->
  <g>
    <rect x="132" y="175" width="536" height="8" fill="#3a1a10"/>
    <g fill="#1f3a6b" stroke="#16294d" stroke-width="2">
      <rect x="140" y="183" width="100" height="70"/><rect x="246" y="183" width="100" height="70"/>
      <rect x="454" y="183" width="100" height="70"/><rect x="560" y="183" width="100" height="70"/>
    </g>
    <g fill="#f3ead8" font-family="serif" font-size="44" text-anchor="middle" font-weight="bold">
      <text x="190" y="234">ラ</text><text x="296" y="234">ー</text>
      <text x="504" y="234">メ</text><text x="610" y="234">ン</text>
    </g>
  </g>
  <!-- lanterns -->
  <g>
    <circle cx="95" cy="230" r="60" fill="url(#glow)"/><circle cx="705" cy="230" r="60" fill="url(#glow)"/>
    <line x1="95" y1="175" x2="95" y2="195" stroke="#222" stroke-width="2"/>
    <line x1="705" y1="175" x2="705" y2="195" stroke="#222" stroke-width="2"/>
    <ellipse cx="95" cy="232" rx="24" ry="36" fill="#e63b2e"/><ellipse cx="705" cy="232" rx="24" ry="36" fill="#e63b2e"/>
    <g stroke="#a82219" stroke-width="1.5" fill="none">
      <path d="M73 220 Q95 226 117 220 M71 235 Q95 241 119 235 M75 250 Q95 255 115 250"/>
      <path d="M683 220 Q705 226 727 220 M681 235 Q705 241 729 235 M685 250 Q705 255 725 250"/>
    </g>
    <rect x="85" y="194" width="20" height="6" fill="#222"/><rect x="85" y="264" width="20" height="6" fill="#222"/>
    <rect x="695" y="194" width="20" height="6" fill="#222"/><rect x="695" y="264" width="20" height="6" fill="#222"/>
  </g>
  <!-- back wall -->
  <rect x="132" y="253" width="536" height="160" fill="#3b2418"/>
  <g fill="#c9b48a"><rect x="560" y="280" width="80" height="6"/><rect x="560" y="320" width="80" height="6"/></g>
  <g><rect x="568" y="262" width="16" height="18" fill="#e8e2d0"/><rect x="592" y="266" width="14" height="14" fill="#b8312a"/><rect x="614" y="260" width="18" height="20" fill="#e8e2d0"/>
     <rect x="570" y="300" width="22" height="20" fill="#7a4a2a"/><rect x="600" y="304" width="30" height="16" fill="#d9d1b8"/></g>
  <!-- steam from pot -->
  <g fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round">
    <path d="M200 330 q-12 -20 0 -40 q12 -20 0 -40"/><path d="M230 335 q12 -20 0 -40 q-12 -20 0 -40"/>
  </g>
  <!-- octopus -->
  <g id="octopus">
    <!-- tentacles behind counter (some reach up) -->
    <g fill="url(#skin)" stroke="#a8303f" stroke-width="2">
      <!-- left arm holding ladle into pot -->
      <path d="M340 360 C300 350 270 330 250 340 C240 346 246 356 256 354 C275 346 300 370 345 385 Z"/>
      <!-- right arm holding chopsticks -->
      <path d="M455 360 C500 340 520 300 545 300 C556 300 556 312 546 314 C528 318 512 360 460 388 Z"/>
      <!-- arm waving -->
      <path d="M440 330 C470 300 480 270 505 262 C516 259 520 270 510 275 C492 282 485 310 452 345 Z"/>
    </g>
    <!-- head -->
    <ellipse cx="400" cy="330" rx="78" ry="74" fill="url(#skin)" stroke="#a8303f" stroke-width="2"/>
    <g fill="#f7b6b6" opacity="0.7"><circle cx="360" cy="300" r="7"/><circle cx="440" cy="295" r="5"/><circle cx="430" cy="315" r="4"/></g>
    <!-- chef hat -->
    <g stroke="#ccc" stroke-width="2" fill="#fff">
      <rect x="352" y="242" width="96" height="30" rx="4"/>
      <circle cx="365" cy="225" r="28"/><circle cx="400" cy="210" r="34"/><circle cx="435" cy="225" r="28"/>
      <rect x="352" y="232" width="96" height="16" stroke="none"/>
    </g>
    <!-- headband -->
    <rect x="337" y="282" width="126" height="10" rx="5" fill="#fff" transform="rotate(-3 400 287)"/>
    <circle cx="400" cy="285" r="6" fill="#d22"/>
    <!-- eyes -->
    <g>
      <ellipse cx="375" cy="330" rx="13" ry="16" fill="#fff"/><ellipse cx="425" cy="330" rx="13" ry="16" fill="#fff"/>
      <circle cx="378" cy="334" r="7" fill="#1a1a2a"/><circle cx="428" cy="334" r="7" fill="#1a1a2a"/>
      <circle cx="381" cy="330" r="2.5" fill="#fff"/><circle cx="431" cy="330" r="2.5" fill="#fff"/>
    </g>
    <ellipse cx="352" cy="358" rx="10" ry="5" fill="#ff6f8a" opacity="0.6"/><ellipse cx="448" cy="358" rx="10" ry="5" fill="#ff6f8a" opacity="0.6"/>
    <path d="M388 362 Q400 374 412 362" fill="none" stroke="#6a1a26" stroke-width="3" stroke-linecap="round"/>
    <!-- ladle -->
    <line x1="258" y1="346" x2="215" y2="380" stroke="#999" stroke-width="5" stroke-linecap="round"/>
    <!-- chopsticks -->
    <g stroke="#d9a65a" stroke-width="4" stroke-linecap="round">
      <line x1="548" y1="300" x2="520" y2="380"/><line x1="553" y1="303" x2="532" y2="382"/>
    </g>
    <!-- dangling noodles -->
    <path d="M524 372 q-4 14 2 26 M530 374 q4 14 -2 26 M527 373 q0 14 0 28" fill="none" stroke="#f3d58a" stroke-width="2.5"/>
    <!-- apron -->
    <path d="M345 375 Q400 395 455 375 L460 415 L340 415 Z" fill="#f3ead8" stroke="#ccc" stroke-width="2"/>
  </g>
  <!-- stove pot -->
  <g>
    <rect x="160" y="370" width="110" height="45" rx="6" fill="#555" stroke="#333" stroke-width="2"/>
    <ellipse cx="215" cy="370" rx="55" ry="10" fill="#c9822f" stroke="#333" stroke-width="2"/>
  </g>
  <!-- counter -->
  <rect x="100" y="410" width="600" height="22" fill="#c78a55"/>
  <rect x="120" y="432" width="560" height="98" fill="url(#wood)"/>
  <g stroke="#5a2f17" stroke-width="2" opacity="0.6"><line x1="120" y1="465" x2="680" y2="465"/><line x1="120" y1="498" x2="680" y2="498"/></g>
  <!-- ramen bowl on counter -->
  <g>
    <g fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
      <path d="M380 375 q-10 -15 0 -30"/><path d="M405 370 q10 -18 0 -36"/><path d="M430 375 q-10 -15 0 -30"/>
    </g>
    <path d="M330 395 Q405 470 480 395 Z" fill="#2b3f7a"/>
    <path d="M345 412 Q405 440 465 412" fill="none" stroke="#f3ead8" stroke-width="3"/>
    <ellipse cx="405" cy="395" rx="75" ry="14" fill="url(#broth)" stroke="#1d2c58" stroke-width="3"/>
    <g fill="none" stroke="#f6dc94" stroke-width="2.5">
      <path d="M350 396 q15 -6 30 0 t30 0 t30 0"/><path d="M360 400 q15 -6 30 0 t30 0 t30 0"/>
    </g>
    <!-- egg, naruto, chashu, nori, scallions -->
    <ellipse cx="440" cy="392" rx="14" ry="7" fill="#fff"/><ellipse cx="440" cy="392" rx="7" ry="4" fill="#f29a1e"/>
    <ellipse cx="378" cy="391" rx="11" ry="5" fill="#fff"/><path d="M371 391 q7 -4 14 0 q-7 3 -10 0" fill="none" stroke="#e2557a" stroke-width="1.6"/>
    <ellipse cx="408" cy="389" rx="14" ry="6" fill="#b5653a"/><ellipse cx="408" cy="389" rx="8" ry="3" fill="#e6a37a"/>
    <rect x="455" y="368" width="18" height="26" fill="#1d3a22" transform="rotate(15 464 381)"/>
    <g fill="#5cb34a"><circle cx="395" cy="397" r="2"/><circle cx="422" cy="398" r="2"/><circle cx="360" cy="394" r="2"/><circle cx="428" cy="386" r="2"/></g>
  </g>
  <!-- stools -->
  <g fill="#8a2a24"><rect x="220" y="520" width="70" height="14" rx="6"/><rect x="510" y="520" width="70" height="14" rx="6"/></g>
  <g fill="#333"><rect x="248" y="534" width="14" height="50"/><rect x="538" y="534" width="14" height="50"/></g>
  <!-- lower tentacle peeking under counter -->
  <path d="M680 470 C700 480 720 500 735 520 C742 530 730 535 724 526 C712 508 696 494 680 490 Z" fill="url(#skin)" stroke="#a8303f" stroke-width="2"/>
</svg>
