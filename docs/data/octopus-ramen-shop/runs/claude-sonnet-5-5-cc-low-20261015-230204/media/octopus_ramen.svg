<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f4b"/><stop offset="1" stop-color="#5a3a7a"/></linearGradient>
<radialGradient id="oct" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ff8f7a"/><stop offset="1" stop-color="#d9434f"/></radialGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="600" fill="url(#sky)"/>
<g fill="#ffe9a8" opacity=".8"><circle cx="90" cy="60" r="2"/><circle cx="300" cy="40" r="2"/><circle cx="700" cy="80" r="2"/><circle cx="520" cy="30" r="1.5"/></g>
<!-- booth -->
<rect x="60" y="90" width="680" height="400" fill="#3b2418"/>
<rect x="60" y="90" width="680" height="30" fill="#7a2230"/>
<path d="M60 120h680v70l-34-20-34 20-34-20-34 20-34-20-34 20-34-20-34 20-34-20-34 20-34-20-34 20-34-20-34 20-34-20-34 20-34-20-34 20-34-20-34 20-34-20z" fill="#c8323f"/>
<text x="400" y="112" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffe9a8" text-anchor="middle">RAMEN 🍜 蛸 屋</text>
<!-- lanterns -->
<g><line x1="130" y1="190" x2="130" y2="215" stroke="#222"/><ellipse cx="130" cy="245" rx="32" ry="30" fill="#e8402f"/><circle cx="130" cy="245" r="60" fill="url(#glow)"/><text x="130" y="253" font-size="24" text-anchor="middle" fill="#ffe9a8" font-family="sans-serif">麺</text>
<line x1="670" y1="190" x2="670" y2="215" stroke="#222"/><ellipse cx="670" cy="245" rx="32" ry="30" fill="#e8402f"/><circle cx="670" cy="245" r="60" fill="url(#glow)"/><text x="670" y="253" font-size="24" text-anchor="middle" fill="#ffe9a8" font-family="sans-serif">湯</text></g>
<!-- shelf pots -->
<rect x="200" y="300" width="400" height="10" fill="#6b4328"/>
<g fill="#8aa"><rect x="230" y="270" width="40" height="30" rx="4"/><rect x="530" y="270" width="40" height="30" rx="4"/></g>
<!-- steam -->
<g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"><path d="M350 420q-15-30 0-50t0-45"/><path d="M400 420q-15-30 0-50t0-45"/><path d="M450 420q15-30 0-50t0-45"/></g>
<!-- tentacles back -->
<g fill="url(#oct)" stroke="#a52f3c" stroke-width="3">
<path d="M290 430q-90 20-110-40q-10-30 20-30q-5 40 100 40z"/>
<path d="M510 430q90 20 110-40q10-30-20-30q5 40-100 40z"/></g>
<!-- body -->
<ellipse cx="400" cy="270" rx="120" ry="130" fill="url(#oct)" stroke="#a52f3c" stroke-width="3"/>
<ellipse cx="400" cy="410" rx="105" ry="45" fill="url(#oct)"/>
<g fill="#ff6b6b" opacity=".5"><circle cx="340" cy="200" r="8"/><circle cx="470" cy="210" r="6"/><circle cx="450" cy="170" r="5"/></g>
<!-- hat -->
<path d="M310 190q-40-20-20-60q10-30 50-20q20-45 60-30q35-25 70 10q50-5 50 40q0 40-30 60z" fill="#fff" stroke="#ddd" stroke-width="3"/>
<rect x="305" y="170" width="190" height="32" rx="6" fill="#fff" stroke="#ccc" stroke-width="3"/>
<!-- eyes -->
<g><ellipse cx="355" cy="250" rx="30" ry="34" fill="#fff"/><ellipse cx="445" cy="250" rx="30" ry="34" fill="#fff"/>
<circle cx="362" cy="255" r="14" fill="#222"/><circle cx="438" cy="255" r="14" fill="#222"/>
<circle cx="367" cy="249" r="5" fill="#fff"/><circle cx="443" cy="249" r="5" fill="#fff"/></g>
<path d="M330 218q25-15 50-3M420 215q25-12 50 3" stroke="#7a1f2b" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M370 305q30 28 60 0" stroke="#7a1f2b" stroke-width="5" fill="none" stroke-linecap="round"/>
<ellipse cx="320" cy="290" rx="14" ry="8" fill="#ff5a6e" opacity=".6"/><ellipse cx="480" cy="290" rx="14" ry="8" fill="#ff5a6e" opacity=".6"/>
<!-- apron -->
<path d="M335 350h130l10 80h-150z" fill="#f4f0e6" stroke="#ccc" stroke-width="2"/>
<!-- counter -->
<rect x="40" y="440" width="720" height="40" rx="6" fill="#a8693a"/>
<rect x="40" y="440" width="720" height="10" fill="#c98a55"/>
<rect x="60" y="480" width="680" height="120" fill="#4a2c1a"/>
<!-- bowl -->
<path d="M330 435h140q0 55-70 55t-70-55z" fill="#fff" stroke="#c8323f" stroke-width="4" transform="translate(0,-18)"/>
<ellipse cx="400" cy="417" rx="70" ry="12" fill="#e8a040"/>
<path d="M350 417q15-8 30 0t30 0 30 0" stroke="#fff3c0" stroke-width="3" fill="none"/>
<circle cx="380" cy="414" r="8" fill="#fff"/><circle cx="380" cy="414" r="3.5" fill="#f0a020"/>
<rect x="415" y="408" width="30" height="8" rx="2" fill="#3a6b35"/>
<circle cx="365" cy="418" r="5" fill="#d94" />
<!-- front tentacles holding chopsticks/ladle -->
<g fill="url(#oct)" stroke="#a52f3c" stroke-width="3">
<path d="M300 400q-30 50 20 45q40-3 50-25q-40 5-45-30z"/>
<path d="M500 400q30 50-20 45q-40-3-50-25q40 5 45-30z"/></g>
<line x1="540" y1="330" x2="445" y2="415" stroke="#d9a35a" stroke-width="5" stroke-linecap="round"/>
<line x1="550" y1="345" x2="452" y2="420" stroke="#d9a35a" stroke-width="5" stroke-linecap="round"/>
<path d="M560 250q20 70-20 100q-40 30-70 30" fill="none" stroke="url(#oct)" stroke-width="22" stroke-linecap="round"/>
<path d="M240 330q-40 40-20 90" fill="none" stroke="#e35a60" stroke-width="22" stroke-linecap="round"/>
<g fill="#ffe9a8"><circle cx="150" cy="520" r="4"/><circle cx="650" cy="530" r="4"/></g>
<!-- stools -->
<g fill="#7a2230"><rect x="120" y="500" width="90" height="16" rx="6"/><rect x="590" y="500" width="90" height="16" rx="6"/></g>
</svg>
