  <circle cx="-18" cy="-8" r="8" fill="white" stroke="#2A7F6F" stroke-width="2"/><circle cx="-18" cy="-8" r="4" fill="#222"/>
  <circle cx="18" cy="-8" r="8" fill="white" stroke="#2A7F6F" stroke-width="2"/><circle cx="18" cy="-8" r="4" fill="#222"/>
  <path d="M -10 8 Q 0 14 10 8" stroke="#1E5A4E" stroke-width="3" fill="none" stroke-linecap="round"/>
