  <path d="M 510 480 Q 520 510 550 515 Q 570 518 570 505 Q 570 492 545 488 Q 520 484 505 470 Z" fill="url(#octo)" stroke="#B93A5E" stroke-width="4"/>
  <!-- suction cups -->
