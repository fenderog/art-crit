  <circle cx="421" cy="377" r="3.2" fill="white"/><circle cx="485" cy="377" r="3.2" fill="white"/>
  <path d="M 435 408 Q 450 422 465 408" fill="none" stroke="#5A2A3A" stroke-width="4" stroke-linecap="round"/>
  <!-- neckerchief -->
