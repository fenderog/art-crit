<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Octopus chef at a ramen booth</title>
<desc id="desc">A cheerful pink octopus wearing a chef hat, serving ramen from a cozy wooden booth with lanterns, noren curtains and steaming bowls.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF6DE"/><stop offset="1" stop-color="#FFE9B8"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#C67B45"/><stop offset="1" stop-color="#9A5528"/>
  </linearGradient>
  <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E8A86A"/><stop offset="1" stop-color="#C67B45"/>
  </linearGradient>
  <radialGradient id="octo" cx="42%" cy="32%" r="78%">
    <stop offset="0" stop-color="#FFB3A0"/><stop offset=".48" stop-color="#FF8A7A"/><stop offset="1" stop-color="#F25E4D"/>
  </radialGradient>
  <radialGradient id="belly" cx="50%" cy="40%" r="65%">
    <stop offset="0" stop-color="#FFE3D6"/><stop offset="1" stop-color="#FFC4B0"/>
  </radialGradient>
  <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2E4A8A"/><stop offset="1" stop-color="#1E3266"/>
  </linearGradient>
  <radialGradient id="broth" cx="50%" cy="42%" r="60%">
    <stop offset="0" stop-color="#FFD97A"/><stop offset=".7" stop-color="#F2A93B"/><stop offset="1" stop-color="#D97E1E"/>
  </radialGradient>
  <radialGradient id="lantern" cx="42%" cy="32%" r="75%">
    <stop offset="0" stop-color="#FFE9A8"/><stop offset=".55" stop-color="#FF9E3D"/><stop offset="1" stop-color="#E85D1A"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7A3B12" flood-opacity="0.22"/></filter>
</defs>

