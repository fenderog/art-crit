<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .steam { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; opacity: 0.45; animation: rise 3.5s ease-in-out infinite; }
      .steam.b { animation-delay: 1.2s; }
      .steam.c { animation-delay: 2.4s; }
      @keyframes rise {
        0%, 100% { opacity: 0.15; transform: translateY(6px); }
        50% { opacity: 0.55; transform: translateY(-6px); }
      }
    </style>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2c1c"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#a06cc4"/>
      <stop offset="100%" stop-color="#6b3f90"/>
    </linearGradient>
  </defs>

  <!-- Background wall -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <g stroke="#3a2214" stroke-width="2" opacity="0.6">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="370" x2="800" y2="370"/>
  </g>

  <!-- Lanterns -->
  <g>
    <line x1="130" y1="0" x2="130" y2="70" stroke="#1a0e08" stroke-width="3"/>
    <circle cx="130" cy="92" r="60" fill="url(#glow)"/>
    <ellipse cx="130" cy="92" rx="22" ry="28" fill="#ffb347"/>
    <line x1="670" y1="0" x2="670" y2="70" stroke="#1a0e08" stroke-width="3"/>
    <circle cx="670" cy="92" r="60" fill="url(#glow)"/>
    <ellipse cx="670" cy="92" rx="22" ry="28" fill="#ffb347"/>
  </g>

  <!-- Noren curtain -->
  <g>
    <rect x="200" y="0" width="400" height="20" fill="#1a0e08"/>
    <rect x="200" y="20" width="50" height="95" fill="#c0392b"/>
    <rect x="250" y="20" width="50" height="95" fill="#f5e6c8"/>
    <rect x="300" y="20" width="50" height="95" fill="#c0392b"/>
    <rect x="350" y="20" width="50" height="95" fill="#f5e6c8"/>
    <rect x="400" y="20" width="50" height="95" fill="#c0392b"/>
    <rect x="450" y="20" width="50" height="95" fill="#f5e6c8"/>
    <rect x="500" y="20" width="50" height="95" fill="#c0392b"/>
    <rect x="550" y="20" width="50" height="95" fill="#f5e6c8"/>
    <rect x="200" y="20" width="400" height="6" fill="#1a0e08" opacity="0.3"/>
  </g>
  <!-- Shop sign -->
  <rect x="318" y="128" width="164" height="46" rx="6" fill="#c0392b" stroke="#f5e6c8" stroke-width="3"/>
  <text x="400" y="160" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="28" fill="#f5e6c8" text-anchor="middle" letter-spacing="4">RAMEN</text>

  <!-- Octopus chef: head/mantle -->
  <ellipse cx="520" cy="230" rx="120" ry="130" fill="url(#head)"/>
  <g fill="#b77fd6" opacity="0.5">
    <circle cx="430" cy="250" r="6"/>
    <circle cx="445" cy="300" r="4"/>
    <circle cx="600" cy="260" r="6"/>
    <circle cx="590" cy="310" r="4"/>
    <circle cx="520" cy="335" r="5"/>
  </g>

  <!-- Chef's toque -->
  <rect x="440" y="112" width="160" height="34" rx="6" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
  <ellipse cx="462" cy="100" rx="34" ry="30" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
  <ellipse cx="505" cy="84" rx="40" ry="34" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
  <ellipse cx="558" cy="84" rx="40" ry="34" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
  <ellipse cx="598" cy="100" rx="34" ry="30" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>

  <!-- Face -->
  <circle cx="480" cy="228" r="26" fill="#ffffff"/>
  <circle cx="488" cy="234" r="12" fill="#1a0e1f"/>
  <circle cx="492" cy="229" r="4" fill="#ffffff"/>
  <circle cx="560" cy="228" r="26" fill="#ffffff"/>
  <circle cx="568" cy="234" r="12" fill="#1a0e1f"/>
  <circle cx="572" cy="229" r="4" fill="#ffffff"/>
  <ellipse cx="455" cy="268" rx="14" ry="8" fill="#ff7aa2" opacity="0.5"/>
  <ellipse cx="585" cy="268" rx="14" ry="8" fill="#ff7aa2" opacity="0.5"/>
  <path d="M 492 276 Q 520 302 550 276" fill="none" stroke="#3b1d4a" stroke-width="4" stroke-linecap="round"/>

  <!-- Counter -->
  <rect x="0" y="420" width="800" height="22" fill="#a46b35"/>
  <rect x="0" y="442" width="800" height="158" fill="#5a3520"/>
  <g stroke="#43251a" stroke-width="2">
    <line x1="0" y1="490" x2="800" y2="490"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
  </g>

  <!-- Broth pot on the stove -->
  <rect x="160" y="330" width="140" height="90" rx="10" fill="#3d3d3d"/>
  <ellipse cx="230" cy="330" rx="70" ry="12" fill="#2a2a2a"/>
  <ellipse cx="230" cy="332" rx="62" ry="8" fill="#d9a441"/>
  <rect x="140" y="352" width="22" height="10" rx="4" fill="#2a2a2a"/>
  <rect x="298" y="352" width="22" height="10" rx="4" fill="#2a2a2a"/>
  <path class="steam" d="M 205 300 q 12 -18 0 -36 t 0 -36"/>
  <path class="steam b" d="M 232 296 q 12 -18 0 -36 t 0 -36"/>
  <path class="steam c" d="M 258 300 q 12 -18 0 -36 t 0 -36"/>

  <!-- Served bowl on the counter -->
  <path d="M 322 420 Q 324 472 380 474 Q 436 472 438 420 Z" fill="#f7f3ea" stroke="#c8102e" stroke-width="3"/>
  <ellipse cx="380" cy="420" rx="58" ry="12" fill="#e8a33d"/>
  <path d="M 336 418 q 8 -6 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" fill="none" stroke="#f6d365" stroke-width="4" stroke-linecap="round"/>
  <path d="M 344 412 q 8 -6 16 0 t 16 0 t 16 0 t 16 0 t 16 0" fill="none" stroke="#f6d365" stroke-width="4" stroke-linecap="round"/>
  <circle cx="405" cy="414" r="13" fill="#ffffff"/>
  <circle cx="405" cy="414" r="6" fill="#f9a825"/>
  <rect x="352" y="406" width="14" height="22" rx="2" fill="#1d3b1d" transform="rotate(-20 359 417)"/>
  <circle cx="352" cy="426" r="3" fill="#7ccf4a"/>
  <circle cx="362" cy="430" r="3" fill="#7ccf4a"/>
  <circle cx="392" cy="430" r="3" fill="#7ccf4a"/>
  <path d="M 336 440 Q 380 456 424 440" fill="none" stroke="#c8102e" stroke-width="3" opacity="0.6"/>

  <!-- Steam over bowl -->
  <path class="steam c" d="M 370 395 q 10 -16 0 -32 t 0 -32" stroke-width="4"/>
  <path class="steam" d="M 392 395 q 10 -16 0 -32 t 0 -32" stroke-width="4"/>

  <!-- Tentacles (arms) -->
  <g fill="none" stroke="#8e5ab5" stroke-width="20" stroke-linecap="round">
    <!-- Right arm: holding the bowl -->
    <path d="M 600 340 C 560 390 510 400 460 418"/>
    <!-- Left arm: reaching toward the pot -->
    <path d="M 440 345 C 400 352 330 370 300 412"/>
    <!-- Far-right arm: curled on the counter -->
    <path d="M 630 300 C 690 340 706 380 690 412 C 680 436 656 440 660 424"/>
  </g>
  <g fill="none" stroke="#b77fd6" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <path d="M 460 418 C 500 400 530 394 580 392"/>
    <path d="M 300 412 C 330 370 380 355 420 350"/>
  </g>
  <!-- Suckers -->
  <g fill="#e4cdf0" opacity="0.7">
    <circle cx="556" cy="382" r="3"/>
    <circle cx="528" cy="398" r="3"/>
    <circle cx="496" cy="410" r="3"/>
    <circle cx="352" cy="380" r="3"/>
    <circle cx="322" cy="398" r="3"/>
    <circle cx="700" cy="380" r="3"/>
  </g>

  <!-- Chopsticks held by left arm -->
  <g stroke="#f5e6c8" stroke-width="4" stroke-linecap="round">
    <line x1="296" y1="404" x2="268" y2="330"/>
    <line x1="304" y1="402" x2="282" y2="326"/>
  </g>
</svg>
