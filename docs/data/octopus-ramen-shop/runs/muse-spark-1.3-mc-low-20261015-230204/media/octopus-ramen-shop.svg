<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b2340"/><stop offset="0.65" stop-color="#3a3f6e"/><stop offset="1" stop-color="#6b4a7a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/><stop offset="1" stop-color="#7c4f27"/>
  </linearGradient>
  <linearGradient id="octo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff7a6b"/><stop offset="1" stop-color="#d63d52"/>
  </linearGradient>
  <linearGradient id="broth" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f7b733"/><stop offset="1" stop-color="#e07b2a"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<rect width="1200" height="900" fill="url(#sky)"/>
