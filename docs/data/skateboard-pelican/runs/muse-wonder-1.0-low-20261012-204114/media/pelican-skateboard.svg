<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<title>Pelican Riding a Skateboard</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ed6f2"/><stop offset=".55" stop-color="#c9f2fb"/><stop offset="1" stop-color="#fff3c9"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25b8c7"/><stop offset="1" stop-color="#0e7fb8"/></linearGradient>
<linearGradient id="beak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb52e"/><stop offset="1" stop-color="#ff7a1a"/></linearGradient>
<linearGradient id="deck" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4d6d"/><stop offset=".5" stop-color="#ff9e2c"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7ae"/><stop offset=".7" stop-color="#ffd23f"/><stop offset="1" stop-color="#ffb52e"/></radialGradient>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<circle cx="1020" cy="140" r="78" fill="url(#sun)"/><circle cx="1020" cy="140" r="105" fill="#ffd23f" opacity=".22"/>
<g fill="#fff" opacity=".92"><ellipse cx="180" cy="130" rx="105" ry="38"/><ellipse cx="250" cy="110" rx="75" ry="48"/><ellipse cx="760" cy="105" rx="90" ry="32"/><ellipse cx="825" cy="88" rx="60" ry="40"/></g>
<g stroke="#2b6a7a" stroke-width="5" fill="none" stroke-linecap="round"><path d="M90 220q18-20 36 0q18-20 36 0"/><path d="M980 260q16-18 32 0q16-18 32 0"/><path d="M560 180q14-16 28 0q14-16 28 0"/></g>
<rect y="430" width="1200" height="170" fill="url(#sea)"/>
<g stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"><path d="M40 485q60-18 120 0t120 0"/><path d="M720 520q60-18 120 0t120 0"/><path d="M260 560q60-18 120 0t120 0"/></g>
<path d="M0 590 Q300 560 600 590 T1200 585 V900 H0Z" fill="#f7d99a"/>
<path d="M0 650 L1200 620 L1200 900 L0 900Z" fill="#c98d5e"/>
<g stroke="#9b6337" stroke-width="6"><path d="M0 700 L1200 672"/><path d="M0 770 L1200 745"/><path d="M0 840 L1200 815"/><path d="M170 655 L130 900"/><path d="M470 645 L440 900"/><path d="M770 635 L750 900"/><path d="M1040 628 L1030 900"/></g>
<g><path d="M95 590 Q80 430 150 360" stroke="#7a4a21" stroke-width="18" fill="none" stroke-linecap="round"/><g fill="#2eaa6b"><ellipse cx="150" cy="345" rx="95" ry="24" transform="rotate(-28 150 345)"/><ellipse cx="165" cy="350" rx="100" ry="24" transform="rotate(18 165 350)"/><ellipse cx="135" cy="330" rx="85" ry="22" transform="rotate(-62 135 330)"/></g></g>
<!-- motion -->
<g stroke="#118ab2" stroke-width="10" stroke-linecap="round" opacity=".65"><path d="M95 545 H250"/><path d="M55 595 H205"/><path d="M120 645 H255"/></g>
<g fill="#ffd23f"><path d="M285 285l7 16 17 2-12 12 3 17-15-8-15 8 3-17-12-12 17-2z"/><path d="M925 350l6 14 15 2-11 11 3 15-13-7-13 7 3-15-11-11 15-2z"/></g>
<!-- shadow -->
<ellipse cx="610" cy="760" rx="330" ry="34" fill="#7a4a21" opacity=".28"/>
<!-- skateboard -->
<g transform="rotate(-4 610 720)">
<rect x="315" y="705" width="590" height="34" rx="17" fill="url(#deck)"/>
<rect x="315" y="705" width="590" height="12" rx="6" fill="#073b4c"/>
<g fill="#334155"><rect x="425" y="738" width="30" height="24" rx="5"/><rect x="770" y="738" width="30" height="24" rx="5"/></g>
<g><circle cx="440" cy="782" r="31" fill="#073b4c"/><circle cx="440" cy="782" r="17" fill="#ef476f"/><circle cx="440" cy="782" r="6" fill="#fff"/><path d="M440 765v34M425 782h30" stroke="#fff" stroke-width="3"/></g>
<g><circle cx="785" cy="782" r="31" fill="#073b4c"/><circle cx="785" cy="782" r="17" fill="#06d6a0"/><circle cx="785" cy="782" r="6" fill="#fff"/><path d="M785 765v34M770 782h30" stroke="#fff" stroke-width="3"/></g>
</g>
<!-- legs -->
<g stroke="#ff8c1a" stroke-width="16" stroke-linecap="round" fill="none"><path d="M555 610 L505 700"/><path d="M675 615 L735 698"/></g>
<g fill="#ff8c1a"><path d="M455 700h95l18 16H472z"/><path d="M700 700h100l18 16h-100z"/></g>
<!-- pelican body -->
<g stroke-linejoin="round">
<path d="M390 610 Q350 470 485 405 Q620 340 745 430 Q850 505 810 610 Q720 665 580 660 Q450 655 390 610Z" fill="#fff" stroke="#17324a" stroke-width="7"/>
<path d="M430 560 Q540 620 700 585 Q620 650 500 625 Q445 605 430 560Z" fill="#dff3f7"/>
<!-- tail -->
<path d="M395 520 L285 470 L330 545 L270 560 L390 590Z" fill="#bfe9f5" stroke="#17324a" stroke-width="7"/>
<!-- wing -->
<path d="M520 430 Q690 410 735 520 Q700 625 565 610 Q475 545 520 430Z" fill="#8fd8ef" stroke="#17324a" stroke-width="7"/>
<path d="M545 470 Q650 455 700 520 M535 525 Q625 515 690 555" fill="none" stroke="#eafcff" stroke-width="10" stroke-linecap="round"/>
<!-- neck & head -->
<path d="M700 450 Q740 340 705 250 Q680 185 755 160 Q835 140 865 210 Q885 275 825 315 Q760 355 745 455Z" fill="#fff" stroke="#17324a" stroke-width="7"/>
<path d="M735 180 Q770 120 835 145 Q790 155 775 185 Q820 150 870 175 Q815 195 800 230" fill="#ffe66d" stroke="#17324a" stroke-width="6"/>
<!-- pouch & beak -->
<path d="M815 235 L1085 305 Q1110 312 1088 330 L835 330 Q795 285 815 235Z" fill="url(#beak)" stroke="#17324a" stroke-width="7"/>
<path d="M825 300 Q950 355 1075 325 Q980 390 875 365 Q825 345 825 300Z" fill="#ff8c69" stroke="#17324a" stroke-width="7"/>
<path d="M815 235 L1085 305" stroke="#17324a" stroke-width="7" stroke-linecap="round"/>
<circle cx="1092" cy="312" r="8" fill="#17324a"/>
<!-- eye / face -->
<circle cx="800" cy="220" r="27" fill="#bfefff"/><circle cx="805" cy="222" r="12" fill="#17324a"/><circle cx="809" cy="217" r="4" fill="#fff"/>
<ellipse cx="765" cy="255" rx="16" ry="10" fill="#ffb3c1" opacity=".8"/>
<!-- sunglasses strap + happy brow -->
<path d="M748 205 Q800 185 852 210" fill="none" stroke="#17324a" stroke-width="6" stroke-linecap="round"/>
</g>
<!-- cap -->
<g transform="rotate(12 790 145)"><path d="M705 150 Q790 85 875 150 L875 165 H705Z" fill="#ef476f" stroke="#17324a" stroke-width="7"/><rect x="855" y="140" width="95" height="18" rx="9" fill="#073b4c"/></g>
<!-- scarf -->
<path d="M705 330 Q770 365 835 325 L845 365 Q770 405 695 365Z" fill="#06d6a0" stroke="#17324a" stroke-width="6"/>
<path d="M710 360 Q650 390 610 365 Q650 420 705 390" fill="#06d6a0" stroke="#17324a" stroke-width="6" stroke-linejoin="round"/>
<!-- sign -->
<g transform="rotate(-3 180 790)"><rect x="55" y="775" width="250" height="58" rx="14" fill="#073b4c"/><text x="180" y="815" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="#fff" letter-spacing="2">SKATE DAY!</text></g>
<g fill="#ef476f"><circle cx="1010" cy="640" r="10"/><circle cx="1055" cy="615" r="7"/><circle cx="110" cy="420" r="8"/><circle cx="150" cy="395" r="6"/></g>
</svg>
