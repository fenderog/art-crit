<circle cx="872" cy="400" r="52" fill="#f7dc6f" stroke="#5a4a07" stroke-width="5"/>
<circle cx="855" cy="392" r="16" fill="#fff"/><circle cx="848" cy="386" r="6" fill="#111"/>
<circle cx="890" cy="396" r="9" fill="#fff"/><circle cx="893" cy="399" r="4" fill="#111"/>
