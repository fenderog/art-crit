<radialGradient id="glow"><stop offset="0" stop-color="#fff6c0" stop-opacity=".7"/><stop offset="1" stop-color="#fff6c0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="800" fill="url(#wall)"/>
