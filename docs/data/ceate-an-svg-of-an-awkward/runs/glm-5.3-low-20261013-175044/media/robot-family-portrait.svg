<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c2b4"/>
      <stop offset="1" stop-color="#b3ab9c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a07a55"/>
      <stop offset="1" stop-color="#7c5a3c"/>
    </linearGradient>
    <linearGradient id="dadBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb2d9"/>
      <stop offset="1" stop-color="#6d8fb8"/>
    </linearGradient>
    <linearGradient id="momBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0c5"/>
      <stop offset="1" stop-color="#5fae9f"/>
    </linearGradient>
    <linearGradient id="teenBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e7480"/>
      <stop offset="1" stop-color="#4a4f59"/>
    </linearGradient>
    <linearGradient id="kidBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d76e"/>
      <stop offset="1" stop-color="#e0b544"/>
    </linearGradient>
    <linearGradient id="grandpaBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98350"/>
      <stop offset="1" stop-color="#9c5f34"/>
    </linearGradient>
  </defs>

  <!-- ======== BACKDROP ======== -->
  <rect x="0" y="0" width="1200" height="900" fill="url(#wall)"/>
  <!-- wallpaper stripes -->
  <g fill="#bfb7a8" opacity="0.6">
    <rect x="40" y="0" width="26" height="700"/>
    <rect x="120" y="0" width="26" height="700"/>
    <rect x="200" y="0" width="26" height="700"/>
    <rect x="280" y="0" width="26" height="700"/>
    <rect x="360" y="0" width="26" height="700"/>
    <rect x="820" y="0" width="26" height="700"/>
    <rect x="900" y="0" width="26" height="700"/>
    <rect x="980" y="0" width="26" height="700"/>
    <rect x="1060" y="0" width="26" height="700"/>
    <rect x="1140" y="0" width="26" height="700"/>
  </g>
  <!-- floor -->
  <rect x="0" y="700" width="1200" height="200" fill="url(#floor)"/>
  <g stroke="#6b4b30" stroke-width="3" opacity="0.5">
    <line x1="0" y1="760" x2="1200" y2="760"/>
    <line x1="0" y1="830" x2="1200" y2="830"/>
    <line x1="300" y1="700" x2="180" y2="900"/>
    <line x1="620" y1="700" x2="560" y2="900"/>
    <line x1="900" y1="700" x2="920" y2="900"/>
  </g>
  <!-- rug -->
  <ellipse cx="620" cy="820" rx="430" ry="80" fill="#8a4a52"/>
  <ellipse cx="620" cy="820" rx="390" ry="66" fill="none" stroke="#c98a94" stroke-width="10"/>

  <!-- framed photo of great-grandbot on the wall -->
  <g transform="translate(520,80)">
    <rect x="-70" y="-58" width="140" height="116" rx="6" fill="#7c5a3c" stroke="#5a3e26" stroke-width="6"/>
    <rect x="-56" y="-44" width="112" height="88" fill="#e8e0cf"/>
    <g transform="translate(0,14)">
      <rect x="-16" y="-38" width="32" height="34" rx="6" fill="#a0a6ad"/>
      <circle cx="-6" cy="-28" r="4" fill="#2c3138"/>
      <circle cx="6" cy="-28" r="4" fill="#2c3138"/>
      <path d="M -8 -18 Q 0 -12 8 -18" fill="none" stroke="#2c3138" stroke-width="3"/>
      <line x1="0" y1="-38" x2="8" y2="-50" stroke="#2c3138" stroke-width="3"/>
      <circle cx="9" cy="-51" r="3" fill="#c94f4f"/>
      <rect x="-20" y="-4" width="40" height="26" rx="5" fill="#a0a6ad"/>
    </g>
  </g>
  <!-- clock (stuck) -->
  <g transform="translate(1010,110)">
    <circle r="42" fill="#f0e8d8" stroke="#5a3e26" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#2c3138" stroke-width="4"/>
    <line x1="0" y1="0" x2="18" y2="6" stroke="#2c3138" stroke-width="4"/>
    <circle r="4" fill="#2c3138"/>
  </g>
  <!-- standing lamp -->
  <g transform="translate(140,0)">
    <rect x="132" y="180" width="16" height="520" fill="#4a4f59"/>
    <ellipse cx="140" cy="700" rx="60" ry="16" fill="#3a3f47"/>
    <path d="M 80 180 L 200 180 L 182 100 L 98 100 Z" fill="#e8c06a" stroke="#a8863c" stroke-width="5"/>
    <ellipse cx="140" cy="196" rx="34" ry="10" fill="#fff0b8"/>
  </g>
  <!-- sad potted plant -->
  <g transform="translate(1080,700)">
    <path d="M -30 0 Q -34 -60 -8 -78 Q 2 -100 -6 -120" fill="none" stroke="#4f7a3a" stroke-width="7" stroke-linecap="round"/>
    <path d="M -6 -120 Q -30 -118 -38 -96" fill="none" stroke="#4f7a3a" stroke-width="7" stroke-linecap="round"/>
    <path d="M -6 -120 Q 16 -122 24 -100" fill="none" stroke="#4f7a3a" stroke-width="7" stroke-linecap="round"/>
    <path d="M -40 0 L 26 0 L 14 64 L -28 64 Z" fill="#b0693a" stroke="#8a4c28" stroke-width="4"/>
  </g>

  <!-- ======== GRANDPA (seated, left) ======== -->
  <g transform="translate(180,0)">
    <!-- armchair -->
    <path d="M -95 700 L -95 520 Q -95 470 -45 470 L 45 470 Q 95 470 95 520 L 95 700 Z" fill="#7a3a44"/>
    <rect x="-120" y="560" width="34" height="140" rx="12" fill="#6b3038"/>
    <rect x="86" y="560" width="34" height="140" rx="12" fill="#6b3038"/>
    <rect x="-110" y="688" width="220" height="16" fill="#4a2228"/>
    <!-- grandpa body (rusty) -->
    <g>
      <rect x="-46" y="440" width="92" height="130" rx="18" fill="url(#grandpaBody)"/>
      <!-- rust patches -->
      <ellipse cx="-24" cy="500" rx="16" ry="12" fill="#7a4a28" opacity="0.7"/>
      <ellipse cx="30" cy="540" rx="13" ry="10" fill="#7a4a28" opacity="0.7"/>
      <!-- head tilted -->
      <g transform="rotate(-10,0,440)">
        <rect x="-34" y="376" width="68" height="66" rx="16" fill="url(#grandpaBody)"/>
        <!-- bent antenna -->
        <path d="M -4 376 L -4 346 L 14 334" fill="none" stroke="#8a8f96" stroke-width="5" stroke-linecap="round"/>
        <circle cx="15" cy="333" r="4" fill="#c94f4f"/>
        <!-- eyes: one monocle lens, half closed -->
        <circle cx="-13" cy="404" r="5" fill="#2c3138"/>
        <circle cx="14" cy="402" r="13" fill="#cfe8ef" stroke="#8a8f96" stroke-width="4"/>
        <circle cx="14" cy="402" r="4" fill="#2c3138"/>
        <line x1="-1" y1="391" x2="28" y2="388" stroke="#8a8f96" stroke-width="3"/>
        <line x1="-1" y1="413" x2="28" y2="415" stroke="#8a8f96" stroke-width="3"/>
        <!-- mustache grille -->
        <path d="M -10 424 Q 0 430 10 424" fill="none" stroke="#5a4633" stroke-width="5" stroke-linecap="round"/>
        <!-- chest gauge -->
        <circle cx="0" cy="480" r="12" fill="#d8d2c2" stroke="#6b4b30" stroke-width="4"/>
        <line x1="0" y1="480" x2="7" y2="472" stroke="#c94f4f" stroke-width="3"/>
        <!-- arms: hands on cane -->
        <path d="M -46 470 Q -80 500 -84 560" fill="none" stroke="url(#grandpaBody)" stroke-width="18" stroke-linecap="round"/>
        <path d="M 46 470 Q 74 506 66 560" fill="none" stroke="url(#grandpaBody)" stroke-width="18" stroke-linecap="round"/>
        <circle cx="-84" cy="564" r="11" fill="#b0693a" stroke="#8a4c28" stroke-width="3"/>
        <circle cx="66" cy="566" r="11" fill="#b0693a" stroke="#8a4c28" stroke-width="3"/>
        <!-- cane -->
        <line x1="76" y1="700" x2="52" y2="566" stroke="#6b4b30" stroke-width="8" stroke-linecap="round"/>
        <circle cx="50" cy="562" r="9" fill="#8a8f96"/>
      </g>
    </g>
    <!-- steam puffs -->
    <g fill="#e8e4da" opacity="0.7">
      <circle cx="-52" cy="356" r="8"/>
      <circle cx="-66" cy="338" r="11"/>
      <circle cx="-56" cy="316" r="13"/>
    </g>
  </g>

  <!-- ======== DAD (center, stiff pose) ======== -->
  <g transform="translate(470,0)">
    <!-- legs -->
    <rect x="-34" y="600" width="26" height="100" rx="10" fill="#5a6a7a"/>
    <rect x="8" y="600" width="26" height="100" rx="10" fill="#5a6a7a"/>
    <rect x="-46" y="688" width="46" height="20" rx="6" fill="#3e4a56"/>
    <rect x="4" y="688" width="46" height="20" rx="6" fill="#3e4a56"/>
    <!-- torso, ramrod straight -->
    <rect x="-52" y="330" width="104" height="276" rx="20" fill="url(#dadBody)"/>
    <!-- tie -->
    <path d="M -8 340 L 0 330 L 8 340 L 4 356 L -4 356 Z" fill="#c94f4f"/>
    <path d="M -4 356 L -8 440 L 0 456 L 8 440 L 4 356 Z" fill="#b03838"/>
    <!-- pocket protector -->
    <rect x="18" y="380" width="26" height="34" rx="4" fill="#5f80a8"/>
    <line x1="22" y1="380" x2="22" y2="366" stroke="#e8e4da" stroke-width="4"/>
    <line x1="30" y1="380" x2="30" y2="360" stroke="#f5d76e" stroke-width="4"/>
    <line x1="38" y1="380" x2="38" y2="368" stroke="#8fd0c5" stroke-width="4"/>
    <!-- chest heart light -->
    <path d="M -30 500 c -8 -10 -22 -2 -14 10 L -30 522 L -16 510 c 8 -12 -6 -20 -14 -10 Z" fill="#c94f4f" opacity="0.9"/>
    <!-- left arm: awkward thumbs-up -->
    <path d="M -52 360 Q -100 380 -108 440" fill="none" stroke="url(#dadBody)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="-108" cy="446" r="14" fill="#8fb2d9"/>
    <rect x="-118" y="414" width="10" height="22" rx="5" fill="#8fb2d9"/>
    <!-- right arm: hovering over Mom's shoulder (not quite touching) -->
    <path d="M 52 360 Q 108 372 132 392" fill="none" stroke="url(#dadBody)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="136" cy="396" r="15" fill="#8fb2d9"/>
    <!-- head: giant over-eager grin -->
    <rect x="-36" y="252" width="72" height="72" rx="16" fill="url(#dadBody)"/>
    <rect x="-36" y="268" width="72" height="14" rx="7" fill="#5f80a8" opacity="0.5"/>
    <line x1="0" y1="252" x2="0" y2="236" stroke="#8a8f96" stroke-width="5"/>
    <circle cx="0" cy="233" r="4" fill="#4fc96b"/>
    <circle cx="-14" cy="288" r="6" fill="#2c3138"/>
    <circle cx="14" cy="288" r="6" fill="#2c3138"/>
    <!-- strained wide smile -->
    <path d="M -18 306 Q 0 322 18 306" fill="none" stroke="#2c3138" stroke-width="4"/>
    <path d="M -18 306 L -20 300 M 18 306 L 20 300" stroke="#2c3138" stroke-width="3"/>
    <!-- sweat drop -->
    <path d="M 26 262 q 6 10 0 14 q -6 -4 0 -14" fill="#9ed4f0"/>
  </g>

  <!-- ======== MOM (leaning away) ======== -->
  <g transform="translate(660,0) rotate(4,0,700)">
    <!-- legs (shifted, leaning) -->
    <rect x="-28" y="616" width="24" height="92" rx="10" fill="#4a8a80"/>
    <rect x="6" y="616" width="24" height="92" rx="10" fill="#4a8a80"/>
    <rect x="-40" y="694" width="42" height="18" rx="6" fill="#39706a"/>
    <rect x="6" y="694" width="42" height="18" rx="6" fill="#39706a"/>
    <!-- pear torso -->
    <path d="M -30 380 Q -52 470 -44 600 L 40 600 Q 48 470 28 380 Q 0 366 -30 380 Z" fill="url(#momBody)"/>
    <!-- pearl necklace -->
    <circle cx="-16" cy="386" r="4" fill="#f0ece2"/>
    <circle cx="0" cy="392" r="4" fill="#f0ece2"/>
    <circle cx="16" cy="386" r="4" fill="#f0ece2"/>
    <!-- clasped hands in front -->
    <path d="M -26 470 Q -40 560 0 580 Q 40 560 28 470" fill="none" stroke="url(#momBody)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="0" cy="580" r="13" fill="#8fd0c5"/>
    <circle cx="12" cy="586" r="11" fill="#7cc0b5"/>
    <!-- head: one eye twitching, tight smile -->
    <rect x="-30" y="308" width="60" height="66" rx="14" fill="url(#momBody)"/>
    <line x1="0" y1="308" x2="0" y2="292" stroke="#8a8f96" stroke-width="5"/>
    <circle cx="0" cy="289" r="4" fill="#c94f4f"/>
    <circle cx="-12" cy="334" r="6" fill="#2c3138"/>
    <!-- twitching eye: bigger, with motion dashes -->
    <circle cx="11" cy="336" r="9" fill="#2c3138"/>
    <line x1="24" y1="328" x2="30" y2="324" stroke="#2c3138" stroke-width="2"/>
    <line x1="24" y1="336" x2="31" y2="336" stroke="#2c3138" stroke-width="2"/>
    <line x1="24" y1="344" x2="30" y2="348" stroke="#2c3138" stroke-width="2"/>
    <!-- tight polite smile -->
    <path d="M -10 354 Q 0 359 10 354" fill="none" stroke="#2c3138" stroke-width="4"/>
    <!-- blush -->
    <ellipse cx="-22" cy="348" rx="6" ry="4" fill="#e8a0a0" opacity="0.7"/>
  </g>

  <!-- ======== TEEN (slouching, far right, on phone) ======== -->
  <g transform="translate(940,0)">
    <!-- slouched legs -->
    <rect x="-30" y="636" width="24" height="64" rx="10" fill="#3a3f47"/>
    <rect x="6" y="636" width="24" height="64" rx="10" fill="#3a3f47"/>
    <rect x="-44" y="690" width="44" height="16" rx="6" fill="#2c3138"/>
    <rect x="4" y="690" width="44" height="16" rx="6" fill="#2c3138"/>
    <!-- slouched torso, leaning way back-left -->
    <g transform="rotate(-9,0,636)">
      <rect x="-44" y="420" width="88" height="220" rx="18" fill="url(#teenBody)"/>
      <!-- band sticker -->
      <circle cx="0" cy="520" r="20" fill="#2c3138"/>
      <path d="M -12 514 l 8 14 l 4 -14 l 8 14" fill="none" stroke="#f5d76e" stroke-width="3"/>
      <!-- arms crossed -->
      <path d="M -44 452 Q -14 492 6 488" fill="none" stroke="#4a4f59" stroke-width="18" stroke-linecap="round"/>
      <path d="M 44 452 Q 14 500 -10 496" fill="none" stroke="#4a4f59" stroke-width="18" stroke-linecap="round"/>
      <circle cx="-8" cy="494" r="11" fill="#5a6069"/>
      <circle cx="6" cy="488" r="11" fill="#5a6069"/>
      <!-- head tilted down at phone -->
      <g transform="rotate(-6,0,420)">
        <rect x="-32" y="352" width="64" height="62" rx="14" fill="url(#teenBody)"/>
        <!-- headphones -->
        <path d="M -32 378 Q 0 336 32 378" fill="none" stroke="#2c3138" stroke-width="9"/>
        <rect x="-42" y="370" width="18" height="28" rx="8" fill="#c94f4f"/>
        <rect x="24" y="370" width="18" height="28" rx="8" fill="#c94f4f"/>
        <!-- eyes: half-lidded, lit from below -->
        <path d="M -18 384 l 12 4" stroke="#8ef0ff" stroke-width="5" stroke-linecap="round"/>
        <path d="M 6 388 l 12 -4" stroke="#8ef0ff" stroke-width="5" stroke-linecap="round"/>
        <path d="M -8 404 q 8 4 16 0" fill="none" stroke="#2c3138" stroke-width="3"/>
      </g>
      <!-- phone held low -->
      <path d="M -30 460 Q -40 480 -32 496" fill="none" stroke="#4a4f59" stroke-width="14" stroke-linecap="round"/>
      <rect x="-56" y="470" width="40" height="60" rx="6" fill="#2c3138" transform="rotate(24,-36,500)"/>
      <rect x="-51" y="476" width="30" height="48" rx="4" fill="#8ef0ff" opacity="0.85" transform="rotate(24,-36,500)"/>
      <!-- glow from phone on face -->
      <ellipse cx="-20" cy="400" rx="30" ry="26" fill="#8ef0ff" opacity="0.12"/>
    </g>
    <!-- antenna drooping -->
    <path d="M 0 352 Q -6 336 -18 332" fill="none" stroke="#8a8f96" stroke-width="4"/>
    <circle cx="-20" cy="331" r="3" fill="#4fc96b"/>
    <!-- "do not approach" mug on floor -->
    <rect x="52" y="668" width="30" height="34" rx="4" fill="#c94f4f"/>
    <path d="M 82 676 q 14 8 0 18" fill="none" stroke="#c94f4f" stroke-width="5"/>
    <path d="M 60 676 l 6 6 M 68 676 l 6 6 M 64 688 l 6 6" stroke="#7a2222" stroke-width="3"/>
  </g>

  <!-- ======== KID (front, sitting cross-eyed on floor) ======== -->
  <g transform="translate(620,0)">
    <!-- legs splayed out -->
    <path d="M -30 800 Q -80 790 -110 812" fill="none" stroke="#d9a832" stroke-width="20" stroke-linecap="round"/>
    <path d="M 30 800 Q 80 790 110 812" fill="none" stroke="#d9a832" stroke-width="20" stroke-linecap="round"/>
    <rect x="-128" y="800" width="30" height="20" rx="8" fill="#e0b544"/>
    <rect x="98" y="800" width="30" height="20" rx="8" fill="#e0b544"/>
    <!-- body -->
    <rect x="-40" y="700" width="80" height="104" rx="18" fill="url(#kidBody)"/>
    <!-- ketchup stain -->
    <ellipse cx="14" cy="760" rx="10" ry="7" fill="#c94f4f" opacity="0.8"/>
    <!-- arms: one holding teddybot, one raised in a stiff wave -->
    <path d="M -40 726 Q -74 750 -70 790" fill="none" stroke="url(#kidBody)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 40 726 Q 78 740 84 712" fill="none" stroke="url(#kidBody)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="-70" cy="794" r="10" fill="#f5d76e"/>
    <circle cx="86" cy="708" r="11" fill="#f5d76e"/>
    <!-- head: big, cross-eyed grin -->
    <rect x="-38" y="610" width="76" height="76" rx="18" fill="url(#kidBody)"/>
    <line x1="0" y1="610" x2="0" y2="594" stroke="#8a8f96" stroke-width="5"/>
    <circle cx="0" cy="591" r="4" fill="#4fc96b"/>
    <!-- crossed eyes -->
    <circle cx="-10" cy="642" r="6" fill="#2c3138"/>
    <circle cx="10" cy="642" r="6" fill="#2c3138"/>
    <!-- huge gap-tooth grin -->
    <path d="M -16 660 Q 0 678 16 660 Z" fill="#2c3138"/>
    <rect x="-2" y="660" width="4" height="12" fill="#f5d76e"/>
    <!-- one spring sticking out -->
    <path d="M 26 622 q 8 -4 6 -12 q -8 -4 -6 -12" fill="none" stroke="#8a8f96" stroke-width="3"/>
    <!-- teddy-bot -->
    <g transform="translate(-108,780)">
      <rect x="-16" y="-6" width="32" height="30" rx="8" fill="#b08a6a"/>
      <rect x="-12" y="-30" width="24" height="26" rx="8" fill="#b08a6a"/>
      <circle cx="-5" cy="-21" r="2.5" fill="#2c3138"/>
      <circle cx="5" cy="-21" r="2.5" fill="#2c3138"/>
      <circle cx="-14" cy="4" r="7" fill="#9a7454"/>
      <circle cx="14" cy="4" r="7" fill="#9a7454"/>
      <!-- one button eye dangling -->
      <line x1="5" y1="-24" x2="10" y2="-30" stroke="#2c3138" stroke-width="2"/>
      <circle cx="11" cy="-31" r="3" fill="#2c3138"/>
      <line x1="0" y1="-4" x2="0" y2="0" stroke="#2c3138" stroke-width="3"/>
    </g>
  </g>

  <!-- ======== ROBO-CAT (unimpressed, far left front) ======== -->
  <g transform="translate(310,806)">
    <rect x="-34" y="-26" width="68" height="40" rx="16" fill="#8a8f96"/>
    <rect x="-30" y="-56" width="60" height="32" rx="12" fill="#8a8f96"/>
    <path d="M -30 -56 l -6 -16 l 16 8 Z" fill="#8a8f96"/>
    <path d="M 30 -56 l 6 -16 l -16 8 Z" fill="#8a8f96"/>
    <rect x="-10" y="-80" width="8" height="14" rx="4" fill="#c94f4f"/>
    <rect x="4" y="-80" width="8" height="14" rx="4" fill="#c94f4f"/>
    <!-- flat unimpressed eyes -->
    <line x1="-18" y1="-44" x2="-8" y2="-44" stroke="#4fc96b" stroke-width="4"/>
    <line x1="10" y1="-44" x2="20" y2="-44" stroke="#4fc96b" stroke-width="4"/>
    <!-- whiskers -->
    <path d="M -30 -40 l -14 -4 M -30 -34 l -14 2 M 30 -40 l 14 -4 M 30 -34 l 14 2" stroke="#5a6069" stroke-width="2"/>
    <!-- tail straight up, annoyed -->
    <path d="M 34 -8 Q 56 -10 54 -46" fill="none" stroke="#8a8f96" stroke-width="10" stroke-linecap="round"/>
    <rect x="-24" y="12" width="12" height="10" rx="4" fill="#7a7f86"/>
    <rect x="14" y="12" width="12" height="10" rx="4" fill="#7a7f86"/>
  </g>

  <!-- floating dust motes -->
  <g fill="#f0ece2" opacity="0.5">
    <circle cx="380" cy="200" r="3"/>
    <circle cx="820" cy="150" r="2"/>
    <circle cx="600" cy="180" r="2.5"/>
    <circle cx="200" cy="250" r="2"/>
  </g>
</svg>
