<path d="M375 460 L445 460 L470 600 L350 600Z" fill="#c8d0d8" stroke="#556" stroke-width="3"/>
<rect x="370" y="600" width="20" height="120" fill="url(#metal)"/><rect x="430" y="600" width="20" height="120" fill="url(#metal)"/>
<ellipse cx="380" cy="722" rx="20" ry="7" fill="#445"/><ellipse cx="440" cy="722" rx="20" ry="7" fill="#445"/>
<ellipse cx="410" cy="180" rx="48" ry="58" fill="url(#metal)" stroke="#556" stroke-width="3"/>
<rect x="378" y="160" width="64" height="26" rx="13" fill="#1d2633"/>
<circle cx="395" cy="173" r="7" fill="#7cf"/><circle cx="425" cy="173" r="7" fill="#7cf"/>
<path d="M392 205 q18 6 36 0" stroke="#334" stroke-width="3" fill="none"/>
<circle cx="410" cy="115" r="10" fill="#e6f" /><line x1="410" y1="122" x2="410" y2="130" stroke="#556" stroke-width="3"/>
<!-- arm to grandpa shoulder -->
<path d="M455 260 Q510 330 520 410" stroke="url(#metal)" stroke-width="16" fill="none" stroke-linecap="round"/>
<circle cx="522" cy="415" r="11" fill="#9aa4ad"/>
<path d="M365 260 Q340 340 355 410" stroke="url(#metal)" stroke-width="16" fill="none" stroke-linecap="round"/>
</g>

<!-- DAD: wide copper bot, right of grandpa, forced huge grin, arm stiffly around teen -->
<g>
<rect x="760" y="300" width="170" height="190" rx="20" fill="url(#copper)" stroke="#5a2e10" stroke-width="4"/>
<circle cx="845" cy="380" r="34" fill="#3a1e0c"/><circle cx="845" cy="380" r="22" fill="#ff7a2a"/><circle cx="845" cy="380" r="10" fill="#ffd7a0"/>
<rect x="785" y="490" width="120" height="70" fill="#7a4020"/>
<rect x="790" y="560" width="35" height="160" fill="url(#copper)"/><rect x="865" y="560" width="35" height="160" fill="url(#copper)"/>
<rect x="780" y="710" width="55" height="20" rx="6" fill="#4a2410"/><rect x="855" y="710" width="55" height="20" rx="6" fill="#4a2410"/>
<rect x="785" y="190" width="120" height="105" rx="14" fill="url(#copper)" stroke="#5a2e10" stroke-width="4"/>
<circle cx="818" cy="230" r="15" fill="#fff"/><circle cx="872" cy="230" r="15" fill="#fff"/>
<circle cx="818" cy="230" r="6" fill="#222"/><circle cx="872" cy="230" r="6" fill="#222"/>
<path d="M800 255 Q845 300 890 255 Z" fill="#fff" stroke="#5a2e10" stroke-width="3"/>
<path d="M815 258 v14 M830 258 v22 M845 258 v24 M860 258 v22 M875 258 v14" stroke="#5a2e10" stroke-width="2"/>
<path d="M800 212 l30 -8 M890 212 l-30 -8" stroke="#3a1e0c" stroke-width="5"/>
<rect x="830" y="168" width="30" height="22" fill="#5a2e10"/>
<!-- sweat drop -->
<path d="M905 205 q8 14 0 20 q-8 -6 0 -20Z" fill="#9de"/>
<!-- left arm on grandpa's armchair -->
<path d="M765 330 Q735 400 740 470" stroke="url(#copper)" stroke-width="22" fill="none" stroke-linecap="round"/>
<!-- right arm hovering awkwardly over teen's shoulder, not quite touching -->
<path d="M925 320 Q1000 270 1040 300" stroke="url(#copper)" stroke-width="22" fill="none" stroke-linecap="round"/>
<circle cx="1045" cy="302" r="15" fill="#b86a35"/>
</g>

<!-- TEEN: hunched dark-teal bot far right, leaning away, looking at handheld screen -->
<g transform="rotate(8 1080 720)">
<rect x="1060" y="560" width="22" height="160" fill="#244"/><rect x="1100" y="560" width="22" height="160" fill="#244"/>
<rect x="1050" y="712" width="40" height="16" rx="6" fill="#111"/><rect x="1095" y="712" width="40" height="16" rx="6" fill="#111"/>
<path d="M1035 380 Q1090 350 1145 385 L1140 570 L1040 570Z" fill="#1f2a33" stroke="#0d1418" stroke-width="3"/>
<path d="M1050 400 Q1090 380 1130 405 L1125 330 Q1090 300 1055 330Z" fill="#1f2a33"/>
<g transform="rotate(20 1090 330)">
<rect x="1055" y="290" width="80" height="70" rx="22" fill="url(#teal)" stroke="#123" stroke-width="3"/>
<path d="M1050 305 Q1095 255 1140 305 L1140 320 Q1095 290 1050 320Z" fill="#111"/>
<rect x="1072" y="325" width="48" height="10" rx="5" fill="#0a1a1a"/>
<rect x="1078" y="327" width="16" height="6" rx="3" fill="#7ff"/>
</g>
<!-- phone -->
<rect x="1070" y="440" width="38" height="56" rx="6" fill="#111" transform="rotate(-20 1089 468)"/>
<rect x="1075" y="446" width="28" height="42" rx="3" fill="#7ff" opacity=".85" transform="rotate(-20 1089 468)"/>
<circle cx="1095" cy="470" r="50" fill="#7ff" opacity=".08"/>
<path d="M1050 420 Q1060 470 1078 470" stroke="#1f2a33" stroke-width="18" fill="none" stroke-linecap="round"/>
<path d="M1130 420 Q1125 470 1105 472" stroke="#1f2a33" stroke-width="18" fill="none" stroke-linecap="round"/>
</g>

<!-- KID: tiny yellow bot front-left, over-enthusiastic, mid-jump, blurry -->
<g transform="rotate(-10 230 560)">
<ellipse cx="240" cy="740" rx="50" ry="10" fill="#000" opacity=".3"/>
<rect x="195" y="500" width="90" height="85" rx="20" fill="url(#yellow)" stroke="#7a5a00" stroke-width="3"/>
<circle cx="240" cy="540" r="16" fill="#fff8d0" stroke="#7a5a00" stroke-width="3"/>
<path d="M215 585 l-15 50 M265 585 l15 45" stroke="#7a5a00" stroke-width="10" stroke-linecap="round"/>
<circle cx="240" cy="455" r="48" fill="url(#yellow)" stroke="#7a5a00" stroke-width="3"/>
<circle cx="222" cy="448" r="14" fill="#fff"/><circle cx="260" cy="448" r="14" fill="#fff"/>
<circle cx="225" cy="445" r="7" fill="#222"/><circle cx="263" cy="451" r="7" fill="#222"/>
<path d="M215 475 Q240 505 268 475Z" fill="#a33"/>
<line x1="240" y1="407" x2="240" y2="375" stroke="#7a5a00" stroke-width="4"/>
<path d="M240 375 l-8 -14 l16 0Z" fill="#f44"/>
<path d="M200 520 Q160 470 150 420" stroke="url(#yellow)" stroke-width="14" fill="none" stroke-linecap="round"/>
<path d="M280 520 Q325 470 335 420" stroke="url(#yellow)" stroke-width="14" fill="none" stroke-linecap="round"/>
<circle cx="150" cy="415" r="11" fill="#ffd85a"/><circle cx="335" cy="415" r="11" fill="#ffd85a"/>
<path d="M120 400 l-15 -10 M125 380 l-12 -18 M365 400 l15 -10 M360 380 l12 -18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- PET: small dog-bot photobombing at edge, looking wrong way, leg lifted toward mom's foot -->
<g>
<rect x="40" y="660" width="100" height="45" rx="18" fill="url(#metal)" stroke="#556" stroke-width="3"/>
<rect x="5" y="635" width="50" height="40" rx="10" fill="url(#metal)" stroke="#556" stroke-width="3"/>
<circle cx="20" cy="652" r="5" fill="#f33"/>
<rect x="50" y="700" width="10" height="30" fill="#778"/><rect x="120" y="700" width="10" height="30" fill="#778"/>
<rect x="85" y="700" width="10" height="30" fill="#778"/>
<path d="M140 675 l30 -15" stroke="#778" stroke-width="8" stroke-linecap="round"/>
<path d="M140 668 q15 -25 -2 -40" stroke="#556" stroke-width="4" fill="none"/>
<path d="M5 640 l-4 -18 l14 10Z" fill="#778"/>
</g>

<!-- oil puddle under grandpa -->
<ellipse cx="610" cy="738" rx="40" ry="8" fill="#111" opacity=".6"/>
<!-- flash flare -->
<circle cx="140" cy="120" r="90" fill="url(#glow)" opacity=".5"/>
<rect width="1200" height="900" fill="url(#vig)"/>
<!-- frame -->
<rect x="12" y="12" width="1176" height="876" fill="none" stroke="#c9a14a" stroke-width="24"/>
<rect x="26" y="26" width="1148" height="848" fill="none" stroke="#6e5420" stroke-width="4"/>
</svg>
