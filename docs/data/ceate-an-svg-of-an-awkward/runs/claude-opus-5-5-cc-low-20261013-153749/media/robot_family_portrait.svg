<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
<defs>
<radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#8fa3b8"/><stop offset="1" stop-color="#3c4a5c"/></radialGradient>
<linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#9aa4ad"/><stop offset=".5" stop-color="#dfe5ea"/><stop offset="1" stop-color="#7d8790"/></linearGradient>
<linearGradient id="copper" x1="0" x2="1"><stop offset="0" stop-color="#9c5a2e"/><stop offset=".5" stop-color="#e09a5f"/><stop offset="1" stop-color="#7a4020"/></linearGradient>
<linearGradient id="teal" x1="0" x2="1"><stop offset="0" stop-color="#2f7d7a"/><stop offset=".5" stop-color="#6fcfc4"/><stop offset="1" stop-color="#245e5c"/></linearGradient>
<linearGradient id="yellow" x1="0" x2="1"><stop offset="0" stop-color="#c99a1c"/><stop offset=".5" stop-color="#ffd85a"/><stop offset="1" stop-color="#a87c10"/></linearGradient>
<linearGradient id="rust" x1="0" x2="1"><stop offset="0" stop-color="#6b4a3a"/><stop offset=".5" stop-color="#a07a5f"/><stop offset="1" stop-color="#5a3c2e"/></linearGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="65%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff6c0"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
</defs>
<!-- studio backdrop -->
<rect width="1200" height="900" fill="url(#bg)"/>
<path d="M0 640 Q600 600 1200 640 L1200 900 L0 900Z" fill="#2c3644"/>
<!-- rug -->
<ellipse cx="600" cy="760" rx="520" ry="80" fill="#6b2f35"/><ellipse cx="600" cy="760" rx="470" ry="62" fill="none" stroke="#b9874a" stroke-width="6" stroke-dasharray="14 10"/>

<!-- GRANDPA: old boxy rusty bot in armchair, center, dozing -->
<g>
<rect x="470" y="520" width="260" height="200" rx="30" fill="#4a5d3a"/>
<rect x="440" y="480" width="60" height="230" rx="25" fill="#3d4e30"/><rect x="700" y="480" width="60" height="230" rx="25" fill="#3d4e30"/>
<rect x="490" y="400" width="220" height="130" rx="40" fill="#556b42"/>
<rect x="530" y="500" width="140" height="130" rx="10" fill="url(#rust)" stroke="#3a2a20" stroke-width="4"/>
<circle cx="560" cy="530" r="6" fill="#3a2a20"/><circle cx="640" cy="530" r="6" fill="#3a2a20"/>
<rect x="555" y="560" width="90" height="40" fill="#2b211a"/><path d="M565 590 l10-20 l10 20 l10-20 l10 20 l10-20 l10 20" stroke="#c44" stroke-width="3" fill="none"/>
<rect x="545" y="625" width="30" height="80" fill="url(#rust)"/><rect x="625" y="625" width="30" height="80" fill="url(#rust)"/>
<rect x="535" y="700" width="50" height="18" rx="6" fill="#3a2a20"/><rect x="615" y="700" width="50" height="18" rx="6" fill="#3a2a20"/>
<!-- head tilted asleep -->
<g transform="rotate(-14 600 470)">
<rect x="555" y="420" width="90" height="75" rx="8" fill="url(#rust)" stroke="#3a2a20" stroke-width="4"/>
<path d="M570 455 q10 8 20 0 M610 455 q10 8 20 0" stroke="#222" stroke-width="4" fill="none"/>
<rect x="580" y="475" width="40" height="6" fill="#3a2a20"/>
<line x1="600" y1="420" x2="600" y2="395" stroke="#3a2a20" stroke-width="4"/><circle cx="600" cy="392" r="6" fill="#555"/>
</g>
<!-- arm with cane -->
<rect x="490" y="560" width="45" height="18" fill="url(#rust)"/><line x1="490" y1="560" x2="470" y2="715" stroke="#5a3a1a" stroke-width="8"/>
<rect x="665" y="590" width="40" height="18" fill="url(#rust)"/>
<!-- Zzz-ish bubbles (no text) -->
<circle cx="665" cy="395" r="6" fill="#fff" opacity=".6"/><circle cx="680" cy="375" r="9" fill="#fff" opacity=".5"/><circle cx="700" cy="350" r="12" fill="#fff" opacity=".4"/>
</g>

