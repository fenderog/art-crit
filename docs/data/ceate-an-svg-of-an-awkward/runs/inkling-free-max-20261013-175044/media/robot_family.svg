<!DOCTYPE svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" style="background-color:#e8ddd4;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#c4b5a0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <pattern id="wallPaper" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#e8ddd4"/>
      <circle cx="20" cy="20" r="1.5" fill="#b8a898" opacity="0.4"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#b8a898" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="url(#bgGrad)"/>
  <rect width="900" height="650" fill="url(#wallPaper)" opacity="0.5"/>

  <!-- Vintage picture frame border -->
  <rect x="30" y="30" width="840" height="590" fill="none" stroke="#5a4a3a" stroke-width="8" rx="4"/>
  <rect x="38" y="38" width="824" height="574" fill="none" stroke="#8a7a6a" stroke-width="2" rx="2"/>
  <rect x="46" y="46" width="808" height="558" fill="none" stroke="#3a2a1a" stroke-width="1" rx="1"/>

  <!-- Floor line -->
  <line x1="80" y1="520" x2="820" y2="520" stroke="#a89880" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="535" x2="830" y2="535" stroke="#a89880" stroke-width="1" opacity="0.4"/>

  <!-- Back curtain -->
  <rect x="50" y="60" width="800" height="460" fill="#c5b8a8" opacity="0.15" rx="8"/>
  <rect x="70" y="80" width="760" height="420" fill="#b8a898" opacity="0.1" rx="6"/>

  <!-- ROBOT 1: Father (tall, rigid, blocky, serious) -->
  <g filter="url(#shadow)">
    <!-- Body -->
    <rect x="200" y="160" width="140" height="340" rx="12" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="4"/>
    <rect x="210" y="180" width="120" height="200" rx="8" fill="#8a9aaa" stroke="#6a7a8a" stroke-width="2"/>
    <!-- Chest plate -->
    <rect x="215" y="220" width="110" height="140" rx="6" fill="#7a8a9a" stroke="#5a6a7a" stroke-width="2"/>
    <rect x="225" y="235" width="90" height="20" rx="4" fill="#5a6a7a"/>
    <rect x="235" y="265" width="70" height="6" rx="3" fill="#d4a545"/>
    <rect x="235" y="280" width="70" height="6" rx="3" fill="#d4a545"/>
    <rect x="235" y="295" width="70" height="6" rx="3" fill="#d4a545"/>
    <!-- Head -->
    <rect x="220" y="90" width="120" height="90" rx="8" fill="#b5c5d0" stroke="#8a9aaa" stroke-width="3"/>
    <rect x="225" y="95" width="110" height="75" rx="6" fill="#9aa8b0" stroke="#7a8890" stroke-width="2"/>
    <!-- Eyes -->
    <rect x="240" y="115" width="20" height="20" rx="4" fill="#2a3a4a" stroke="#1a2a3a" stroke-width="2"/>
    <rect x="250" y="120" width="10" height="8" rx="2" fill="#e0a040"/>
    <rect x="280" y="115" width="20" height="20" rx="4" fill="#2a3a4a" stroke="#1a2a3a" stroke-width="2"/>
    <rect x="290" y="120" width="10" height="8" rx="2" fill="#e0a040"/>
    <!-- Mouth (straight line, serious) -->
    <line x1="245" y1="145" x2="295" y2="145" stroke="#3a4a5a" stroke-width="3" stroke-linecap="round"/>
    <!-- Antenna -->
    <line x1="270" y1="90" x2="270" y2="65" stroke="#8a9aaa" stroke-width="4" stroke-linecap="round"/>
    <circle cx="270" cy="60" r="6" fill="#e05040" stroke="#a03020" stroke-width="2"/>
    <!-- Shoulders -->
    <rect x="190" y="160" width="30" height="20" rx="4" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="2"/>
    <rect x="340" y="160" width="30" height="20" rx="4" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="2"/>
    <!-- Arms -->
    <rect x="180" y="200" width="30" height="250" rx="8" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="3"/>
    <rect x="350" y="200" width="30" height="250" rx="8" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="3"/>
    <rect x="175" y="450" width="40" height="50" rx="6" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="2"/>
    <rect x="345" y="450" width="40" height="50" rx="6" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="2"/>
    <!-- Left arm bent awkwardly -->
    <rect x="175" y="230" width="35" height="180" rx="8" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="3" transform="rotate(-15 192 320)"/>
    <!-- Legs -->
    <rect x="220" y="490" width="35" height="80" rx="6" fill="#4a5a6a" stroke="#3a4a5a" stroke-width="3"/>
    <rect x="285" y="485" width="35" height="80" rx="6" fill="#4a5a6a" stroke="#3a4a5a" stroke-width="3"/>
    <rect x="210" y="560" width="55" height="30" rx="6" fill="#3a3a4a" stroke="#2a2a2a" stroke-width="2"/>
    <rect x="280" y="555" width="55" height="30" rx="6" fill="#3a3a4a" stroke="#2a2a2a" stroke-width="2"/>
  </g>

  <!-- ROBOT 2: Mother (rounded, gentle, slightly curved body) -->
  <g filter="url(#shadow)">
    <!-- Rounded body -->
    <ellipse cx="420" cy="360" rx="70" ry="110" fill="#b89898" stroke="#986868" stroke-width="3"/>
    <ellipse cx="420" cy="340" rx="55" ry="85" fill="#c8a0a0" stroke="#a87878" stroke-width="2"/>
    <!-- Chest details -->
    <ellipse cx="420" cy="340" rx="40" ry="60" fill="#d8b0b0" stroke="#b88888" stroke-width="1.5"/>
    <circle cx="420" cy="310" r="18" fill="#e8c0c0" stroke="#c89898" stroke-width="2"/>
    <circle cx="420" cy="310" r="8" fill="#b86888"/>
    <!-- Head -->
    <circle cx="420" cy="230" r="45" fill="#e8d8c0" stroke="#c8b898" stroke-width="3"/>
    <circle cx="420" cy="230" r="38" fill="#f0e0c8" stroke="#c8b898" stroke-width="2"/>
    <!-- Eyes (large, gentle) -->
    <ellipse cx="395" cy="225" rx="12" ry="15" fill="#3a4a5a" stroke="#1a2a3a" stroke-width="1.5"/>
    <circle cx="397" cy="223" r="4" fill="#f0e080"/>
    <ellipse cx="445" cy="225" rx="12" ry="15" fill="#3a4a5a" stroke="#1a2a3a" stroke-width="1.5"/>
    <circle cx="443" cy="223" r="4" fill="#f0e080"/>
    <!-- Blush -->
    <circle cx="390" cy="240" r="5" fill="#f0a0a0" opacity="0.5"/>
    <circle cx="450" cy="240" r="5" fill="#f0a0a0" opacity="0.5"/>
    <!-- Small curved smile -->
    <path d="M 410 245 Q 420 252 430 245" stroke="#a07070" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Hair/hood -->
    <path d="M 375 220 Q 390 170 420 170 Q 450 170 465 220" fill="#7a605a" stroke="#5a403a" stroke-width="2"/>
    <circle cx="390" cy="175" r="8" fill="#c8a898" stroke="#b89888" stroke-width="1"/>
    <circle cx="450" cy="178" r="7" fill="#c8a898" stroke="#b89888" stroke-width="1"/>
    <!-- Small antenna -->
    <line x1="420" y1="185" x2="420" y2="160" stroke="#a89888" stroke-width="2"/>
    <circle cx="420" cy="155" r="4" fill="#e08080" stroke="#c06060" stroke-width="1.5"/>
    <!-- Short rounded arms -->
    <ellipse cx="345" cy="350" rx="15" ry="35" fill="#b89898" stroke="#986868" stroke-width="2" transform="rotate(-10 345 350)"/>
    <ellipse cx="495" cy="350" rx="15" ry="35" fill="#b89898" stroke="#986868" stroke-width="2" transform="rotate(10 495 350)"/>
    <!-- Small curved legs -->
    <rect x="390" y="460" width="22" height="60" rx="10" fill="#986868" stroke="#785858" stroke-width="2" transform="rotate(-5 401 490)"/>
    <rect x="435" y="460" width="22" height="60" rx="10" fill="#986868" stroke="#785858" stroke-width="2" transform="rotate(5 446 490)"/>
    <rect x="385" y="510" width="30" height="20" rx="8" fill="#785858" stroke="#685858" stroke-width="2"/>
    <rect x="430" y="510" width="30" height="20" rx="8" fill="#785858" stroke="#685858" stroke-width="2"/>
  </g>

  <!-- ROBOT 3: Teenager (slouched, oversized headphones, eye-rolling) -->
  <g filter="url(#shadow)">
    <!-- Leaning/slouched body -->
    <rect x="540" y="250" width="90" height="220" rx="14" fill="#5a6a7a" stroke="#3a4a5a" stroke-width="3" transform="rotate(8 585 360)"/>
    <rect x="545" y="270" width="80" height="160" rx="10" fill="#7a8a9a" stroke="#5a6a7a" stroke-width="2"/>
    <!-- Hoodie detail -->
    <path d="M 550 260 Q 540 240 560 240 Q 580 240 570 260 Z" fill="#4a5a6a" stroke="#3a4a5a" stroke-width="2"/>
    <rect x="555" y="290" width="70" height="20" rx="3" fill="#e8e8e8" stroke="#b0b0b0" stroke-width="1"/>
    <text x="575" y="305" font-size="6" fill="#5a5a5a" font-family="sans-serif" text-anchor="middle" opacity="0.6">COOL</text>
    <!-- Oversized headphones -->
    <rect x="520" y="210" width="40" height="50" rx="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="600" y="210" width="40" height="50" rx="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M 540 210 Q 580 170 620 210" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <rect x="530" y="215" width="30" height="40" rx="6" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="2"/>
    <rect x="610" y="215" width="30" height="40" rx="6" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="2"/>
    <!-- Head -->
    <rect x="555" y="140" width="70" height="70" rx="12" fill="#c0c8d8" stroke="#90a0b8" stroke-width="3"/>
    <rect x="560" y="145" width="60" height="55" rx="10" fill="#d0d8e8" stroke="#90a0b8" stroke-width="2"/>
    <!-- Eye-rolling eyes -->
    <ellipse cx="575" cy="165" rx="10" ry="8" fill="#e8e8e8" stroke="#b0b0b0" stroke-width="1.5"/>
    <circle cx="578" cy="162" r="4" fill="#3a3a3a"/>
    <ellipse cx="605" cy="165" rx="10" ry="8" fill="#e8e8e8" stroke="#b0b0b0" stroke-width="1.5"/>
    <circle cx="608" cy="162" r="4" fill="#3a3a3a"/>
    <!-- Small smirk (annoyed) -->
    <path d="M 580 178 Q 590 175 600 178" stroke="#6a7a8a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Hair/fuzz -->
    <rect x="560" y="135" width="15" height="15" rx="3" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="575" y="130" width="15" height="15" rx="3" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="595" y="135" width="15" height="15" rx="3" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>
    <!-- Slouched arm -->
    <rect x="535" y="280" width="25" height="160" rx="8" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="2" transform="rotate(-15 547 360)"/>
    <rect x="630" y="280" width="25" height="160" rx="8" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="2" transform="rotate(15 642 360)"/>
    <!-- One arm in pocket -->
    <rect x="530" y="310" width="35" height="30" rx="6" fill="#3a4a5a" stroke="#2a3a4a" stroke-width="2" transform="rotate(-10 547 325)" opacity="0.9"/>
    <!-- Legs leaning -->
    <rect x="560" y="450" width="28" height="90" rx="8" fill="#3a4a5a" stroke="#2a3a4a" stroke-width="2" transform="rotate(-15 574 495)"/>
    <rect x="585" y="445" width="28" height="90" rx="8" fill="#3a4a5a" stroke="#2a3a4a" stroke-width="2" transform="rotate(10 599 490)"/>
    <rect x="550" y="530" width="35" height="25" rx="8" fill="#2a3a4a" stroke="#1a2a3a" stroke-width="2"/>
    <rect x="590" y="525" width="35" height="25" rx="8" fill="#2a3a4a" stroke="#1a2a3a" stroke-width="2"/>
  </g>

  <!-- ROBOT 4: Little kid (tiny, excited, arms raised) -->
  <g filter="url(#shadow)">
    <!-- Small round body -->
    <circle cx="680" cy="380" r="45" fill="#e8a060" stroke="#c88040" stroke-width="3"/>
    <circle cx="680" cy="380" r="35" fill="#f0b070" stroke="#d89050" stroke-width="2"/>
    <!-- Small happy face -->
    <circle cx="680" cy="350" r="22" fill="#f8d0a0" stroke="#e0b080" stroke-width="2"/>
    <circle cx="680" cy="350" r="18" fill="#ffe0b0" stroke="#e0b080" stroke-width="1.5"/>
    <!-- Excited big eyes -->
    <circle cx="668" cy="345" r="7" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="670" cy="343" r="3" fill="#f0e0a0"/>
    <circle cx="692" cy="345" r="7" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="690" cy="343" r="3" fill="#f0e0a0"/>
    <!-- Big open happy mouth -->
    <ellipse cx="680" cy="360" rx="9" ry="10" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
    <ellipse cx="680" cy="356" rx="5" ry="4" fill="#f8a070"/>
    <!-- Antennae with stars -->
    <line x1="670" y1="330" x2="670" y2="305" stroke="#d89050" stroke-width="2" stroke-linecap="round"/>
    <line x1="690" y1="330" x2="690" y2="310" stroke="#d89050" stroke-width="2" stroke-linecap="round"/>
    <polygon points="670,300 672,305 675,305 672,308 673,312 670,310 667,312 668,308 665,305 668,305" fill="#e0a040" stroke="#c88020" stroke-width="1"/>
    <polygon points="690,305 692,310 695,310 692,313 693,317 690,315 687,317 688,313 685,310 688,310" fill="#e08080" stroke="#c06060" stroke-width="1"/>
    <!-- Little raised arms -->
    <rect x="640" y="340" width="14" height="55" rx="6" fill="#f0b070" stroke="#d89050" stroke-width="2" transform="rotate(-25 647 367)"/>
    <rect x="706" y="340" width="14" height="55" rx="6" fill="#f0b070" stroke="#d89050" stroke-width="2" transform="rotate(25 713 367)"/>
    <circle cx="640" cy="330" r="8" fill="#f8d0a0" stroke="#e0b080" stroke-width="1.5"/>
    <circle cx="720" cy="330" r="8" fill="#f8d0a0" stroke="#e0b080" stroke-width="1.5"/>
    <!-- Little legs -->
    <rect x="665" y="420" width="14" height="35" rx="6" fill="#e0a040" stroke="#c08020" stroke-width="2"/>
    <rect x="685" y="420" width="14" height="35" rx="6" fill="#e0a040" stroke="#c08020" stroke-width="2"/>
    <rect x="660" y="450" width="20" height="14" rx="6" fill="#c08020" stroke="#a06010" stroke-width="2"/>
    <rect x="680" y="450" width="20" height="14" rx="6" fill="#c08020" stroke="#a06010" stroke-width="2"/>
  </g>

  <!-- ROBOT 5: Grandparent (bent, rusty, cane, slightly out of frame to left) -->
  <g filter="url(#shadow)">
    <!-- Bent body, slightly tilted back -->
    <rect x="80" y="220" width="110" height="260" rx="14" fill="#7a6a5a" stroke="#5a4a3a" stroke-width="3" transform="rotate(-5 135 350)"/>
    <rect x="90" y="240" width="90" height="200" rx="10" fill="#a89878" stroke="#887868" stroke-width="2"/>
    <!-- Rust spots -->
    <circle cx="110" cy="280" r="12" fill="#8a6050" opacity="0.8"/>
    <circle cx="140" cy="340" r="10" fill="#8a6050" opacity="0.8"/>
    <circle cx="100" cy="400" r="8" fill="#8a6050" opacity="0.8"/>
    <rect x="115" y="360" width="40" height="8" rx="4" fill="#5a4a3a" opacity="0.7"/>
    <!-- Weathered head -->
    <rect x="100" y="130" width="90" height="110" rx="14" fill="#b8a898" stroke="#8a7a78" stroke-width="3"/>
    <rect x="105" y="140" width="80" height="85" rx="10" fill="#c0b0a0" stroke="#a89888" stroke-width="2"/>
    <!-- One dull eye, one covered -->
    <rect x="120" y="165" width="22" height="18" rx="4" fill="#3a4540" stroke="#2a3530" stroke-width="2"/>
    <circle cx="128" cy="170" r="5" fill="#6a7060"/>
    <!-- Eye patch -->
    <rect x="155" y="160" width="25" height="22" rx="6" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="155" y1="171" x2="170" y2="171" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="162" y1="165" x2="162" y2="177" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Small mouth -->
    <line x1="125" y1="195" x2="145" y2="198" stroke="#5a5540" stroke-width="2" stroke-linecap="round"/>
    <!-- Bent neck -->
    <rect x="125" y="235" width="40" height="15" rx="5" fill="#887868" stroke="#6a5858" stroke-width="2"/>
    <!-- Shoulder rust -->
    <circle cx="95" cy="250" r="8" fill="#8a6050" opacity="0.7"/>
    <!-- Arm with cane -->
    <rect x="70" y="270" width="22" height="190" rx="8" fill="#7a6a5a" stroke="#5a4a3a" stroke-width="2"/>
    <rect x="60" y="450" width="30" height="30" rx="6" fill="#5a4a3a" stroke="#3a2a2a" stroke-width="2"/>
    <!-- Cane -->
    <line x1="85" y1="460" x2="140" y2="540" stroke="#3a2a1a" stroke-width="6" stroke-linecap="round"/>
    <line x1="130" y1="530" x2="135" y2="550" stroke="#3a2a1a" stroke-width="6" stroke-linecap="round"/>
    <rect x="125" y="540" width="15" height="12" rx="4" fill="#2a1a0a" stroke="#1a100a" stroke-width="2"/>
    <!-- Other arm bent -->
    <rect x="175" y="270" width="25" height="150" rx="8" fill="#7a6a5a" stroke="#5a4a3a" stroke-width="2" transform="rotate(20 187 345)"/>
    <rect x="190" y="400" width="30" height="35" rx="8" fill="#5a4a3a" stroke="#3a2a2a" stroke-width="2"/>
    <!-- Bent legs -->
    <rect x="115" y="470" width="28" height="70" rx="8" fill="#5a4a3a" stroke="#3a2a2a" stroke-width="2" transform="rotate(10 129 505)"/>
    <rect x="145" y="475" width="28" height="65" rx="8" fill="#5a4a3a" stroke="#3a2a2a" stroke-width="2" transform="rotate(-5 159 507)"/>
    <rect x="110" y="530" width="35" height="22" rx="8" fill="#4a3a3a" stroke="#2a1a1a" stroke-width="2"/>
    <rect x="140" y="535" width="35" height="22" rx="8" fill="#4a3a3a" stroke="#2a1a1a" stroke-width="2"/>
    <!-- Small bent antenna -->
    <line x1="150" y1="130" x2="150" y2="115" stroke="#887868" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="110" r="4" fill="#8a6050" stroke="#6a4030" stroke-width="1.5"/>
  </g>

  <!-- Small decorative plants/frame accents -->
  <rect x="50" y="580" width="20" height="15" rx="3" fill="#5a7a5a" opacity="0.7"/>
  <rect x="830" y="575" width="25" height="18" rx="3" fill="#5a7a5a" opacity="0.7"/>
  <rect x="60" y="565" width="8" height="25" rx="2" fill="#4a6a4a" opacity="0.6"/>
  <rect x="835" y="560" width="9" height="30" rx="2" fill="#4a6a4a" opacity="0.6"/>

  <!-- Awkward family portrait title area (decorative only, no text) -->
  <rect x="320" y="20" width="260" height="35" rx="5" fill="#5a4a3a" opacity="0.85"/>
  <line x1="340" y1="27" x2="560" y2="27" stroke="#b8a898" stroke-width="1" opacity="0.5"/>
  <rect x="340" y="40" width="220" height="2" rx="1" fill="#b8a898" opacity="0.3"/>

</svg>
