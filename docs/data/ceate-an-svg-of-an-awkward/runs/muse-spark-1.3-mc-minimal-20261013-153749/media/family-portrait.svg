<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a5e"/><stop offset="1" stop-color="#232c3a"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5a4a"/><stop offset="1" stop-color="#4a3f34"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa7b8"/><stop offset="1" stop-color="#d6e0ec"/><stop offset="0.5" stop-color="#b8c4d4"/></linearGradient>
<linearGradient id="copper" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b87333"/><stop offset="0.5" stop-color="#e8a86a"/><stop offset="1" stop-color="#8a4f1e"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1000" height="750" fill="url(#wall)"/>
<!-- wallpaper pattern -->
<g fill="#ffffff" opacity="0.06">
<circle cx="100" cy="100" r="18"/><circle cx="300" cy="100" r="18"/><circle cx="500" cy="100" r="18"/><circle cx="700" cy="100" r="18"/><circle cx="900" cy="100" r="18"/>
<circle cx="200" cy="220" r="18"/><circle cx="400" cy="220" r="18"/><circle cx="600" cy="220" r="18"/><circle cx="800" cy="220" r="18"/>
</g>
<!-- picture frame crooked -->
<g transform="rotate(-6 820 160)">
<rect x="730" y="90" width="180" height="140" fill="#c9a86a" stroke="#5a4318" stroke-width="6"/>
<rect x="745" y="105" width="150" height="110" fill="#1a2a3a"/>
<circle cx="820" cy="160" r="25" fill="none" stroke="#7fd4ff" stroke-width="4"/><circle cx="812" cy="155" r="4" fill="#ff5555"/><circle cx="828" cy="155" r="4" fill="#ff5555"/>
</g>
<rect y="540" width="1000" height="210" fill="url(#floor)"/>
<ellipse cx="500" cy="620" rx="420" ry="60" fill="#000" opacity="0.25"/>
<ellipse cx="500" cy="300" rx="320" ry="200" fill="url(#glow)" opacity="0.35"/>

<!-- DAD: tall boxy, stiff, hand on kid head too hard -->
<g>
<rect x="230" y="300" width="130" height="180" rx="18" fill="url(#metal)" stroke="#2f3a4a" stroke-width="5"/>
<circle cx="295" cy="395" r="22" fill="#2f3a4a"/><circle cx="295" cy="395" r="12" fill="#ffde59"/>
<rect x="225" y="230" width="140" height="100" rx="20" fill="url(#metal)" stroke="#2f3a4a" stroke-width="5"/>
<rect x="250" y="255" width="90" height="28" rx="10" fill="#101820"/>
<circle cx="275" cy="269" r="9" fill="#7fd4ff"/><circle cx="315" cy="269" r="9" fill="#7fd4ff"/><circle cx="275" cy="269" r="3" fill="#000"/><circle cx="315" cy="269" r="3" fill="#000"/>
<rect x="265" y="295" width="60" height="10" rx="5" fill="none" stroke="#2f3a4a" stroke-width="4"/> <!-- flat forced smile -->
<rect x="215" y="210" width="30" height="14" fill="#ff5555" stroke="#333" stroke-width="3"/> <!-- antenna bent -->
<line x1="230" y1="210" x2="240" y2="230" stroke="#333" stroke-width="4"/>
<!-- arms: one stiff down, one pressing kid -->
<rect x="190" y="310" width="35" height="130" rx="12" fill="#8a96a8" stroke="#2f3a4a" stroke-width="4"/>
<circle cx="207" cy="455" r="18" fill="#556" stroke="#2f3a4a" stroke-width="4"/>
<rect x="360" y="310" width="35" height="110" rx="12" fill="#8a96a8" stroke="#2f3a4a" stroke-width="4" transform="rotate(25 377 315)"/>
<circle cx="425" cy="405" r="18" fill="#556" stroke="#2f3a4a" stroke-width="4"/>
<rect x="250" y="480" width="35" height="90" fill="#6a7688" stroke="#2f3a4a" stroke-width="4"/><rect x="305" y="480" width="35" height="90" fill="#6a7688" stroke="#2f3a4a" stroke-width="4"/>
<rect x="245" y="565" width="45" height="20" rx="6" fill="#222"/><rect x="300" y="565" width="45" height="20" rx="6" fill="#222"/>
<rect x="245" y="180" width="90" height="30" rx="6" fill="#2f3a4a"/> <!-- tie awkward -->
<rect x="283" y="210" width="24" height="70" fill="#c0392b"/>
</g>

<!-- MOM: copper, leaning away, forced hand on dad shoulder -->
<g>
<rect x="600" y="320" width="115" height="160" rx="40" fill="url(#copper)" stroke="#4a2a10" stroke-width="5"/>
<circle cx="657" cy="400" r="16" fill="#fff7cc" stroke="#4a2a10" stroke-width="3"/>
<ellipse cx="657" cy="240" rx="70" ry="75" fill="url(#copper)" stroke="#4a2a10" stroke-width="5"/>
<ellipse cx="630" cy="245" rx="14" ry="18" fill="#101820"/><ellipse cx="684" cy="245" rx="14" ry="18" fill="#101820"/>
<circle cx="630" cy="247" r="5" fill="#ff6ec7"/><circle cx="684" cy="247" r="5" fill="#ff6ec7"/>
<path d="M625 285 Q657 295 689 278" fill="none" stroke="#4a2a10" stroke-width="5" stroke-linecap="round"/> <!-- tight smile -->
<circle cx="605" cy="210" r="12" fill="#ff6ec7" stroke="#4a2a10" stroke-width="3"/><circle cx="709" cy="210" r="12" fill="#ff6ec7" stroke="#4a2a10" stroke-width="3"/>
<path d="M590 200 Q657 130 724 200" fill="none" stroke="#4a2a10" stroke-width="8"/>
<!-- arm reaching to dad but not touching -->
<rect x="540" y="330" width="70" height="28" rx="14" fill="#c47a3a" stroke="#4a2a10" stroke-width="4" transform="rotate(-18 575 344)"/>
<circle cx="528" cy="360" r="15" fill="#8a96a8" stroke="#333" stroke-width="3"/>
<rect x="710" y="335" width="30" height="120" rx="12" fill="#c47a3a" stroke="#4a2a10" stroke-width="4"/>
<rect x="620" y="480" width="30" height="95" fill="#7a4a22" stroke="#333" stroke-width="4"/><rect x="665" y="480" width="30" height="95" fill="#7a4a22" stroke="#333" stroke-width="4"/>
</g>

<!-- TEEN: lanky, slouched, eye-roll, headphones -->
<g transform="rotate(8 500 400)">
<rect x="455" y="360" width="90" height="140" rx="12" fill="#5a6b7d" stroke="#1a2530" stroke-width="5"/>
<rect x="435" y="250" width="130" height="110" rx="24" fill="#8a96a8" stroke="#1a2530" stroke-width="5"/>
<rect x="460" y="280" width="80" height="34" rx="8" fill="#101820"/>
<circle cx="482" cy="297" r="8" fill="#ff5555"/><!-- one red eye roll up -->
<circle cx="518" cy="297" r="8" fill="#7fd4ff"/>
<path d="M470 330 Q500 325 530 332" stroke="#1a2530" stroke-width="5" fill="none"/>
<rect x="425" y="260" width="20" height="60" rx="10" fill="#ffde59" stroke="#333" stroke-width="4"/>
<rect x="560" y="260" width="20" height="60" rx="10" fill="#ffde59" stroke="#333" stroke-width="4"/>
<path d="M425 260 Q500 210 580 260" fill="none" stroke="#333" stroke-width="8"/>
<rect x="410" y="365" width="28" height="110" rx="10" fill="#465664" stroke="#1a2530" stroke-width="4"/>
<rect x="572" y="365" width="28" height="110" rx="10" fill="#465664" stroke="#1a2530" stroke-width="4"/>
<rect x="465" y="500" width="28" height="80" fill="#333"/><rect x="507" y="500" width="28" height="80" fill="#333"/>
</g>

<!-- SMALL KID squished under dad hand, goofy buck teeth grin -->
<g>
<rect x="390" y="450" width="80" height="80" rx="16" fill="#a8d8ff" stroke="#2a4a66" stroke-width="4"/>
<rect x="395" y="400" width="70" height="60" rx="14" fill="#a8d8ff" stroke="#2a4a66" stroke-width="4"/>
<circle cx="413" cy="422" r="8" fill="#fff" stroke="#333" stroke-width="3"/><circle cx="447" cy="422" r="8" fill="#fff" stroke="#333" stroke-width="3"/>
<circle cx="414" cy="423" r="3" fill="#000"/><circle cx="448" cy="423" r="3" fill="#000"/>
<rect x="415" y="438" width="30" height="16" fill="#5a1a1a" stroke="#333" stroke-width="2"/><rect x="422" y="438" width="8" height="10" fill="#fff"/><rect x="431" y="438" width="8" height="10" fill="#fff"/>
<!-- antenna with propeller beanie -->
<line x1="430" y1="400" x2="430" y2="375" stroke="#333" stroke-width="4"/>
<ellipse cx="430" cy="368" rx="30" ry="8" fill="#ff5555" stroke="#333" stroke-width="3" transform="rotate(20 430 368)"/>
</g>

<!-- BABY toaster on floor + ROBOT DOG -->
<g>
<rect x="730" y="500" width="110" height="70" rx="14" fill="#d9d9d9" stroke="#333" stroke-width="5"/>
<circle cx="760" cy="535" r="10" fill="#101820"/><circle cx="810" cy="535" r="10" fill="#101820"/>
<circle cx="760" cy="535" r="4" fill="#7fff9e"/><circle cx="810" cy="535" r="4" fill="#7fff9e"/>
<rect x="775" y="552" width="20" height="8" fill="#333"/>
<rect x="770" y="470" width="30" height="25" fill="#999" stroke="#333" stroke-width="3"/> <!-- toast popping -->
<rect x="125" y="520" width="110" height="60" rx="20" fill="#7a8a9a" stroke="#222" stroke-width="4"/>
<rect x="115" y="500" width="50" height="40" rx="12" fill="#7a8a9a" stroke="#222" stroke-width="4"/>
<circle cx="135" cy="515" r="6" fill="#ffde59" stroke="#222" stroke-width="2"/>
<rect x="220" y="535" width="40" height="12" fill="#555" stroke="#222" stroke-width="3"/> <!-- tail drooping -->
<circle cx="145" cy="565" r="12" fill="#333"/><circle cx="210" cy="565" r="12" fill="#333"/>
<rect x="180" y="490" width="12" height="25" fill="#555" stroke="#222" stroke-width="2" transform="rotate(-20 186 502)"/> <!-- ear floppy -->
</g>
<!-- flash vignette -->
<rect width="1000" height="750" fill="none" stroke="#111" stroke-width="24" opacity="0.6"/>
</svg>