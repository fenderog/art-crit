  <g transform="translate(790 -14)">
    <path d="M-14 640 v32 M14 640 v32" stroke="#2f7f6e" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="-16" cy="676" rx="18" ry="8" fill="#1d4f44"/><ellipse cx="18" cy="676" rx="18" ry="8" fill="#1d4f44"/>
    <rect x="-34" y="548" width="68" height="100" rx="14" fill="#4fc9a8"/>
    <path d="M-34 590 H34" stroke="#2f7f6e" stroke-width="6"/>
    <circle cx="0" cy="620" r="10" fill="#ffd34d"/>
    <path d="M-30 560 L-62 500" stroke="#4fc9a8" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 560 L64 512" stroke="#4fc9a8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-64" cy="494" r="11" fill="#2f7f6e"/><circle cx="66" cy="506" r="11" fill="#2f7f6e"/>
    <circle cx="0" cy="490" r="46" fill="#4fc9a8"/>
    <path d="M0 444 q-14 -14 0 -26 q14 -12 0 -26" stroke="#2f7f6e" stroke-width="5" fill="none"/>
    <circle cx="0" cy="388" r="9" fill="#ff5d73"/>
    <circle cx="-4" cy="478" r="22" fill="#fff"/><circle cx="2" cy="474" r="10" fill="#1d2a26"/><circle cx="-2" cy="470" r="3" fill="#fff"/>
    <path d="M-22 508 q22 40 44 0Z" fill="#1d2a26"/><ellipse cx="0" cy="522" rx="9" ry="6" fill="#ff7f9a"/>
    <g stroke="#2f7f6e" stroke-width="4" stroke-linecap="round"><path d="M-84 560 l-18 8 M-86 590 l-20 0 M86 580 l20 6 M84 612 l18 10"/></g>
  </g>

  <!-- TEEN (right): slouched, arms crossed, looking away -->
  <g>
    <rect x="910" y="580" width="20" height="102" rx="6" fill="#4a3c78"/>
    <rect x="950" y="580" width="20" height="102" rx="6" fill="#4a3c78"/>
    <rect x="898" y="672" width="44" height="18" rx="7" fill="#e8e8e8"/><rect x="942" y="672" width="44" height="18" rx="7" fill="#e8e8e8"/>
    <rect x="895" y="352" width="90" height="240" rx="14" fill="#3b3f58" transform="rotate(4 940 592)"/>
    <path d="M905 360 Q940 396 978 366 L984 420 L900 420Z" fill="#2b2e44" transform="rotate(4 940 592)"/>
    <path d="M900 440 H990" stroke="#7a62d1" stroke-width="5" opacity=".7"/>
    <circle cx="942" cy="500" r="14" fill="none" stroke="#7a62d1" stroke-width="5"/>
    <!-- crossed arms -->
