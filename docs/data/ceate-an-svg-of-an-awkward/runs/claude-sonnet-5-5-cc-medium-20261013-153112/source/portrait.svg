    <path d="M585 520 H715" stroke="#7b2f26" stroke-width="6"/>
    <circle cx="650" cy="520" r="10" fill="#f2d78a"/>
    <rect x="636" y="338" width="28" height="32" fill="#c85a43"/>
    <circle cx="650" cy="262" r="64" fill="url(#coral)"/>
