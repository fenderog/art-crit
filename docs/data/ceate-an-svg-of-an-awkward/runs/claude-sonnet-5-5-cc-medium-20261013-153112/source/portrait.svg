    <path d="M598 628 l-4 -22 l16 14Z M634 628 l8 -22 l6 24Z" fill="#b8982f"/>
    <circle cx="620" cy="648" r="13" fill="#fff"/><circle cx="620" cy="648" r="6" fill="#111"/>
    <rect x="636" y="660" width="20" height="10" rx="5" fill="#333"/>
    <path d="M502 668 q-34 -6 -26 -36 q8 -24 26 -10" stroke="#555" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M470 612 l-10 -12 M478 608 l2 -16 M486 614 l10 -12" stroke="#ffd34d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect width="1200" height="800" fill="url(#vig)"/>
</svg>
