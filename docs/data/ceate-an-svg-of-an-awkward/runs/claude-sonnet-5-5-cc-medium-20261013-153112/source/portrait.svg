    <path d="M96 520 q-1 -22 -22 -18" stroke="#3a2a18" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="-84" y="425" width="20" height="110" rx="9" fill="url(#brass)" transform="rotate(8 -74 425)"/>
