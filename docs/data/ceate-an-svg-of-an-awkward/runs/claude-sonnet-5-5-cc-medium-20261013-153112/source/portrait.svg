    <path d="M408 216 h40 M452 216 h40" stroke="#40566d" stroke-width="6"/>
    <!-- rictus grille smile -->
    <rect x="410" y="272" width="80" height="24" rx="5" fill="#14202c"/>
    <path d="M425 272V296M440 272V296M455 272V296M470 272V296M485 272V296" stroke="#e8eef4" stroke-width="4"/>
    <path d="M404 268 l6 6 M496 268 l-6 6" stroke="#40566d" stroke-width="4"/>
  </g>

  <!-- MOM (center): side-eye, tight smile, glowing bulb -->
  <g>
    <rect x="620" y="590" width="22" height="92" rx="6" fill="#a8473a"/>
    <rect x="660" y="590" width="22" height="92" rx="6" fill="#a8473a"/>
    <ellipse cx="626" cy="684" rx="28" ry="10" fill="#5a2a22"/><ellipse cx="676" cy="684" rx="28" ry="10" fill="#5a2a22"/>
