    <rect x="418" y="590" width="26" height="92" rx="6" fill="#56718c"/>
    <rect x="456" y="590" width="26" height="92" rx="6" fill="#56718c"/>
    <rect x="406" y="672" width="46" height="18" rx="7" fill="#2c3a4a"/>
