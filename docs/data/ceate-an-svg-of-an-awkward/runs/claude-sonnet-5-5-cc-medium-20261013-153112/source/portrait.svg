    <path d="M656 230 q22 -22 44 -2" stroke="#7b2f26" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M628 303 h44" stroke="#4a1a14" stroke-width="5" stroke-linecap="round"/>
    <circle cx="598" cy="290" r="9" fill="#ff9a8a" opacity=".6"/><circle cx="702" cy="290" r="9" fill="#ff9a8a" opacity=".6"/>
    <!-- arms clasped at front holding a bundle of cables -->
    <path d="M604 380 Q570 470 640 525" stroke="#c85a43" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M700 380 Q735 460 665 525" stroke="#c85a43" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="650" cy="530" r="16" fill="#8a3a2e"/>
    <path d="M640 520 q-20 -40 -6 -60 M650 518 q4 -48 24 -58 M660 520 q22 -30 40 -26" stroke="#5aa86a" stroke-width="4" fill="none"/>
    <circle cx="634" cy="458" r="6" fill="#f2b632"/><circle cx="674" cy="460" r="6" fill="#e36a5a"/><circle cx="700" cy="494" r="6" fill="#f2b632"/>
  </g>

  <!-- DAD's arm: too high, clamped on mom's shoulder -->
  <path d="M510 366 Q560 330 620 352 L690 366" stroke="#6a86a3" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2c3a4a"><rect x="676" y="352" width="30" height="30" rx="6"/><path d="M706 356 l14 6 l-14 6Z M706 368 l14 4 l-14 6Z"/></g>
  <circle cx="512" cy="368" r="14" fill="#40566d"/>

