    <rect x="365" y="352" width="22" height="140" rx="10" fill="#6a86a3"/>
    <rect x="363" y="486" width="26" height="26" rx="8" fill="#2c3a4a"/>
    <rect x="410" y="372" width="80" height="52" rx="6" fill="#40566d"/>
    <circle cx="428" cy="398" r="7" fill="#8fe39a"/><circle cx="450" cy="398" r="7" fill="#e3c35a"/><circle cx="472" cy="398" r="7" fill="#e36a5a"/>
    <path d="M450 430 l-16 14 l10 100 l6 12 l6 -12 l10 -100Z" fill="#b8352f"/>
    <rect x="436" y="428" width="28" height="12" rx="3" fill="#8e2420"/>
    <rect x="436" y="306" width="28" height="40" fill="#40566d"/>
    <rect x="392" y="196" width="116" height="116" rx="16" fill="url(#steel)"/>
    <path d="M450 196 V170" stroke="#40566d" stroke-width="6"/><circle cx="450" cy="164" r="9" fill="#b8352f"/>
    <rect x="410" y="226" width="34" height="34" rx="4" fill="#fff"/><rect x="456" y="226" width="34" height="34" rx="4" fill="#fff"/>
