      <rect x="-14" y="372" width="28" height="36" fill="#4a3a20"/>
      <rect x="-60" y="270" width="120" height="110" rx="30" fill="url(#brass)"/>
      <path d="M-30 275 l12 20 l-8 18" stroke="#3a2a18" stroke-width="3" fill="none"/>
      <path d="M-20 270 q-10 -26 -34 -22 M0 268 q4 -30 -10 -44 M18 270 q18 -22 36 -8" stroke="#bbb" stroke-width="3" fill="none"/>
      <path d="M-40 322 q15 12 30 0 M10 322 q15 12 30 0" stroke="#2b2013" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M-36 308 h26 M10 308 h26" stroke="#2b2013" stroke-width="3"/>
      <ellipse cx="0" cy="355" rx="14" ry="8" fill="#2b2013"/>
      <circle cx="20" cy="352" r="9" fill="#cfe6ea" opacity=".8" stroke="#fff"/>
      <circle cx="40" cy="342" r="4" fill="#cfe6ea" opacity=".7"/>
    </g>
