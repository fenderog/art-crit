    <path d="M990 400 Q960 470 904 478" stroke="#6c6f95" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="990" cy="470" r="11" fill="#2b2e44"/><circle cx="904" cy="478" r="11" fill="#2b2e44"/>
    <!-- head tilted away -->
    <g transform="rotate(14 950 340)">
      <rect x="936" y="316" width="26" height="34" fill="#2b2e44"/>
      <rect x="900" y="232" width="100" height="92" rx="22" fill="#9a9dc4"/>
      <rect x="912" y="260" width="76" height="30" rx="14" fill="#14152a"/>
      <ellipse cx="944" cy="276" rx="9" ry="5" fill="#7af0d0"/><ellipse cx="974" cy="276" rx="9" ry="5" fill="#7af0d0"/>
      <rect x="935" y="270" width="20" height="6" fill="#14152a"/><rect x="965" y="270" width="20" height="6" fill="#14152a"/>
      <path d="M938 306 h34" stroke="#3b3f58" stroke-width="5" stroke-linecap="round"/>
      <path d="M898 270 a52 52 0 0 1 104 0" stroke="#e36a8a" stroke-width="10" fill="none"/>
      <rect x="890" y="260" width="16" height="40" rx="7" fill="#e36a8a"/><rect x="994" y="260" width="16" height="40" rx="7" fill="#e36a8a"/>
      <path d="M950 232 l10 -22 l10 22Z" fill="#7af0d0"/>
    </g>
  </g>

  <!-- PET vacuum-dog (front, staring at camera) -->
  <g>
    <rect x="500" y="652" width="104" height="46" rx="22" fill="#e2c14d"/>
    <rect x="512" y="662" width="50" height="8" rx="4" fill="#b8982f"/>
    <circle cx="522" cy="702" r="12" fill="#222"/><circle cx="586" cy="702" r="12" fill="#222"/>
