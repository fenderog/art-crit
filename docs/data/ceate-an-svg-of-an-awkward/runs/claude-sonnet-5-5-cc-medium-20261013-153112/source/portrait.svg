<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7f86"/><stop offset="1" stop-color="#8fae9f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a3a"/><stop offset="1" stop-color="#4e2f1e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d9bb8"/><stop offset=".5" stop-color="#a9c2d8"/><stop offset="1" stop-color="#6a86a3"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9684f"/><stop offset=".5" stop-color="#f08c70"/><stop offset="1" stop-color="#c85a43"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d6a2e"/><stop offset=".5" stop-color="#c9a24f"/><stop offset="1" stop-color="#7a5a26"/>
    </linearGradient>
    <radialGradient id="bulb"><stop offset="0" stop-color="#fff7a8"/><stop offset="1" stop-color="#f2b632"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
    <pattern id="paper" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 8 L42 30 L30 52 L18 30Z" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="3"/>
      <circle cx="0" cy="0" r="4" fill="#fff" fill-opacity=".08"/><circle cx="60" cy="60" r="4" fill="#fff" fill-opacity=".08"/>
    </pattern>
  </defs>

  <!-- room -->
  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect width="1200" height="650" fill="url(#paper)"/>
  <rect y="610" width="1200" height="26" fill="#d8cdb4"/>
  <rect y="636" width="1200" height="164" fill="url(#floor)"/>
  <g stroke="#2e1a10" stroke-opacity=".35" stroke-width="3">
    <path d="M0 700H1200M0 770H1200M200 636L120 800M520 636L480 800M860 636L900 800M1100 636L1200 780"/>
  </g>
  <!-- crooked frame on wall (gear painting) -->
  <g transform="translate(610 110) rotate(-7)">
    <rect x="-110" y="-70" width="220" height="140" rx="6" fill="#5b3b22"/>
    <rect x="-96" y="-56" width="192" height="112" fill="#e9dfc4"/>
    <circle r="36" fill="#9a7b4f"/><circle r="14" fill="#e9dfc4"/>
    <g stroke="#9a7b4f" stroke-width="12"><path d="M0-46V-36M0 36V46M-46 0H-36M36 0H46"/></g>
  </g>
  <!-- window light on the left -->
  <path d="M60 80 H190 V400 H60Z" fill="#cfe6ea" opacity=".35"/>
  <path d="M125 80V400M60 240H190" stroke="#3d5a60" stroke-width="8" opacity=".5"/>

  <!-- shadows -->
  <g fill="#000" opacity=".3">
    <ellipse cx="240" cy="698" rx="95" ry="14"/>
    <ellipse cx="450" cy="698" rx="95" ry="14"/>
    <ellipse cx="650" cy="696" rx="90" ry="13"/>
    <ellipse cx="552" cy="722" rx="70" ry="10"/>
    <ellipse cx="790" cy="712" rx="38" ry="8"/>
    <ellipse cx="940" cy="698" rx="80" ry="12"/>
  </g>

  <!-- GRANDPA (left): rusty, asleep, leaning on cane -->
  <g transform="translate(230 0) rotate(-5 0 690)">
    <rect x="-34" y="600" width="20" height="82" rx="6" fill="#6a4f22"/>
    <rect x="8" y="600" width="20" height="82" rx="6" fill="#6a4f22"/>
    <rect x="-46" y="672" width="40" height="18" rx="7" fill="#4a3a20"/>
    <rect x="-2" y="672" width="40" height="18" rx="7" fill="#4a3a20"/>
    <rect x="-62" y="400" width="124" height="210" rx="20" fill="url(#brass)"/>
    <g fill="#8a4a22" opacity=".6"><circle cx="-30" cy="560" r="14"/><circle cx="20" cy="440" r="9"/><circle cx="35" cy="580" r="11"/></g>
    <rect x="-36" y="440" width="72" height="50" rx="8" fill="#5a431e"/>
    <circle cx="-14" cy="465" r="8" fill="#e5b84a"/><circle cx="14" cy="465" r="8" fill="#6a8f6a"/>
