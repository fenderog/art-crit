<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f5f0e8"/>

  <!-- Back wall -->
  <rect x="50" y="80" width="700" height="400" fill="#e8dcc8" stroke="#c0a080" stroke-width="4"/>

  <!-- Background portraits (faint) -->
  <rect x="120" y="130" width="80" height="100" fill="#d0b898" opacity="0.5" rx="5"/>
  <rect x="580" y="140" width="90" height="110" fill="#d0b898" opacity="0.5" rx="5"/>

  <!-- Parent robot (left, large, stiff) -->
  <g transform="translate(180,220)">
    <!-- Body -->
    <rect x="-70" y="-80" width="140" height="220" rx="20" fill="#6a5a4a" stroke="#4a3a2a" stroke-width="4"/>
    <!-- Head -->
    <rect x="-50" y="-140" width="100" height="100" rx="15" fill="#8a7a6a" stroke="#4a3a2a" stroke-width="4"/>
    <!-- Eyes -->
    <circle cx="-20" cy="-110" r="12" fill="#2a2a2a"/>
    <circle cx="20" cy="-110" r="12" fill="#2a2a2a"/>
    <!-- Mouth -->
    <line x1="-15" y1="-85" x2="15" y2="-85" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
    <!-- Antenna -->
    <line x1="0" y1="-140" x2="0" y2="-170" stroke="#4a3a2a" stroke-width="4"/>
    <circle cx="0" cy="-175" r="8" fill="#c0a080"/>
    <!-- Arm (awkward, stiff out) -->
    <rect x="60" y="-20" width="80" height="30" rx="8" fill="#8a7a6a" stroke="#4a3a2a" stroke-width="3" transform="rotate(-10 100 -5)"/>
    <!-- Hand -->
    <circle cx="145" cy="-10" r="15" fill="#bfa080" stroke="#4a3a2a" stroke-width="3"/>
  </g>

  <!-- Child robot (middle, small, tilted) -->
  <g transform="translate(420,280) rotate(-8)">
    <rect x="-50" y="-70" width="100" height="140" rx="15" fill="#c89a6a" stroke="#8a5a3a" stroke-width="3"/>
    <rect x="-35" y="-110" width="70" height="70" rx="10" fill="#e8b07a" stroke="#8a5a3a" stroke-width="3"/>
    <circle cx="-15" cy="-85" r="10" fill="#2a2a2a"/>
    <circle cx="15" cy="-90" r="10" fill="#2a2a2a"/>
    <path d="M -10 -65 Q 0 -55 10 -65" stroke="#8a5a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- One arm raised awkwardly -->
    <rect x="30" y="-30" width="15" height="60" rx="7" fill="#e8b07a" stroke="#8a5a3a" stroke-width="3" transform="rotate(20 37 -30)"/>
    <circle cx="50" cy="-5" r="12" fill="#e8b07a" stroke="#8a5a3a" stroke-width="3"/>
    <!-- Other arm dangling -->
    <rect x="-55" y="20" width="15" height="55" rx="7" fill="#e8b07a" stroke="#8a5a3a" stroke-width="3" transform="rotate(-25 -47 47)"/>
    <circle cx="-60" cy="75" r="12" fill="#e8b07a" stroke="#8a5a3a" stroke-width="3"/>
  </g>

  <!-- Grandparent robot (right, bent, leaning) -->
  <g transform="translate(600,250) rotate(5)">
    <rect x="-65" y="-90" width="130" height="200" rx="20" fill="#7a8a9a" stroke="#3a4a6a" stroke-width="4"/>
    <rect x="-45" y="-130" width="90" height="80" rx="12" fill="#9aaab8" stroke="#3a4a6a" stroke-width="4"/>
    <circle cx="-15" cy="-100" r="12" fill="#2a2a2a"/>
    <circle cx="15" cy="-100" r="12" fill="#2a2a2a"/>
    <line x1="-15" y1="-70" x2="15" y2="-70" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
    <!-- Cane / staff -->
    <line x1="70" y1="-20" x2="90" y2="100" stroke="#5a3a2a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="90" cy="102" r="10" fill="#5a3a2a"/>
    <!-- Bent posture arm -->
    <rect x="-100" y="-10" width="25" height="70" rx="8" fill="#9aaab8" stroke="#3a4a6a" stroke-width="3" transform="rotate(-30 -87 25)"/>
    <circle cx="-115" cy="50" r="14" fill="#9aaab8" stroke="#3a4a6a" stroke-width="3"/>
  </g>

  <!-- Small pet robot (front left, peeking) -->
  <g transform="translate(300,400)">
    <rect x="-30" y="-30" width="60" height="50" rx="10" fill="#e0b0a0" stroke="#a06070" stroke-width="3"/>
    <circle cx="0" cy="-10" r="18" fill="#e8c0b0" stroke="#a06070" stroke-width="3"/>
    <circle cx="-10" cy="-5" r="6" fill="#2a2a2a"/>
    <circle cx="10" cy="-5" r="6" fill="#2a2a2a"/>
    <path d="M -8 5 Q 0 12 8 5" stroke="#a06070" stroke-width="2" fill="none"/>
    <!-- Little tail -->
    <path d="M 30 10 Q 50 20 40 35" stroke="#e0b0a0" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
