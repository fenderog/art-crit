<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <rect width="600" height="500" fill="#fdf6e3"/>
  <!-- Group poses -->
  <!-- Tall parent robot -->
  <g transform="translate(140,60)">
    <rect x="30" y="20" width="60" height="100" rx="10" fill="#6fa8dc"/>
    <circle cx="60" cy="50" r="25" fill="#d4e157"/>
    <rect x="50" y="80" width="8" height="60" fill="#b0bec5"/>
    <rect x="75" y="100" width="8" height="40" fill="#b0bec5"/>
    <circle cx="50" cy="55" r="3" fill="#333"/>
    <circle cx="70" cy="55" r="3" fill="#333"/>
  </g>
  <!-- Small child robot reaching up -->
  <g transform="translate(260,200)">
    <rect x="20" y="10" width="40" height="70" rx="10" fill="#f48fb1"/>
    <circle cx="40" cy="45" r="18" fill="#ffcc80"/>
    <rect x="30" y="70" width="8" height="40" fill="#90a4ae"/>
    <rect x="45" y="75" width="8" height="35" fill="#90a4ae"/>
    <circle cx="35" cy="42" r="2.5" fill="#333"/>
    <circle cx="47" cy="42" r="2.5" fill="#333"/>
  </g>
  <!-- Parent arm reaching awkwardly -->
  <rect x="190" y="130" width="80" height="14" rx="7" fill="#6fa8dc" transform="rotate(-15 230 137)"/>

  <!-- Brooding teen robot -->
  <g transform="translate(380,100)">
    <rect x="30" y="20" width="60" height="90" rx="10" fill="#ce93d8"/>
    <circle cx="60" cy="50" r="22" fill="#e1bee7"/>
    <rect x="55" y="80" width="8" height="50" fill="#b0bec5"/>
    <rect x="75" y="85" width="8" height="45" fill="#b0bec5"/>
  </g>
  <!-- Pet robot -->
  <g transform="translate(450,300)">
    <rect x="10" y="20" width="50" height="50" rx="25" fill="#80cbc4"/>
    <circle cx="35" cy="45" r="16" fill="#a7ffeb"/>
    <rect x="25" y="65" width="6" height="20" fill="#90a4ae"/>
  </g>
</svg>
