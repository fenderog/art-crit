<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3b44"/>
      <stop offset="0.55" stop-color="#12262e"/>
      <stop offset="1" stop-color="#0a161b"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#3d6b70" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#26454c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0a161b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2b24"/>
      <stop offset="1" stop-color="#1c1310"/>
    </linearGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3b3b"/>
      <stop offset="1" stop-color="#3a2526"/>
    </linearGradient>

    <linearGradient id="dadBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93a1ae"/>
      <stop offset="0.5" stop-color="#6f7d8a"/>
      <stop offset="1" stop-color="#4e5a66"/>
    </linearGradient>
    <linearGradient id="momBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="0.55" stop-color="#e3ddd0"/>
      <stop offset="1" stop-color="#bdb4a4"/>
    </linearGradient>
    <linearGradient id="teenBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3d47"/>
      <stop offset="1" stop-color="#1b1b21"/>
    </linearGradient>
    <linearGradient id="totBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c795"/>
      <stop offset="1" stop-color="#c9935d"/>
    </linearGradient>
    <linearGradient id="granBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fae98"/>
      <stop offset="1" stop-color="#4f6b5c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c766"/>
      <stop offset="1" stop-color="#9d7520"/>
    </linearGradient>
    <linearGradient id="chairG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5741"/>
      <stop offset="1" stop-color="#3f3125"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- ============ BACKDROP ============ -->
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <ellipse cx="800" cy="430" rx="720" ry="470" fill="url(#spot)"/>
  <rect y="820" width="1600" height="180" fill="url(#floor)"/>
  <ellipse cx="760" cy="905" rx="640" ry="70" fill="#000" opacity="0.35"/>
  <path d="M120 900 Q800 830 1560 900 L1560 960 Q800 900 120 960 Z" fill="url(#rug)" opacity="0.55"/>

  <!-- ============ GRANDMOTHER'S WINGBACK CHAIR ============ -->
  <g transform="translate(255,0)" filter="url(#shadow)">
    <rect x="-150" y="320" width="300" height="440" rx="52" fill="url(#chairG)"/>
    <path d="M-148 400 Q-222 452 -206 640 L-138 664 Z" fill="#5a4734"/>
    <path d="M148 400 Q222 452 206 640 L138 664 Z" fill="#5a4734"/>
    <rect x="-142" y="700" width="284" height="92" rx="26" fill="#6f5941"/>
    <rect x="-118" y="784" width="26" height="72" rx="10" fill="#2e241a"/>
    <rect x="92" y="784" width="26" height="72" rx="10" fill="#2e241a"/>
    <!-- tufting -->
    <g stroke="#2e241a" stroke-width="3" opacity="0.5" fill="none">
      <path d="M-90 360 L-90 440 M0 350 L0 440 M90 360 L90 440"/>
    </g>
  </g>

  <!-- ============ SOFA ============ -->
  <g filter="url(#shadow)">
    <rect x="470" y="462" width="920" height="286" rx="48" fill="#7c3b46"/>
    <rect x="500" y="492" width="380" height="210" rx="34" fill="#8b4753"/>
    <rect x="900" y="492" width="460" height="210" rx="34" fill="#8b4753"/>
    <path d="M500 620 Q880 585 1360 620" stroke="#5f2b34" stroke-width="6" fill="none" opacity="0.7"/>
    <rect x="470" y="686" width="920" height="126" rx="36" fill="#8b4753"/>
    <path d="M560 692 Q800 672 1040 692" stroke="#5f2b34" stroke-width="5" fill="none" opacity="0.55"/>
    <rect x="446" y="596" width="92" height="216" rx="44" fill="#8b4753"/>
    <rect x="1322" y="596" width="92" height="216" rx="44" fill="#8b4753"/>
    <rect x="500" y="808" width="26" height="56" rx="10" fill="#2e241a"/>
    <rect x="1334" y="808" width="26" height="56" rx="10" fill="#2e241a"/>
  </g>

  <!-- ============ FATHER : bulky, stern, arm around mother ============ -->
  <g transform="translate(650,0)">
    <!-- legs -->
    <rect x="-78" y="700" width="58" height="164" rx="24" fill="#4e5a66"/>
    <rect x="18" y="700" width="58" height="164" rx="24" fill="#57636f"/>
    <ellipse cx="-49" cy="866" rx="42" ry="18" fill="#2c353d"/>
    <ellipse cx="47" cy="866" rx="42" ry="18" fill="#2c353d"/>
    <!-- left arm -->
    <path d="M-84 528 Q-118 600 -112 686" stroke="#5c6a76" stroke-width="48" fill="none" stroke-linecap="round"/>
    <circle cx="-112" cy="694" r="27" fill="#6f7d8a"/>
    <!-- torso -->
    <rect x="-102" y="486" width="204" height="216" rx="32" fill="url(#dadBody)"/>
    <rect x="-70" y="520" width="140" height="16" rx="8" fill="#3c4650" opacity="0.6"/>
    <rect x="-70" y="556" width="140" height="16" rx="8" fill="#3c4650" opacity="0.6"/>
    <circle cx="0" cy="620" r="20" fill="url(#brass)"/>
    <circle cx="0" cy="620" r="8" fill="#3c4650"/>
    <rect x="-30" y="486" width="60" height="26" rx="12" fill="#4e5a66"/>
    <!-- head -->
    <rect x="-80" y="348" width="160" height="152" rx="24" fill="url(#dadBody)"/>
    <rect x="-112" y="392" width="22" height="70" rx="10" fill="#57636f"/>
    <rect x="90" y="392" width="22" height="70" rx="10" fill="#57636f"/>
    <rect x="-64" y="392" width="128" height="46" rx="12" fill="#1d262c"/>
    <rect x="-46" y="410" width="92" height="13" rx="6" fill="#ffb43d" filter="url(#glowS)"/>
    <!-- stern brow -->
    <path d="M-66 392 L-6 400 L-6 388 L-66 382 Z" fill="#3c4650"/>
    <path d="M66 392 L6 400 L6 388 L66 382 Z" fill="#3c4650"/>
    <!-- mustache vent -->
    <rect x="-38" y="450" width="76" height="15" rx="7" fill="#3c4650"/>
    <circle cx="-38" cy="457" r="9" fill="#3c4650"/>
    <circle cx="38" cy="457" r="9" fill="#3c4650"/>
    <rect x="-12" y="322" width="24" height="28" rx="6" fill="url(#brass)"/>
    <circle cx="0" cy="322" r="12" fill="url(#brass)"/>
    <!-- blinking eyelid -->
    <rect x="-46" y="410" width="92" height="13" rx="6" fill="#6f7d8a" opacity="0">
      <animate attributeName="height" values="0;0;13;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ============ MOTHER : poised, leaning away, watching toddler ============ -->
  <g transform="translate(915,0)">
    <g transform="rotate(-6 0 690)">
      <!-- skirt -->
      <path d="M-72 676 L72 676 L104 862 L-104 862 Z" fill="url(#momBody)"/>
      <path d="M-72 676 L-104 862 L-40 862 L-30 676 Z" fill="#d8d0c1" opacity="0.5"/>
      <ellipse cx="-52" cy="866" rx="30" ry="14" fill="#b9b0a0"/>
      <ellipse cx="52" cy="866" rx="30" ry="14" fill="#b9b0a0"/>
      <!-- torso -->
      <path d="M-54 500 C-48 590 -46 676 -46 676 L46 676 C46 676 48 590 54 500 Z" fill="url(#momBody)"/>
      <path d="M-41 560 Q0 596 41 560 L41 600 Q0 632 -41 600 Z" fill="#d98c7a" opacity="0.85"/>
      <circle cx="0" cy="540" r="9" fill="#d98c7a"/>
      <!-- arms -->
      <path d="M-50 520 Q-78 580 -92 648" stroke="#e6e0d4" stroke-width="34" fill="none" stroke-linecap="round"/>
      <circle cx="-92" cy="654" r="19" fill="#f2eee6"/>
      <path d="M50 520 Q72 600 68 676" stroke="#e6e0d4" stroke-width="34" fill="none" stroke-linecap="round"/>
      <circle cx="68" cy="682" r="19" fill="#f2eee6"/>
      <!-- neck + head -->
      <rect x="-16" y="472" width="32" height="36" rx="10" fill="#cfc7ba"/>
      <ellipse cx="0" cy="422" rx="59" ry="72" fill="url(#momBody)"/>
      <ellipse cx="0" cy="422" rx="59" ry="72" fill="none" stroke="#c6bdae" stroke-width="2"/>
      <!-- eyes -->
      <ellipse cx="-22" cy="414" rx="15" ry="18" fill="#12262e"/>
      <ellipse cx="22" cy="414" rx="15" ry="18" fill="#12262e"/>
      <circle cx="-24" cy="410" r="6" fill="#5fe6e0" filter="url(#glowS)"/>
      <circle cx="20" cy="410" r="6" fill="#5fe6e0" filter="url(#glowS)"/>
      <path d="M-40 396 Q-22 384 -6 396" stroke="#b9b0a0" stroke-width="4" fill="none"/>
      <path d="M40 396 Q22 384 6 396" stroke="#b9b0a0" stroke-width="4" fill="none"/>
      <!-- mouth : small worried frown -->
      <path d="M-14 460 Q0 452 14 460" stroke="#b06a5c" stroke-width="4" fill="none"/>
      <circle cx="-48" cy="432" r="7" fill="#d98c7a" opacity="0.45"/>
      <circle cx="48" cy="432" r="7" fill="#d98c7a" opacity="0.45"/>
      <!-- antenna with bob -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-4 0 356;4 0 356;-4 0 356" dur="4s" repeatCount="indefinite"/>
        <path d="M0 356 Q4 320 12 300" stroke="#c6bdae" stroke-width="5" fill="none"/>
        <circle cx="13" cy="296" r="10" fill="#d98c7a" filter="url(#glowS)"/>
      </g>
    </g>
  </g>

  <!-- ============ FATHER'S ARM OVER MOTHER'S SHOULDER (on top) ============ -->
  <g>
    <path d="M735 512 Q830 438 972 500" stroke="#5c6a76" stroke-width="46" fill="none" stroke-linecap="round"/>
    <circle cx="976" cy="504" r="26" fill="#6f7d8a"/>
  </g>

  <!-- ============ TODDLER : hyper, reaching for mother ============ -->
  <g transform="translate(800,0)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.6s" repeatCount="indefinite"/>
      <!-- legs -->
      <rect x="-26" y="644" width="22" height="52" rx="9" fill="#c9935d"/>
      <rect x="6" y="644" width="22" height="52" rx="9" fill="#d8a56c"/>
      <ellipse cx="-15" cy="696" rx="18" ry="9" fill="#a87844"/>
      <ellipse cx="17" cy="696" rx="18" ry="9" fill="#a87844"/>
      <!-- body -->
      <rect x="-32" y="566" width="64" height="90" rx="22" fill="url(#totBody)"/>
      <rect x="-18" y="592" width="36" height="10" rx="5" fill="#a87844" opacity="0.6"/>
      <!-- arms -->
      <path d="M-28 586 Q-54 578 -66 546" stroke="#e3b98a" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M28 586 Q56 560 66 522" stroke="#e3b98a" stroke-width="20" fill="none" stroke-linecap="round"/>
      <circle cx="-68" cy="540" r="12" fill="#f0c795"/>
      <circle cx="68" cy="516" r="12" fill="#f0c795"/>
      <!-- head -->
      <ellipse cx="0" cy="512" rx="50" ry="46" fill="url(#totBody)"/>
      <rect x="-12" y="548" width="24" height="24" rx="8" fill="#d8a56c"/>
      <!-- mismatched eyes -->
      <circle cx="-19" cy="506" r="15" fill="#12262e"/>
      <circle cx="-19" cy="506" r="8" fill="#ffe063" filter="url(#glowS)"/>
      <circle cx="20" cy="510" r="10" fill="#12262e"/>
      <circle cx="20" cy="510" r="5" fill="#ffe063" filter="url(#glowS)"/>
      <!-- open happy mouth -->
      <path d="M-12 528 Q0 542 12 528 Z" fill="#7a3b2e"/>
      <!-- single curly antenna -->
      <path d="M0 466 Q6 448 22 444 Q36 440 34 452" stroke="#a87844" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="34" cy="452" r="6" fill="#ffe063" filter="url(#glowS)"/>
    </g>
  </g>

  <!-- ============ TEEN : slumped, headphones, phone ============ -->
  <g transform="translate(1150,0)">
    <g transform="rotate(-4 0 690)">
      <!-- sprawled legs -->
      <path d="M-34 690 L-86 850" stroke="#232329" stroke-width="52" fill="none" stroke-linecap="round"/>
      <path d="M34 690 L104 846" stroke="#2b2b32" stroke-width="52" fill="none" stroke-linecap="round"/>
      <ellipse cx="-92" cy="856" rx="36" ry="16" fill="#151519"/>
      <ellipse cx="110" cy="852" rx="36" ry="16" fill="#151519"/>
      <!-- torso -->
      <rect x="-76" y="470" width="152" height="234" rx="34" fill="url(#teenBody)"/>
      <path d="M-30 470 Q0 520 30 470" stroke="#4a4a56" stroke-width="6" fill="none" opacity="0.7"/>
      <rect x="-52" y="560" width="104" height="80" rx="20" fill="#25252c"/>
      <!-- crossed arms -->
      <path d="M-66 508 Q0 566 60 560" stroke="#3a3a44" stroke-width="40" fill="none" stroke-linecap="round"/>
      <path d="M66 500 Q6 552 -44 572" stroke="#2f2f38" stroke-width="40" fill="none" stroke-linecap="round"/>
      <!-- phone in hand, screen glow -->
      <g transform="translate(40,556) rotate(-18)">
        <rect x="-24" y="-40" width="48" height="72" rx="8" fill="#0c0c10" stroke="#4a4a56" stroke-width="3"/>
        <rect x="-19" y="-35" width="38" height="62" rx="5" fill="#7CFC6A">
          <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="-19" y="-35" width="38" height="62" rx="5" fill="#7CFC6A" filter="url(#glowS)" opacity="0.8">
          <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
        </rect>
      </g>
      <!-- neck + head tilted down -->
      <rect x="-18" y="452" width="36" height="34" rx="12" fill="#232329"/>
      <g transform="rotate(12 0 400)">
        <rect x="-60" y="336" width="120" height="128" rx="26" fill="url(#teenBody)"/>
        <!-- visor / downcast eyes -->
        <rect x="-48" y="392" width="96" height="26" rx="10" fill="#0c0c10"/>
        <rect x="-38" y="400" width="30" height="9" rx="4" fill="#7CFC6A" filter="url(#glowS)"/>
        <rect x="6" y="400" width="30" height="9" rx="4" fill="#7CFC6A" filter="url(#glowS)"/>
        <!-- grumpy mouth -->
        <path d="M-16 440 Q0 432 16 440" stroke="#4a4a56" stroke-width="4" fill="none"/>
        <!-- spiky antennae -->
        <path d="M-40 336 L-56 306 M0 332 L0 298 M40 336 L56 306" stroke="#4a4a56" stroke-width="6" stroke-linecap="round" fill="none"/>
        <circle cx="0" cy="296" r="6" fill="#7CFC6A" filter="url(#glowS)">
          <animate attributeName="opacity" values="1;0.4;1" dur="1.3s" repeatCount="indefinite"/>
        </circle>
        <!-- headphones -->
        <path d="M-64 382 Q-74 320 0 312 Q74 320 64 382" stroke="#151519" stroke-width="14" fill="none"/>
        <ellipse cx="-66" cy="398" rx="18" ry="26" fill="#151519" stroke="#4a4a56" stroke-width="4"/>
        <ellipse cx="66" cy="398" rx="18" ry="26" fill="#151519" stroke="#4a4a56" stroke-width="4"/>
      </g>
    </g>
  </g>

  <!-- ============ GRANDMOTHER : patina, monocle, cane, unimpressed ============ -->
  <g transform="translate(255,0)">
    <g transform="rotate(6 0 700)">
      <path d="M-74 612 Q0 560 74 612 L86 706 Q0 672 -86 706 Z" fill="url(#granBody)"/>
      <path d="M-86 706 Q0 672 86 706 L86 726 Q0 694 -86 726 Z" fill="#3f5a4b" opacity="0.6"/>
      <rect x="-64" y="600" width="128" height="112" rx="28" fill="#5f7d6b"/>
      <!-- hands folded -->
      <ellipse cx="-22" cy="700" rx="24" ry="18" fill="#8fae98"/>
      <ellipse cx="22" cy="700" rx="24" ry="18" fill="#8fae98"/>
      <!-- head -->
      <ellipse cx="-4" cy="552" rx="56" ry="54" fill="#8fae98"/>
      <path d="M-60 540 Q-4 508 52 540" stroke="#c8c0b0" stroke-width="6" fill="none"/>
      <!-- eye: one wide, one squint -->
      <circle cx="-26" cy="548" r="11" fill="#12262e"/>
      <circle cx="-26" cy="548" r="5" fill="#8fe0d0" filter="url(#glowS)"/>
      <path d="M12 548 L34 548" stroke="#12262e" stroke-width="6" stroke-linecap="round"/>
      <!-- monocle + chain -->
      <circle cx="-26" cy="548" r="21" fill="none" stroke="url(#brass)" stroke-width="4"/>
      <path d="M-6 560 Q30 600 40 660" stroke="url(#brass)" stroke-width="3" fill="none"/>
      <!-- grumpy mouth -->
      <path d="M-20 584 Q-4 576 14 586" stroke="#3f5a4b" stroke-width="5" fill="none"/>
      <!-- hair bun / antenna -->
      <circle cx="-30" cy="500" r="16" fill="#c8c0b0"/>
      <path d="M-4 500 Q30 496 44 470" stroke="#c8c0b0" stroke-width="5" fill="none"/>
      <circle cx="46" cy="466" r="7" fill="url(#brass)" filter="url(#glowS)"/>
    </g>
    <!-- cane leaning on chair -->
    <path d="M118 690 Q150 660 156 716 L142 862" stroke="#6d4b28" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M150 686 Q134 664 118 690" stroke="url(#brass)" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ============ PET ROBOT DOG ============ -->
  <g transform="translate(1400,872)">
    <ellipse cx="0" cy="34" rx="60" ry="14" fill="#000" opacity="0.4"/>
    <rect x="-42" y="14" width="18" height="34" rx="8" fill="#9aa4ad"/>
    <rect x="24" y="14" width="18" height="34" rx="8" fill="#9aa4ad"/>
    <ellipse cx="0" cy="0" rx="62" ry="36" fill="#b7c0c8"/>
    <ellipse cx="0" cy="6" rx="46" ry="24" fill="#a3adb6"/>
    <!-- tail -->
    <g transform="translate(56,-8)">
      <animateTransform attributeName="transform" type="rotate" values="-12 0 0;18 0 0;-12 0 0" dur="0.45s" repeatCount="indefinite" additive="sum"/>
      <path d="M0 0 Q26 -18 40 -2" stroke="#9aa4ad" stroke-width="10" fill="none" stroke-linecap="round"/>
    </g>
    <!-- collar -->
    <rect x="-58" y="-16" width="14" height="26" rx="6" fill="#b23b3b"/>
    <circle cx="-51" cy="12" r="6" fill="url(#brass)"/>
    <!-- head -->
    <circle cx="-52" cy="-20" r="34" fill="#c3ccd3"/>
    <!-- floppy ears -->
    <path d="M-80 -38 Q-104 -30 -100 4 Q-96 26 -74 20 Q-66 -6 -74 -34 Z" fill="#8a949c"/>
    <path d="M-26 -38 Q-2 -30 -6 4 Q-10 26 -32 20 Q-40 -6 -32 -34 Z" fill="#8a949c"/>
    <!-- snout -->
    <ellipse cx="-66" cy="-8" rx="20" ry="15" fill="#e6e0d4"/>
    <ellipse cx="-70" cy="-26" rx="11" ry="9" fill="#12262e"/>
    <circle cx="-70" cy="-26" r="5" fill="#5fe6e0" filter="url(#glowS)"/>
    <circle cx="-84" cy="-8" r="7" fill="#3c4650"/>
  </g>

  <!-- ============ FOREGROUND VIGNETTE & GRAIN ============ -->
  <rect width="1600" height="1000" fill="none" stroke="#000" stroke-width="90" opacity="0.28"/>
  <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.5"/>
</svg>
