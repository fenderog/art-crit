<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Room -->
  <rect width="800" height="600" fill="#f4e9d8"/>
  <rect y="470" width="800" height="50" fill="#d8c7a8"/>
  <rect y="520" width="800" height="80" fill="#b9a58a"/>

  <!-- Crooked picture frame, nobody noticed -->
  <g transform="rotate(5 600 105)">
    <rect x="540" y="60" width="120" height="90" fill="#cfe3f0" stroke="#6b4f2a" stroke-width="8"/>
    <circle cx="600" cy="95" r="16" fill="#f2c94c"/>
    <path d="M550 140 L590 110 L610 130 L640 105 L650 140 Z" fill="#8fbf7a"/>
  </g>

  <!-- Floor shadows -->
  <g fill="#000" opacity="0.15">
    <ellipse cx="170" cy="522" rx="62" ry="8"/>
    <ellipse cx="330" cy="522" rx="90" ry="9"/>
    <ellipse cx="505" cy="522" rx="60" ry="8"/>
    <ellipse cx="640" cy="522" rx="62" ry="8"/>
    <ellipse cx="395" cy="515" rx="40" ry="6"/>
  </g>

  <!-- Camera on a tripod, timer blinking, photographer absent -->
  <g stroke="#333" stroke-width="5" stroke-linecap="round">
    <line x1="65" y1="470" x2="40" y2="520"/>
    <line x1="65" y1="470" x2="90" y2="520"/>
    <line x1="65" y1="470" x2="65" y2="525"/>
  </g>
  <rect x="40" y="440" width="50" height="30" rx="4" fill="#333"/>
  <circle cx="40" cy="455" r="10" fill="#6fa8dc" stroke="#111" stroke-width="3"/>
  <circle cx="82" cy="446" r="4" fill="#e53935"/>

  <!-- Grandpa robot: tilted, drooping antenna, cane, glasses, one arm on cane -->
  <g transform="rotate(-6 170 400)">
    <rect x="150" y="420" width="18" height="100" rx="6" fill="#55616b"/>
    <rect x="172" y="420" width="18" height="100" rx="6" fill="#55616b"/>
    <rect x="120" y="280" width="100" height="150" rx="40" fill="#b8c4cc"/>
    <rect x="125" y="190" width="90" height="95" rx="30" fill="#d9d0b8"/>
    <line x1="170" y1="192" x2="160" y2="160" stroke="#555" stroke-width="4"/>
    <circle cx="157" cy="156" r="6" fill="#aaa" transform="rotate(30 157 156)"/>
    <g fill="none" stroke="#333" stroke-width="3">
      <circle cx="147" cy="230" r="13"/>
      <circle cx="193" cy="230" r="13"/>
      <line x1="160" y1="230" x2="180" y2="230"/>
    </g>
    <circle cx="147" cy="230" r="4" fill="#333"/>
    <circle cx="193" cy="230" r="4" fill="#333"/>
    <path d="M150 258 Q170 262 190 258" fill="none" stroke="#333" stroke-width="3"/>
    <line x1="125" y1="320" x2="108" y2="365" stroke="#777" stroke-width="12" stroke-linecap="round"/>
    <line x1="215" y1="320" x2="240" y2="360" stroke="#777" stroke-width="12" stroke-linecap="round"/>
    <line x1="106" y1="300" x2="96" y2="520" stroke="#6b4f2a" stroke-width="8" stroke-linecap="round"/>
    <path d="M96 300 Q86 288 98 284" fill="none" stroke="#6b4f2a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Dad robot: huge, boxy, one arm stuck out at Grandpa, one arm dangling -->
  <g>
    <rect x="290" y="400" width="30" height="120" rx="6" fill="#4a6fa5"/>
    <rect x="340" y="400" width="30" height="120" rx="6" fill="#4a6fa5"/>
    <rect x="255" y="230" width="160" height="180" rx="12" fill="#e07a3f"/>
    <polygon points="330,240 322,262 330,312 338,262" fill="#333"/>
    <rect x="270" y="130" width="120" height="105" rx="10" fill="#f0b27a"/>
    <path d="M330 132 L345 100 L335 84" fill="none" stroke="#555" stroke-width="4"/>
    <circle cx="335" cy="80" r="7" fill="#e53935"/>
    <circle cx="298" cy="170" r="12" fill="#fff" stroke="#333" stroke-width="3"/>
    <circle cx="302" cy="172" r="5" fill="#333"/>
    <circle cx="346" cy="170" r="9" fill="#fff" stroke="#333" stroke-width="3"/>
    <circle cx="342" cy="172" r="4" fill="#333"/>
    <line x1="296" y1="204" x2="364" y2="203" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <!-- arm stuck straight out, touching Grandpa's ear -->
    <line x1="255" y1="262" x2="218" y2="262" stroke="#c4612b" stroke-width="16" stroke-linecap="round"/>
    <!-- arm dropped awkwardly toward Mom -->
    <path d="M415 262 Q450 300 462 300" fill="none" stroke="#c4612b" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Mom robot: tall, slim, one eyebrow up, bun, stiff arm at side -->
  <g>
    <rect x="480" y="420" width="14" height="100" rx="6" fill="#3c7f77"/>
    <rect x="502" y="420" width="14" height="100" rx="6" fill="#3c7f77"/>
    <rect x="460" y="220" width="90" height="200" rx="40" fill="#8fd3c7"/>
    <line x1="462" y1="262" x2="438" y2="330" stroke="#5aa89c" stroke-width="14" stroke-linecap="round"/>
    <line x1="548" y1="262" x2="560" y2="330" stroke="#5aa89c" stroke-width="14" stroke-linecap="round"/>
    <circle cx="450" cy="335" r="9" fill="#bfe9e1"/>
    <g transform="rotate(-12 505 165)">
      <circle cx="505" cy="115" r="18" fill="#555"/>
      <ellipse cx="505" cy="165" rx="40" ry="50" fill="#bfe9e1"/>
      <circle cx="490" cy="165" r="6" fill="#333"/>
      <circle cx="520" cy="163" r="6" fill="#333"/>
      <path d="M480 148 L498 152" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <path d="M512 142 L530 130" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <path d="M494 192 L516 192" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M478 250 L490 258" stroke="#e53935" stroke-width="0"/>
    <path d="M522 245 l8 -8 l8 8 l-8 10 z" fill="#e53935"/>
  </g>

  <!-- Teen robot: slouched, headphones, hands in pockets, looking sideways -->
  <g transform="rotate(8 620 420)">
    <rect x="610" y="400" width="16" height="120" rx="6" fill="#333"/>
    <rect x="632" y="400" width="16" height="120" rx="6" fill="#333"/>
    <rect x="590" y="270" width="90" height="150" rx="20" fill="#9b6bd6"/>
    <line x1="598" y1="290" x2="596" y2="345" stroke="#7a4fb8" stroke-width="12" stroke-linecap="round"/>
    <line x1="672" y1="290" x2="676" y2="345" stroke="#7a4fb8" stroke-width="12" stroke-linecap="round"/>
    <rect x="600" y="338" width="30" height="16" rx="4" fill="#7a4fb8"/>
    <rect x="650" y="338" width="30" height="16" rx="4" fill="#7a4fb8"/>
    <circle cx="640" cy="235" r="42" fill="#c9b5ea"/>
    <path d="M598 230 Q640 168 682 230" fill="none" stroke="#222" stroke-width="8"/>
    <rect x="590" y="218" width="14" height="26" rx="5" fill="#222"/>
    <rect x="676" y="218" width="14" height="26" rx="5" fill="#222"/>
    <line x1="622" y1="234" x2="638" y2="232" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="650" y1="232" x2="666" y2="234" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <path d="M628 256 Q640 252 656 256" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Toddler robot: wobbly, mismatched eyes, arms up, holding a balloon -->
  <g transform="rotate(-10 395 480)">
    <rect x="375" y="500" width="14" height="22" rx="5" fill="#d6a900"/>
    <rect x="400" y="500" width="14" height="22" rx="5" fill="#d6a900"/>
    <rect x="370" y="440" width="50" height="62" rx="18" fill="#ffd23f"/>
    <line x1="372" y1="452" x2="345" y2="412" stroke="#e0b52e" stroke-width="8" stroke-linecap="round"/>
    <line x1="418" y1="452" x2="440" y2="410" stroke="#e0b52e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="395" cy="412" r="34" fill="#ffe27a"/>
    <line x1="395" y1="378" x2="395" y2="366" stroke="#555" stroke-width="3"/>
    <circle cx="395" cy="363" r="5" fill="#e53935"/>
    <circle cx="383" cy="406" r="9" fill="#333"/>
    <circle cx="408" cy="403" r="14" fill="#333"/>
    <ellipse cx="395" cy="429" rx="8" ry="6" fill="#333"/>
  </g>
  <!-- Balloon, not held by anyone who is looking at it -->
  <line x1="440" y1="410" x2="458" y2="372" stroke="#777" stroke-width="2"/>
  <ellipse cx="462" cy="352" rx="22" ry="26" fill="#e53935"/>
</svg>
