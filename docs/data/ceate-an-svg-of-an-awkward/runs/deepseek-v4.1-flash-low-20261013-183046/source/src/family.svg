<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ecda"/>
      <stop offset="0.6" stop-color="#efdcc0"/>
      <stop offset="1" stop-color="#e2caa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#fffaf0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#c9a878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07a4d"/>
      <stop offset="1" stop-color="#7a5230"/>
    </linearGradient>
    <radialGradient id="rug" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9c6a44"/>
      <stop offset="1" stop-color="#7a5230"/>
    </radialGradient>
    <linearGradient id="dadBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d92bb"/>
      <stop offset="1" stop-color="#34506f"/>
    </linearGradient>
    <linearGradient id="dadDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5875"/>
      <stop offset="1" stop-color="#22374c"/>
    </linearGradient>
    <linearGradient id="momBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf4"/>
      <stop offset="1" stop-color="#d6c6b2"/>
    </linearGradient>
    <linearGradient id="momTrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b184"/>
      <stop offset="1" stop-color="#b56f3f"/>
    </linearGradient>
    <linearGradient id="teenBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a505c"/>
      <stop offset="1" stop-color="#20232a"/>
    </linearGradient>
    <linearGradient id="kidBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdd6b"/>
      <stop offset="1" stop-color="#e0a11f"/>
    </linearGradient>
    <linearGradient id="petBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ea9f68"/>
      <stop offset="1" stop-color="#a85c2e"/>
    </linearGradient>
    <linearGradient id="babyBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9efd9"/>
      <stop offset="1" stop-color="#6fc3a2"/>
    </linearGradient>
    <linearGradient id="frameGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c583"/>
      <stop offset="1" stop-color="#a97a3c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f2"/>
      <stop offset="1" stop-color="#f3e2c0"/>
    </linearGradient>
    <linearGradient id="eyeAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="eyeGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="stripes" width="80" height="800" patternUnits="userSpaceOnUse">
      <rect x="37" width="4" height="800" fill="#c6a679" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect width="1200" height="800" fill="url(#stripes)"/>
  <ellipse cx="600" cy="360" rx="580" ry="440" fill="url(#glow)"/>

  <!-- wall border -->
  <rect x="0" y="0" width="1200" height="18" fill="#c9a878"/>
  <rect x="0" y="18" width="1200" height="5" fill="#a4835a"/>

  <!-- hanging portrait frame -->
  <g>
    <ellipse cx="600" cy="242" rx="180" ry="14" fill="#7a5a38" opacity="0.18" filter="url(#soft)"/>
    <rect x="452" y="52" width="296" height="182" rx="6" fill="url(#frameGold)"/>
    <rect x="466" y="66" width="268" height="154" rx="3" fill="url(#sky)"/>
    <circle cx="678" cy="102" r="20" fill="#ffe9a8"/>
    <path d="M466 190 L540 120 L600 176 L662 116 L734 190 Z" fill="#8fae86"/>
    <path d="M466 220 L560 150 L650 220 Z" fill="#5f8261"/>
    <rect x="466" y="196" width="268" height="24" fill="#d8c8a0"/>
    <rect x="452" y="52" width="296" height="182" rx="6" fill="none" stroke="#8a5f2c" stroke-width="4"/>
  </g>

  <!-- floor -->
  <rect x="0" y="700" width="1200" height="100" fill="url(#floor)"/>
  <rect x="0" y="694" width="1200" height="8" fill="#5c3d22"/>
  <ellipse cx="640" cy="724" rx="540" ry="66" fill="url(#rug)" opacity="0.85"/>
  <ellipse cx="640" cy="724" rx="540" ry="66" fill="none" stroke="#8a5f3a" stroke-width="4" opacity="0.6"/>

  <!-- ===== GROUND SHADOWS ===== -->
  <g fill="#2a1c0e" opacity="0.22" filter="url(#soft)">
    <ellipse cx="210" cy="702" rx="60" ry="12"/>
    <ellipse cx="400" cy="706" rx="140" ry="16"/>
    <ellipse cx="612" cy="706" rx="120" ry="15"/>
    <ellipse cx="822" cy="706" rx="105" ry="14"/>
    <ellipse cx="522" cy="704" rx="70" ry="11"/>
  </g>

  <!-- ========================================================= -->
  <!-- ===== PET ROBOT (copper dog, turned away, cone) ===== -->
  <!-- ========================================================= -->
  <g>
    <ellipse cx="206" cy="688" rx="52" ry="10" fill="#000" opacity="0.18"/>
    <!-- body -->
    <ellipse cx="206" cy="652" rx="50" ry="36" fill="url(#petBody)"/>
    <rect x="170" y="676" width="16" height="18" rx="6" fill="#8a4a24"/>
    <rect x="222" y="676" width="16" height="18" rx="6" fill="#8a4a24"/>
    <!-- tail -->
    <path d="M 158 640 q -26 -20 -14 -48" stroke="#c17a44" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="250" cy="614" r="30" fill="url(#petBody)"/>
    <path d="M 232 592 q -14 -26 4 -30 q 12 12 14 24 Z" fill="#8a4a24"/>
    <path d="M 268 590 q 16 -18 6 -28 q -16 6 -22 20 Z" fill="#8a4a24"/>
    <!-- cone of shame -->
    <path d="M 224 626 L 286 600 L 276 660 L 238 668 Z" fill="#f4f1ea" opacity="0.92" stroke="#cfc6b6" stroke-width="3"/>
    <path d="M 224 626 L 238 668" stroke="#d8cfbf" stroke-width="3"/>
    <path d="M 250 616 L 258 664" stroke="#d8cfbf" stroke-width="3"/>
    <!-- snout + eye, looking right/away -->
    <rect x="262" y="620" width="24" height="16" rx="7" fill="#8a4a24"/>
    <circle cx="270" cy="606" r="5" fill="#63e8ff" filter="url(#eyeGlow)"/>
  </g>

  <!-- ========================================================= -->
  <!-- ===== FATHER (bulky, stern, arm around mom) ===== -->
  <!-- ========================================================= -->
  <!-- far reach arm (behind mother) -->
  <path d="M 482 420 Q 560 424 636 408" stroke="#22374c" stroke-width="34" fill="none" stroke-linecap="round"/>
  <g>
    <!-- legs -->
    <rect x="338" y="560" width="46" height="140" rx="12" fill="url(#dadDark)"/>
    <rect x="416" y="560" width="46" height="140" rx="12" fill="url(#dadDark)"/>
    <rect x="324" y="682" width="74" height="22" rx="10" fill="#1b2836"/>
    <rect x="404" y="682" width="74" height="22" rx="10" fill="#1b2836"/>
    <!-- torso -->
    <path d="M 305 570 Q 300 468 330 400 Q 400 372 470 400 Q 500 468 495 570 Q 400 594 305 570 Z" fill="url(#dadBody)"/>
    <rect x="345" y="414" width="110" height="98" rx="16" fill="#7ba0c8"/>
    <rect x="358" y="428" width="84" height="70" rx="10" fill="#5b7fa8"/>
    <circle cx="400" cy="462" r="19" fill="url(#eyeAmber)" filter="url(#eyeGlow)"/>
    <path d="M 330 520 L 470 520" stroke="#2b4560" stroke-width="4" opacity="0.6"/>
    <!-- rivets -->
    <circle cx="322" cy="545" r="5" fill="#8fb0d4"/><circle cx="478" cy="545" r="5" fill="#8fb0d4"/>
    <!-- shoulders -->
    <circle cx="318" cy="420" r="34" fill="url(#dadDark)"/>
    <circle cx="482" cy="420" r="34" fill="url(#dadDark)"/>
    <!-- far hanging arm -->
    <path d="M 318 420 Q 272 462 278 540" stroke="#22374c" stroke-width="34" fill="none" stroke-linecap="round"/>
    <circle cx="278" cy="544" r="21" fill="#3d5875"/>
    <!-- neck + head -->
    <rect x="378" y="358" width="44" height="30" rx="6" fill="#2b3542"/>
    <rect x="328" y="268" width="144" height="98" rx="24" fill="url(#dadBody)"/>
    <rect x="328" y="268" width="144" height="30" rx="18" fill="#6d92bb" opacity="0.5"/>
    <rect x="342" y="284" width="116" height="66" rx="16" fill="#16202c"/>
    <rect x="356" y="306" width="30" height="16" rx="7" fill="url(#eyeAmber)" filter="url(#eyeGlow)"/>
    <rect x="414" y="306" width="30" height="16" rx="7" fill="url(#eyeAmber)" filter="url(#eyeGlow)"/>
    <path d="M 352 296 L 388 306" stroke="#ffb347" stroke-width="5" stroke-linecap="round"/>
    <path d="M 448 296 L 412 306" stroke="#ffb347" stroke-width="5" stroke-linecap="round"/>
    <path d="M 378 336 Q 400 326 422 336" stroke="#8fa8c4" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- antenna -->
    <line x1="400" y1="270" x2="400" y2="240" stroke="#34506f" stroke-width="6"/>
    <circle cx="400" cy="234" r="9" fill="#ff6b6b"/>
    <!-- bow tie -->
    <path d="M 400 372 l -28 -13 v 26 z" fill="#ff6b6b"/>
    <path d="M 400 372 l 28 -13 v 26 z" fill="#ff6b6b"/>
    <circle cx="400" cy="372" r="8" fill="#c94a4a"/>
  </g>

  <!-- ========================================================= -->
  <!-- ===== MOTHER (elegant, aloof, leaning away) ===== -->
  <!-- ========================================================= -->
  <g transform="rotate(4 610 700)">
    <!-- far hanging arm -->
    <path d="M 584 424 Q 552 476 560 540" stroke="#d3c3ae" stroke-width="24" fill="none" stroke-linecap="round"/>
    <circle cx="560" cy="544" r="17" fill="#e6d8c6"/>
    <!-- skirt -->
    <path d="M 538 700 L 572 538 L 648 538 L 682 700 Z" fill="url(#momBody)"/>
    <path d="M 560 700 L 588 540" stroke="#cdbca6" stroke-width="3" opacity="0.7"/>
    <path d="M 660 700 L 632 540" stroke="#cdbca6" stroke-width="3" opacity="0.7"/>
    <path d="M 610 700 L 610 540" stroke="#cdbca6" stroke-width="3" opacity="0.7"/>
    <!-- torso -->
    <path d="M 578 545 Q 572 470 590 415 Q 610 398 630 415 Q 648 470 642 545 Q 610 562 578 545 Z" fill="url(#momBody)"/>
    <rect x="588" y="432" width="44" height="72" rx="12" fill="#e4d6c4"/>
    <rect x="598" y="444" width="24" height="46" rx="6" fill="#cbb8a1"/>
    <rect x="576" y="532" width="68" height="14" rx="7" fill="url(#momTrim)"/>
    <!-- pearl necklace -->
    <g fill="#fffef8" stroke="#c9b8a3" stroke-width="1">
      <circle cx="586" cy="440" r="5"/><circle cx="596" cy="448" r="5"/>
      <circle cx="608" cy="451" r="5"/><circle cx="620" cy="448" r="5"/>
      <circle cx="630" cy="440" r="5"/>
    </g>
    <!-- shoulders -->
    <circle cx="584" cy="424" r="24" fill="#efe3d3"/>
    <circle cx="636" cy="424" r="24" fill="#efe3d3"/>
    <!-- neck -->
    <rect x="600" y="368" width="20" height="34" rx="6" fill="#d8c9b5"/>
    <!-- rose-gold bob behind the head -->
    <ellipse cx="610" cy="312" rx="62" ry="70" fill="#d9a06d"/>
    <path d="M 552 322 q -12 -86 58 -94 q 70 8 58 94 q -10 -46 -58 -52 q -48 6 -58 52 Z" fill="#e8b184"/>
    <!-- head -->
    <ellipse cx="610" cy="316" rx="52" ry="60" fill="url(#momBody)"/>
    <ellipse cx="610" cy="322" rx="40" ry="45" fill="#2a2630"/>
    <!-- eyes looking away to the right -->
    <ellipse cx="596" cy="314" rx="11" ry="9" fill="#63e8ff" filter="url(#eyeGlow)"/>
    <ellipse cx="632" cy="314" rx="11" ry="9" fill="#63e8ff" filter="url(#eyeGlow)"/>
    <circle cx="600" cy="315" r="4" fill="#0a2a33"/>
    <circle cx="636" cy="315" r="4" fill="#0a2a33"/>
    <path d="M 584 306 q 12 -8 24 -2" stroke="#2a2630" stroke-width="3" fill="none"/>
    <path d="M 654 308 q -10 -8 -20 -4" stroke="#2a2630" stroke-width="3" fill="none"/>
    <!-- reserved little smile -->
    <path d="M 600 342 q 10 5 20 0" stroke="#ff9aa2" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- swept side strand -->
    <path d="M 560 300 q -26 -6 -34 -34" stroke="#c98d59" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- bun + antenna -->
    <circle cx="610" cy="258" r="22" fill="#e0a878"/>
    <circle cx="610" cy="258" r="22" fill="none" stroke="#b56f3f" stroke-width="3"/>
    <line x1="610" y1="238" x2="610" y2="216" stroke="#b56f3f" stroke-width="5"/>
    <circle cx="610" cy="210" r="8" fill="#ffd24a"/>
  </g>

  <!-- ===== BABY (held awkwardly) ===== -->
  <g>
    <!-- swaddle -->
    <path d="M 662 470 q 38 -34 82 0 q 10 62 -42 70 q -50 -8 -40 -70 Z" fill="url(#babyBody)"/>
    <path d="M 662 470 q 44 26 82 0" stroke="#5aa98a" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- kicking legs -->
    <rect x="676" y="532" width="14" height="26" rx="6" fill="#8fd9bd" transform="rotate(-18 683 532)"/>
    <rect x="712" y="532" width="14" height="26" rx="6" fill="#8fd9bd" transform="rotate(16 719 532)"/>
    <!-- head -->
    <circle cx="704" cy="452" r="31" fill="#c9f0e0"/>
    <circle cx="704" cy="454" r="22" fill="#2a2630"/>
    <circle cx="704" cy="452" r="10" fill="#63e8ff" filter="url(#eyeGlow)"/>
    <circle cx="708" cy="449" r="3" fill="#eafcff"/>
    <circle cx="704" cy="474" r="7" fill="#ff9aa2"/>
    <line x1="704" y1="423" x2="704" y2="408" stroke="#5aa98a" stroke-width="4"/>
    <circle cx="704" cy="404" r="5" fill="#ffd24a"/>
  </g>
  <!-- mother cradling forearm over baby -->
  <path d="M 640 424 Q 694 440 712 500" stroke="#d3c3ae" stroke-width="24" fill="none" stroke-linecap="round"/>
  <circle cx="714" cy="506" r="17" fill="#e6d8c6"/>

  <!-- father hand resting on mother's far shoulder -->
  <g>
    <path d="M 636 410 Q 648 398 660 402" stroke="#3d5875" stroke-width="0"/>
    <circle cx="652" cy="402" r="18" fill="#3d5875"/>
    <path d="M 646 388 q 10 -6 18 -2" stroke="#2b3542" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 658 396 q 10 -2 12 6" stroke="#2b3542" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ========================================================= -->
  <!-- ===== TEEN (slouching, arms crossed, headphones) ===== -->
  <!-- ========================================================= -->
  <g transform="rotate(8 820 700)">
    <!-- legs -->
    <rect x="778" y="576" width="38" height="124" rx="11" fill="#2a2e36"/>
    <rect x="828" y="576" width="38" height="124" rx="11" fill="#2a2e36"/>
    <rect x="766" y="684" width="58" height="20" rx="9" fill="#14161b"/>
    <rect x="822" y="684" width="58" height="20" rx="9" fill="#14161b"/>
    <!-- torso -->
    <path d="M 764 585 Q 756 468 788 418 L 862 418 Q 892 468 878 585 Q 820 602 764 585 Z" fill="url(#teenBody)"/>
    <path d="M 820 430 L 820 576" stroke="#151820" stroke-width="4" opacity="0.8"/>
    <rect x="790" y="500" width="60" height="42" rx="8" fill="#2f333c"/>
    <!-- crossed arms -->
    <path d="M 774 462 Q 820 508 866 460" stroke="#3a3f49" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M 866 486 Q 820 522 776 480" stroke="#2f333c" stroke-width="28" fill="none" stroke-linecap="round"/>
    <circle cx="872" cy="462" r="15" fill="#474d59"/>
    <circle cx="770" cy="482" r="15" fill="#3a3f49"/>
    <!-- neck -->
    <rect x="806" y="372" width="28" height="54" rx="8" fill="#1b1e24"/>
    <!-- head, extra tilt -->
    <g transform="rotate(11 820 356)">
      <rect x="782" y="322" width="82" height="80" rx="22" fill="url(#teenBody)"/>
      <rect x="792" y="336" width="62" height="52" rx="12" fill="#0f1219"/>
      <rect x="802" y="352" width="42" height="14" rx="7" fill="#6bff9e" filter="url(#eyeGlow)"/>
      <path d="M 808 382 q 14 -5 28 0" stroke="#5a6270" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- cap -->
      <path d="M 776 336 Q 820 296 864 336 L 870 348 L 772 348 Z" fill="#2f6b56"/>
      <path d="M 772 344 Q 738 348 736 360 Q 772 362 782 352 Z" fill="#24513f"/>
      <!-- headphones -->
      <path d="M 778 330 Q 822 288 866 330" stroke="#12151b" stroke-width="11" fill="none"/>
      <rect x="766" y="330" width="22" height="40" rx="9" fill="#20242c"/>
      <rect x="854" y="330" width="22" height="40" rx="9" fill="#20242c"/>
      <rect x="770" y="340" width="14" height="20" rx="6" fill="#6bff9e" opacity="0.75"/>
    </g>
    <!-- headphone cord -->
    <path d="M 858 380 q 24 44 6 92" stroke="#6bff9e" stroke-width="3" fill="none" opacity="0.8"/>
  </g>

  <!-- ========================================================= -->
  <!-- ===== KID SISTER (bubbly, waving, mismatched) ===== -->
  <!-- ========================================================= -->
  <g>
    <!-- legs mismatched -->
    <rect x="498" y="676" width="16" height="30" rx="7" fill="#4fd1c5"/>
    <rect x="526" y="676" width="16" height="30" rx="7" fill="#ffb020"/>
    <ellipse cx="506" cy="708" rx="14" ry="7" fill="#3aa89e"/>
    <ellipse cx="534" cy="708" rx="14" ry="7" fill="#d98f12"/>
    <!-- body -->
    <ellipse cx="520" cy="636" rx="50" ry="54" fill="url(#kidBody)"/>
    <rect x="494" y="608" width="52" height="46" rx="13" fill="#2a2630"/>
    <circle cx="520" cy="628" r="15" fill="#63e8ff" filter="url(#eyeGlow)"/>
    <circle cx="525" cy="624" r="4" fill="#eafcff"/>
    <path d="M 502 654 q 18 14 36 0" stroke="#ff9aa2" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- arms -->
    <path d="M 478 624 Q 456 640 452 672" stroke="#4fd1c5" stroke-width="17" fill="none" stroke-linecap="round"/>
    <circle cx="450" cy="678" r="12" fill="#4fd1c5"/>
    <path d="M 562 622 Q 592 606 600 562" stroke="#ffd24a" stroke-width="17" fill="none" stroke-linecap="round"/>
    <circle cx="602" cy="556" r="13" fill="#ffd24a"/>
    <!-- wave rays -->
    <path d="M 620 544 l 14 -8 M 626 562 l 16 2 M 614 528 l 8 -14" stroke="#ffb020" stroke-width="4" stroke-linecap="round"/>
    <!-- antenna spring -->
    <path d="M 520 584 q -14 -10 0 -20 q 14 -10 0 -20 q -8 -6 -2 -14" stroke="#8a8f99" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="516" cy="524" r="8" fill="#ff6b6b"/>
  </g>

  <!-- ===== AWKWARD ACCENTS ===== -->
  <!-- father sweat drop -->
  <path d="M 476 244 q -11 16 0 24 q 11 -8 0 -24 Z" fill="#63e8ff" opacity="0.85"/>
  <!-- static tension between parents -->
  <path d="M 500 298 l 7 -9 l -5 -5 l 9 -9 l -4 -5 l 8 -8" stroke="#ffd24a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 512 320 l 6 -8 M 506 340 l 8 -10" stroke="#ffd24a" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- tiny stress lines near teen -->
  <path d="M 892 300 l 16 -6 M 896 316 l 18 0 M 890 332 l 16 6" stroke="#8a8f99" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
