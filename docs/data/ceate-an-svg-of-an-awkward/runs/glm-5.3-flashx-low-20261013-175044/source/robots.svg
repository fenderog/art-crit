<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Awkward Family Portrait of Robots -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4a3f5e"/>
      <stop offset="60%" stop-color="#332a45"/>
      <stop offset="100%" stop-color="#241d33"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a3040"/>
      <stop offset="100%" stop-color="#4b1d29"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2438"/>
      <stop offset="100%" stop-color="#191423"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fff3d0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff3d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="620" fill="url(#curtain)" opacity="0.35"/>
  <g opacity="0.25" fill="#000">
    <rect x="150" y="0" width="60" height="620" rx="30"/>
    <rect x="290" y="0" width="40" height="620" rx="20"/>
    <rect x="470" y="0" width="70" height="620" rx="35"/>
    <rect x="640" y="0" width="35" height="620" rx="17"/>
    <rect x="800" y="0" width="65" height="620" rx="32"/>
    <rect x="960" y="0" width="45" height="620" rx="22"/>
    <rect x="1080" y="0" width="55" height="620" rx="27"/>
  </g>
  <rect x="0" y="600" width="1200" height="300" fill="url(#floor)"/>
  <rect x="0" y="596" width="1200" height="10" fill="#3d3350"/>
  <rect x="0" y="0" width="1200" height="900" fill="url(#spot)"/>

  <!-- ============ DAD: rigid, forced smile, gripping son's shoulder ============ -->
  <g transform="translate(250,300)">
    <rect x="-52" y="0" width="104" height="150" rx="28" fill="#5b7f9e" stroke="#31485c" stroke-width="5"/>
    <rect x="-30" y="20" width="60" height="80" rx="10" fill="#44637f" stroke="#31485c" stroke-width="4"/>
    <circle cx="0" cy="60" r="12" fill="#a8d5f0" stroke="#31485c" stroke-width="4"/>
    <!-- neck + head -->
    <rect x="-12" y="-18" width="24" height="26" fill="#44637f" stroke="#31485c" stroke-width="4"/>
    <rect x="-58" y="-110" width="116" height="96" rx="24" fill="#6b93b3" stroke="#31485c" stroke-width="5"/>
    <!-- antenna with tiny tie-flag -->
    <line x1="0" y1="-110" x2="0" y2="-140" stroke="#31485c" stroke-width="5"/>
    <circle cx="0" cy="-146" r="9" fill="#d9534f" stroke="#31485c" stroke-width="4"/>
    <!-- eyes: slightly too wide -->
    <circle cx="-24" cy="-70" r="13" fill="#fff" stroke="#31485c" stroke-width="4"/>
    <circle cx="24" cy="-70" r="13" fill="#fff" stroke="#31485c" stroke-width="4"/>
    <circle cx="-24" cy="-70" r="5.5" fill="#22333f"/>
    <circle cx="24" cy="-70" r="5.5" fill="#22333f"/>
    <!-- grille smile: forced -->
    <g stroke="#22333f" stroke-width="4" stroke-linecap="round">
      <path d="M-22 -38 Q0 -24 22 -38" fill="none"/>
      <line x1="-12" y1="-33" x2="-10" y2="-29"/>
      <line x1="0" y1="-30" x2="0" y2="-26"/>
      <line x1="12" y1="-33" x2="10" y2="-29"/>
    </g>
    <!-- ears -->
    <rect x="-70" y="-80" width="12" height="26" rx="5" fill="#44637f" stroke="#31485c" stroke-width="4"/>
    <rect x="58" y="-80" width="12" height="26" rx="5" fill="#44637f" stroke="#31485c" stroke-width="4"/>
    <!-- arms: one rigid down, one gripping son's shoulder -->
    <rect x="-92" y="10" width="34" height="110" rx="16" fill="#5b7f9e" stroke="#31485c" stroke-width="5"/>
    <circle cx="-75" cy="132" r="18" fill="#6b93b3" stroke="#31485c" stroke-width="5"/>
    <path d="M50 14 Q120 10 148 42" fill="none" stroke="#5b7f9e" stroke-width="30" stroke-linecap="round"/>
    <path d="M50 14 Q120 10 148 42" fill="none" stroke="#31485c" stroke-width="30" stroke-linecap="round" opacity="0.25"/>
    <circle cx="150" cy="46" r="19" fill="#6b93b3" stroke="#31485c" stroke-width="5"/>
    <!-- legs -->
    <rect x="-40" y="150" width="30" height="60" rx="12" fill="#44637f" stroke="#31485c" stroke-width="5"/>
    <rect x="10" y="150" width="30" height="60" rx="12" fill="#44637f" stroke="#31485c" stroke-width="5"/>
    <ellipse cx="-28" cy="216" rx="30" ry="12" fill="#31485c"/>
    <ellipse cx="24" cy="216" rx="30" ry="12" fill="#31485c"/>
  </g>

  <!-- ============ MOM: over-posed, one hand on hip, leaning toward dad ============ -->
  <g transform="translate(430,320)">
    <path d="M-55 0 Q-70 100 -40 150 L40 150 Q70 100 55 0 Z" fill="#b06a8f" stroke="#5e3350" stroke-width="5"/>
    <circle cx="0" cy="70" r="13" fill="#f2c9dd" stroke="#5e3350" stroke-width="4"/>
    <rect x="-12" y="-18" width="24" height="26" fill="#93557a" stroke="#5e3350" stroke-width="4"/>
    <rect x="-56" y="-108" width="112" height="94" rx="24" fill="#c47ba1" stroke="#5e3350" stroke-width="5"/>
    <!-- flower antenna -->
    <line x1="0" y1="-108" x2="8" y2="-138" stroke="#5e3350" stroke-width="5"/>
    <circle cx="10" cy="-144" r="9" fill="#f4d35e" stroke="#5e3350" stroke-width="4"/>
    <g stroke="#5e3350" stroke-width="3" fill="#f091b8">
      <circle cx="0" cy="-152" r="5"/><circle cx="20" cy="-152" r="5"/>
      <circle cx="0" cy="-136" r="5"/><circle cx="20" cy="-136" r="5"/>
    </g>
    <!-- eyes with eyelashes -->
    <circle cx="-24" cy="-68" r="13" fill="#fff" stroke="#5e3350" stroke-width="4"/>
    <circle cx="24" cy="-68" r="13" fill="#fff" stroke="#5e3350" stroke-width="4"/>
    <circle cx="-22" cy="-67" r="5.5" fill="#3a2033"/>
    <circle cx="26" cy="-67" r="5.5" fill="#3a2033"/>
    <g stroke="#3a2033" stroke-width="3" stroke-linecap="round">
      <line x1="-34" y1="-79" x2="-40" y2="-84"/><line x1="-27" y1="-83" x2="-30" y2="-90"/>
      <line x1="14" y1="-79" x2="8" y2="-84"/><line x1="21" y1="-83" x2="18" y2="-90"/>
    </g>
    <!-- pursed smiling mouth -->
    <path d="M-16 -36 Q0 -30 16 -36" fill="none" stroke="#3a2033" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-38" r="4" fill="#3a2033"/>
    <rect x="-68" y="-78" width="12" height="26" rx="5" fill="#93557a" stroke="#5e3350" stroke-width="4"/>
    <rect x="56" y="-78" width="12" height="26" rx="5" fill="#93557a" stroke="#5e3350" stroke-width="4"/>
    <!-- left arm on hip -->
    <path d="M-52 16 Q-96 50 -70 78 Q-52 92 -34 76" fill="none" stroke="#b06a8f" stroke-width="28" stroke-linecap="round"/>
    <circle cx="-36" cy="76" r="16" fill="#c47ba1" stroke="#5e3350" stroke-width="5"/>
    <!-- right arm touching dad's arm -->
    <path d="M50 16 Q100 30 118 58" fill="none" stroke="#b06a8f" stroke-width="28" stroke-linecap="round"/>
    <circle cx="120" cy="60" r="16" fill="#c47ba1" stroke="#5e3350" stroke-width="5"/>
    <!-- legs with heels -->
    <rect x="-34" y="150" width="24" height="58" rx="10" fill="#93557a" stroke="#5e3350" stroke-width="5"/>
    <rect x="10" y="150" width="24" height="58" rx="10" fill="#93557a" stroke="#5e3350" stroke-width="5"/>
    <path d="M-48 208 L-8 208 L-4 222 L-52 222 Z" fill="#5e3350"/>
    <path d="M6 208 L46 208 L50 222 L2 222 Z" fill="#5e3350"/>
  </g>

  <!-- ============ TEEN SON: slouching, arms crossed, looking away ============ -->
  <g transform="translate(560,390)">
    <path d="M-38 0 L34 8 L28 108 L-34 100 Z" fill="#4d6b4f" stroke="#28361f" stroke-width="5"/>
    <!-- hood detail -->
    <path d="M-38 0 Q0 -14 34 8 L30 26 Q0 8 -34 18 Z" fill="#3b523d" stroke="#28361f" stroke-width="4"/>
    <rect x="-8" y="-16" width="22" height="24" fill="#3b523d" stroke="#28361f" stroke-width="4"/>
    <g transform="rotate(6)">
      <rect x="-44" y="-104" width="92" height="90" rx="20" fill="#5d8060" stroke="#28361f" stroke-width="5"/>
      <!-- eyes: half-lidded, looking right (away) -->
      <rect x="-30" y="-72" width="24" height="6" rx="3" fill="#28361f"/>
      <rect x="10" y="-72" width="24" height="6" rx="3" fill="#28361f"/>
      <circle cx="-14" cy="-62" r="5" fill="#28361f"/>
      <circle cx="26" cy="-62" r="5" fill="#28361f"/>
      <!-- flat unimpressed mouth -->
      <line x1="-14" y1="-32" x2="14" y2="-32" stroke="#28361f" stroke-width="4" stroke-linecap="round"/>
      <!-- headphone -->
      <path d="M-46 -66 Q-58 -90 -30 -104" fill="none" stroke="#222" stroke-width="6"/>
      <rect x="-62" y="-74" width="14" height="24" rx="6" fill="#222" stroke="#000" stroke-width="3"/>
      <rect x="46" y="-74" width="14" height="24" rx="6" fill="#222" stroke="#000" stroke-width="3"/>
      <path d="M-56 -66 Q0 -120 54 -66" fill="none" stroke="#222" stroke-width="6"/>
    </g>
    <!-- crossed arms -->
    <path d="M-56 14 Q-20 44 24 34" fill="none" stroke="#4d6b4f" stroke-width="26" stroke-linecap="round"/>
    <path d="M52 20 Q20 54 -22 40" fill="none" stroke="#547556" stroke-width="26" stroke-linecap="round"/>
    <circle cx="24" cy="34" r="15" fill="#5d8060" stroke="#28361f" stroke-width="5"/>
    <circle cx="-22" cy="40" r="15" fill="#547556" stroke="#28361f" stroke-width="5"/>
    <!-- legs, ankles crossed -->
    <rect x="-30" y="104" width="24" height="62" rx="10" fill="#3b523d" stroke="#28361f" stroke-width="5"/>
    <rect x="8" y="104" width="24" height="62" rx="10" fill="#3b523d" stroke="#28361f" stroke-width="5"/>
    <path d="M-38 166 L-38 178 L10 186 L10 172 Z" fill="#28361f"/>
    <path d="M6 166 L6 178 L50 170 L50 156 Z" fill="#28361f"/>
  </g>

  <!-- ============ GRANDMA: tiny, holding a doily/handkerchief, gentle daze ============ -->
  <g transform="translate(790,440)">
    <path d="M-42 0 Q-52 80 -28 118 L28 118 Q52 80 42 0 Z" fill="#8f7fb8" stroke="#453a63" stroke-width="5"/>
    <circle cx="0" cy="55" r="10" fill="#d8cdf0" stroke="#453a63" stroke-width="4"/>
    <rect x="-10" y="-14" width="20" height="20" fill="#75689e" stroke="#453a63" stroke-width="4"/>
    <rect x="-46" y="-92" width="92" height="78" rx="22" fill="#a191c9" stroke="#453a63" stroke-width="5"/>
    <!-- bun antenna -->
    <circle cx="0" cy="-100" r="14" fill="#b9b9c9" stroke="#453a63" stroke-width="4"/>
    <line x1="0" y1="-86" x2="0" y2="-92" stroke="#453a63" stroke-width="4"/>
    <!-- squinty happy closed eyes -->
    <path d="M-32 -54 Q-22 -64 -12 -54" fill="none" stroke="#453a63" stroke-width="4" stroke-linecap="round"/>
    <path d="M12 -54 Q22 -64 32 -54" fill="none" stroke="#453a63" stroke-width="4" stroke-linecap="round"/>
    <path d="M-30 -56 Q-22 -52 -14 -56" fill="none" stroke="#453a63" stroke-width="3" stroke-linecap="round"/>
    <path d="M14 -56 Q22 -52 30 -56" fill="none" stroke="#453a63" stroke-width="3" stroke-linecap="round"/>
    <!-- gentle small smile -->
    <path d="M-12 -26 Q0 -18 12 -26" fill="none" stroke="#453a63" stroke-width="4" stroke-linecap="round"/>
    <!-- round glasses -->
    <circle cx="-22" cy="-54" r="18" fill="none" stroke="#c9a24b" stroke-width="3.5"/>
    <circle cx="22" cy="-54" r="18" fill="none" stroke="#c9a24b" stroke-width="3.5"/>
    <line x1="-4" y1="-54" x2="4" y2="-54" stroke="#c9a24b" stroke-width="3.5"/>
    <!-- arms holding handkerchief -->
    <path d="M-40 12 Q-58 50 -30 62" fill="none" stroke="#8f7fb8" stroke-width="22" stroke-linecap="round"/>
    <path d="M40 12 Q58 50 30 62" fill="none" stroke="#8f7fb8" stroke-width="22" stroke-linecap="round"/>
    <!-- doily handkerchief -->
    <path d="M-24 56 Q0 44 24 56 Q14 74 0 76 Q-14 74 -24 56 Z" fill="#f5f0fa" stroke="#c9bde0" stroke-width="3"/>
    <circle cx="-24" cy="62" r="9" fill="#a191c9" stroke="#453a63" stroke-width="4"/>
    <circle cx="24" cy="62" r="9" fill="#a191c9" stroke="#453a63" stroke-width="4"/>
    <!-- little legs and shoes -->
    <rect x="-24" y="118" width="18" height="40" rx="8" fill="#75689e" stroke="#453a63" stroke-width="4"/>
    <rect x="6" y="118" width="18" height="40" rx="8" fill="#75689e" stroke="#453a63" stroke-width="4"/>
    <ellipse cx="-20" cy="162" rx="24" ry="10" fill="#453a63"/>
    <ellipse cx="20" cy="162" rx="24" ry="10" fill="#453a63"/>
    <!-- cane -->
    <line x1="52" y1="10" x2="52" y2="160" stroke="#7a5a33" stroke-width="7" stroke-linecap="round"/>
    <path d="M42 10 Q52 -4 62 10" fill="none" stroke="#7a5a33" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- ============ TODDLER: chaos gremlin, mid-wiggle, holding severed cable ============ -->
  <g transform="translate(955,470)">
    <g transform="rotate(-8)">
      <rect x="-34" y="0" width="68" height="84" rx="20" fill="#e8a13c" stroke="#7a4e12" stroke-width="5"/>
      <circle cx="0" cy="42" r="9" fill="#ffe3ae" stroke="#7a4e12" stroke-width="4"/>
      <rect x="-9" y="-12" width="18" height="18" fill="#c9882f" stroke="#7a4e12" stroke-width="4"/>
      <rect x="-40" y="-74" width="80" height="64" rx="18" fill="#f2b45a" stroke="#7a4e12" stroke-width="5"/>
      <!-- one pigtail antenna -->
      <line x1="-30" y1="-70" x2="-44" y2="-92" stroke="#7a4e12" stroke-width="4"/>
      <circle cx="-46" cy="-96" r="8" fill="#d9534f" stroke="#7a4e12" stroke-width="4"/>
      <line x1="30" y1="-70" x2="44" y2="-92" stroke="#7a4e12" stroke-width="4"/>
      <circle cx="46" cy="-96" r="8" fill="#d9534f" stroke="#7a4e12" stroke-width="4"/>
      <!-- huge chaotic eyes -->
      <circle cx="-15" cy="-46" r="10" fill="#fff" stroke="#7a4e12" stroke-width="4"/>
      <circle cx="17" cy="-46" r="10" fill="#fff" stroke="#7a4e12" stroke-width="4"/>
      <circle cx="-13" cy="-44" r="4.5" fill="#5b3a08"/>
      <circle cx="19" cy="-48" r="4.5" fill="#5b3a08"/>
      <!-- open goofy grin with one tooth -->
      <path d="M-14 -22 Q1 -8 16 -22 Q1 -16 -14 -22 Z" fill="#5b3a08" stroke="#7a4e12" stroke-width="3"/>
      <rect x="-3" y="-21" width="7" height="6" fill="#fff" stroke="#7a4e12" stroke-width="1.5"/>
      <!-- sticker on head -->
      <circle cx="22" cy="-64" r="6" fill="#7ec8e3" stroke="#3d7ea6" stroke-width="2"/>
    </g>
    <!-- arms up flailing; one hand holds a chewed cable -->
    <path d="M-32 8 Q-66 -8 -74 -34" fill="none" stroke="#e8a13c" stroke-width="20" stroke-linecap="round"/>
    <path d="M32 8 Q66 -8 74 -34" fill="none" stroke="#e8a13c" stroke-width="20" stroke-linecap="round"/>
    <circle cx="-75" cy="-36" r="12" fill="#f2b45a" stroke="#7a4e12" stroke-width="4"/>
    <circle cx="75" cy="-36" r="12" fill="#f2b45a" stroke="#7a4e12" stroke-width="4"/>
    <!-- dangling cable in right hand -->
    <path d="M75 -36 Q95 -6 82 24 Q74 44 88 60" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 10"/>
    <path d="M75 -36 Q95 -6 82 24 Q74 44 88 60" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <rect x="80" y="56" width="18" height="16" rx="4" fill="#555" stroke="#2c2c2c" stroke-width="3" transform="rotate(20 89 64)"/>
    <!-- running-in-place stubby legs -->
    <rect x="-26" y="84" width="20" height="42" rx="9" fill="#c9882f" stroke="#7a4e12" stroke-width="4" transform="rotate(12 -16 84)"/>
    <rect x="6" y="84" width="20" height="42" rx="9" fill="#c9882f" stroke="#7a4e12" stroke-width="4" transform="rotate(-12 16 84)"/>
    <ellipse cx="-30" cy="132" rx="22" ry="10" fill="#7a4e12" transform="rotate(12 -30 132)"/>
    <ellipse cx="32" cy="128" rx="22" ry="10" fill="#7a4e12" transform="rotate(-12 32 128)"/>
  </g>

  <!-- FAMILY DOG-BOT sitting in front -->
  <g transform="translate(340,640)">
    <rect x="-46" y="10" width="92" height="76" rx="28" fill="#8a8f98" stroke="#3c4048" stroke-width="5"/>
    <rect x="-30" y="76" width="18" height="34" rx="8" fill="#6d727a" stroke="#3c4048" stroke-width="4"/>
    <rect x="12" y="76" width="18" height="34" rx="8" fill="#6d727a" stroke="#3c4048" stroke-width="4"/>
    <ellipse cx="-26" cy="112" rx="24" ry="9" fill="#3c4048"/>
    <ellipse cx="26" cy="112" rx="24" ry="9" fill="#3c4048"/>
    <!-- head tilted -->
    <g transform="rotate(10 0 -30)">
      <rect x="-34" y="-66" width="68" height="56" rx="18" fill="#9ba0a9" stroke="#3c4048" stroke-width="5"/>
      <!-- floppy ears -->
      <rect x="-46" y="-62" width="14" height="34" rx="7" fill="#6d727a" stroke="#3c4048" stroke-width="4"/>
      <rect x="32" y="-62" width="14" height="34" rx="7" fill="#6d727a" stroke="#3c4048" stroke-width="4"/>
      <circle cx="-14" cy="-42" r="7" fill="#fff" stroke="#3c4048" stroke-width="3.5"/>
      <circle cx="16" cy="-42" r="7" fill="#fff" stroke="#3c4048" stroke-width="3.5"/>
      <circle cx="-13" cy="-41" r="3" fill="#26292e"/>
      <circle cx="17" cy="-41" r="3" fill="#26292e"/>
      <ellipse cx="1" cy="-26" rx="8" ry="6" fill="#3c4048"/>
      <path d="M1 -20 Q1 -12 10 -14" fill="none" stroke="#3c4048" stroke-width="3.5" stroke-linecap="round"/>
      <!-- tail antenna wagging -->
      <line x1="0" y1="-66" x2="6" y2="-84" stroke="#3c4048" stroke-width="4"/>
      <circle cx="7" cy="-88" r="6" fill="#e8a13c" stroke="#7a4e12" stroke-width="3"/>
    </g>
    <!-- wag tail -->
    <path d="M46 40 Q76 28 82 8" fill="none" stroke="#6d727a" stroke-width="14" stroke-linecap="round"/>
    <circle cx="83" cy="6" r="8" fill="#9ba0a9" stroke="#3c4048" stroke-width="4"/>
  </g>

  <!-- tripod hint in background -->
  <g opacity="0.5" stroke="#14101d" stroke-width="10" stroke-linecap="round">
    <line x1="600" y1="120" x2="560" y2="40"/>
    <line x1="600" y1="120" x2="640" y2="40"/>
    <line x1="600" y1="120" x2="600" y2="30"/>
    <circle cx="600" cy="130" r="18" fill="#14101d"/>
  </g>

  <!-- vignette -->
  <rect width="1200" height="900" fill="none" stroke="#120d1c" stroke-width="40" opacity="0.55"/>
</svg>
