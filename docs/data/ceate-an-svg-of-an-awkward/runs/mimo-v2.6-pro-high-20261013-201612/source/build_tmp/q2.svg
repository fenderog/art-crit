<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150">
  <title>Awkward robot family portrait</title>

  <defs>
    <!-- backdrop -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5269"/>
      <stop offset="0.5" stop-color="#2a3d4e"/>
      <stop offset="1" stop-color="#1b2833"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a35"/>
      <stop offset="1" stop-color="#0d151c"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4b98c" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#a08c68" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#93805f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.47" r="0.74">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>

    <!-- metal shading (light comes from the upper left) -->
    <linearGradient id="gradDad" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#414e5a"/><stop offset="0.2" stop-color="#8fa3b1"/>
      <stop offset="0.44" stop-color="#a2b5c1"/><stop offset="0.7" stop-color="#78899a"/>
      <stop offset="1" stop-color="#3f4b56"/>
    </linearGradient>
    <linearGradient id="gradMom" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#72857f"/><stop offset="0.2" stop-color="#cfdcd6"/>
      <stop offset="0.44" stop-color="#e2ece7"/><stop offset="0.7" stop-color="#a9bab4"/>
      <stop offset="1" stop-color="#6c807a"/>
    </linearGradient>
    <linearGradient id="gradTeen" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#2e3841"/><stop offset="0.2" stop-color="#6c7c88"/>
      <stop offset="0.44" stop-color="#8394a0"/><stop offset="0.7" stop-color="#5a6873"/>
      <stop offset="1" stop-color="#2c353d"/>
    </linearGradient>
    <linearGradient id="gradGrandma" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#7e674c"/><stop offset="0.2" stop-color="#d3bd9c"/>
      <stop offset="0.44" stop-color="#e6d2b2"/><stop offset="0.7" stop-color="#b99d80"/>
      <stop offset="1" stop-color="#786144"/>
    </linearGradient>
    <linearGradient id="gradKid" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#8b6624"/><stop offset="0.2" stop-color="#dcb25e"/>
      <stop offset="0.44" stop-color="#f0d189"/><stop offset="0.7" stop-color="#c79c48"/>
      <stop offset="1" stop-color="#85611f"/>
    </linearGradient>
    <linearGradient id="gradBaby" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#72889a"/><stop offset="0.2" stop-color="#cfe0ea"/>
      <stop offset="0.44" stop-color="#e4f1f8"/><stop offset="0.7" stop-color="#adc3d1"/>
      <stop offset="1" stop-color="#6b8294"/>
    </linearGradient>
    <linearGradient id="gradDrone" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#5e6a74"/><stop offset="0.2" stop-color="#a9b7c1"/>
      <stop offset="0.44" stop-color="#c2ced7"/><stop offset="0.7" stop-color="#8d9ba5"/>
      <stop offset="1" stop-color="#586470"/>
    </linearGradient>
    <linearGradient id="gradDog" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#756748"/><stop offset="0.2" stop-color="#c0b091"/>
      <stop offset="0.44" stop-color="#d2c2a3"/><stop offset="0.7" stop-color="#a5956f"/>
      <stop offset="1" stop-color="#6d6042"/>
    </linearGradient>

    <!-- raised arm / hand (own shading, sits outside the body gradient range) -->
    <linearGradient id="gradDadArm" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#4c5a66"/><stop offset="0.25" stop-color="#9db0bd"/>
      <stop offset="0.55" stop-color="#b2c3ce"/><stop offset="0.8" stop-color="#8496a3"/>
      <stop offset="1" stop-color="#55636f"/>
    </linearGradient>

    <!-- glass -->
    <radialGradient id="lens" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#e2f6fd"/>
      <stop offset="0.32" stop-color="#7cc0d6"/>
      <stop offset="0.72" stop-color="#2b5c72"/>
      <stop offset="1" stop-color="#123140"/>
    </radialGradient>
    <radialGradient id="lensWarm" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff2d8"/>
      <stop offset="0.32" stop-color="#d8b877"/>
      <stop offset="0.72" stop-color="#7a5c2c"/>
      <stop offset="1" stop-color="#3c2c12"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b303c"/>
      <stop offset="1" stop-color="#0e1c25"/>
    </linearGradient>

    <!-- effects -->
    <filter id="blur12" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur20" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ======================= STUDIO BACKDROP ======================= -->
  <rect width="1600" height="1150" fill="url(#wall)"/>
  <ellipse cx="790" cy="560" rx="760" ry="560" fill="url(#spot)"/>
  <g opacity="0.05" fill="#ffffff">
    <rect x="120" y="0" width="150" height="900"/>
    <rect x="420" y="0" width="150" height="900"/>
    <rect x="720" y="0" width="150" height="900"/>
    <rect x="1020" y="0" width="150" height="900"/>
    <rect x="1320" y="0" width="150" height="900"/>
  </g>
  <rect x="0" y="898" width="1600" height="252" fill="url(#floor)"/>
  <rect x="0" y="890" width="1600" height="14" fill="#87a2b4" opacity="0.16" filter="url(#blur12)"/>

  <!-- ======================= SHADOWS ======================= -->
  <g fill="#080e14">
    <ellipse cx="240" cy="992" rx="132" ry="24" opacity="0.34" filter="url(#blur12)"/>
    <ellipse cx="440" cy="1046" rx="118" ry="20" opacity="0.32" filter="url(#blur12)"/>
    <ellipse cx="614" cy="1012" rx="128" ry="22" opacity="0.34" filter="url(#blur12)"/>
    <ellipse cx="838" cy="1044" rx="186" ry="30" opacity="0.38" filter="url(#blur12)"/>
    <ellipse cx="1124" cy="1028" rx="140" ry="24" opacity="0.34" filter="url(#blur12)"/>
    <ellipse cx="958" cy="1104" rx="104" ry="18" opacity="0.34" filter="url(#blur12)"/>
    <ellipse cx="1424" cy="1058" rx="92" ry="16" opacity="0.22" filter="url(#blur12)"/>
  </g>

  <!-- ======================= DAD ======================= -->
  <g transform="translate(832,1035) scale(0.86)">
    <!-- arm behind mum, hand hovering over her shoulder -->
    <path d="M172 -628 Q 296 -648 372 -700 Q 424 -732 442 -744"
          stroke="#202b33" stroke-width="60" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M172 -628 Q 296 -648 372 -700 Q 424 -732 442 -744"
          stroke="url(#gradDadArm)" stroke-width="46" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(-28,478,-766)">
      <rect x="440" y="-800" width="76" height="70" rx="26" fill="url(#gradDadArm)" stroke="#202b33" stroke-width="6"/>
      <rect x="446" y="-856" width="21" height="56" rx="10" fill="url(#gradDadArm)" stroke="#202b33" stroke-width="5" transform="rotate(-12,456,-828)"/>
      <rect x="478" y="-862" width="21" height="58" rx="10" fill="url(#gradDadArm)" stroke="#202b33" stroke-width="5"/>
      <rect x="509" y="-852" width="21" height="54" rx="10" fill="url(#gradDadArm)" stroke="#202b33" stroke-width="5" transform="rotate(12,519,-825)"/>
    </g>

    <!-- legs -->
    <path d="M-92 -378 L -106 -196 L -110 -58" stroke="#202b33" stroke-width="74" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-92 -378 L -106 -196 L -110 -58" stroke="url(#gradDad)" stroke-width="60" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 -378 L 110 -196 L 118 -58" stroke="#202b33" stroke-width="74" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 -378 L 110 -196 L 118 -58" stroke="url(#gradDad)" stroke-width="60" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-106" cy="-196" r="38" fill="#5b6a78" stroke="#202b33" stroke-width="6"/>
    <circle cx="110" cy="-196" r="38" fill="#5b6a78" stroke="#202b33" stroke-width="6"/>
    <rect x="-178" y="-66" width="136" height="66" rx="28" fill="#5b6a78" stroke="#202b33" stroke-width="6"/>
    <rect x="56" y="-66" width="136" height="66" rx="28" fill="#5b6a78" stroke="#202b33" stroke-width="6"/>
    <path d="M-176 -32 L -44 -32 M 58 -32 L 190 -32" stroke="#202b33" stroke-width="9" opacity="0.55" stroke-linecap="round"/>

    <!-- pelvis + belt -->
    <rect x="-130" y="-440" width="260" height="116" rx="50" fill="url(#gradDad)" stroke="#202b33" stroke-width="6"/>
    <rect x="-136" y="-452" width="272" height="52" rx="24" fill="#4c5a66" stroke="#202b33" stroke-width="6"/>
    <rect x="-40" y="-448" width="80" height="46" rx="15" fill="#c8a15a" stroke="#202b33" stroke-width="5"/>
    <rect x="-18" y="-434" width="36" height="18" rx="6" fill="#202b33" opacity="0.5"/>

    <!-- torso -->
    <rect x="-162" y="-726" width="324" height="322" rx="74" fill="url(#gradDad)" stroke="#202b33" stroke-width="7"/>
    <rect x="-120" y="-690" width="240" height="240" rx="50" fill="#000000" opacity="0.09" stroke="#202b33" stroke-width="3" stroke-opacity="0.35"/>
    <!-- gauge -->
    <circle cx="-54" cy="-594" r="48" fill="#efe7d4" stroke="#202b33" stroke-width="7"/>
    <circle cx="-54" cy="-594" r="35" fill="none" stroke="#b3a68a" stroke-width="4"/>
    <path d="M-54 -594 L -32 -622" stroke="#202b33" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-54" cy="-594" r="7" fill="#202b33"/>
    <g stroke="#202b33" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <path d="M-88 -620 L -94 -632"/><path d="M-54 -634 L -54 -648"/><path d="M-20 -620 L -14 -632"/>
    </g>
    <!-- vent -->
    <rect x="34" y="-628" width="98" height="70" rx="16" fill="#4c5a66" stroke="#202b33" stroke-width="5"/>
    <g stroke="#a5b7c3" stroke-width="7" stroke-linecap="round" opacity="0.7">
      <path d="M50 -608 L 116 -608"/><path d="M50 -590 L 116 -590"/><path d="M50 -572 L 116 -572"/>
    </g>
    <!-- medal -->
    <circle cx="58" cy="-506" r="24" fill="#c8a15a" stroke="#202b33" stroke-width="6"/>
    <circle cx="58" cy="-506" r="11" fill="none" stroke="#8a6c33" stroke-width="4"/>
    <!-- rivets -->
    <g fill="#202b33" opacity="0.5">
      <circle cx="-110" cy="-676" r="7"/><circle cx="110" cy="-676" r="7"/>
      <circle cx="-110" cy="-472" r="7"/><circle cx="110" cy="-472" r="7"/>
    </g>
    <!-- shoulders -->
    <rect x="-198" y="-716" width="106" height="128" rx="44" fill="url(#gradDad)" stroke="#202b33" stroke-width="6"/>
    <rect x="92" y="-716" width="106" height="128" rx="44" fill="url(#gradDad)" stroke="#202b33" stroke-width="6"/>
    <g fill="#202b33" opacity="0.45">
      <circle cx="-145" cy="-660" r="8"/><circle cx="145" cy="-660" r="8"/>
    </g>

    <!-- neck -->
    <rect x="-60" y="-800" width="120" height="90" rx="24" fill="#4c5a66" stroke="#202b33" stroke-width="6"/>
    <path d="M-58 -772 L 58 -772 M-56 -748 L 56 -748" stroke="#202b33" stroke-width="5" opacity="0.5"/>

    <!-- head -->
    <g transform="rotate(2,0,-880)">
      <rect x="-114" y="-984" width="228" height="196" rx="48" fill="url(#gradDad)" stroke="#202b33" stroke-width="7"/>
      <rect x="-136" y="-944" width="38" height="92" rx="17" fill="#5b6a78" stroke="#202b33" stroke-width="6"/>
      <rect x="98" y="-944" width="38" height="92" rx="17" fill="#5b6a78" stroke="#202b33" stroke-width="6"/>
      <rect x="-90" y="-960" width="180" height="152" rx="34" fill="#000000" opacity="0.09"/>
      <!-- brow -->
      <rect x="-98" y="-966" width="128" height="22" rx="11" fill="#202b33" opacity="0.45" transform="rotate(-3,-34,-955)"/>
      <!-- main eye -->
      <circle cx="-40" cy="-906" r="50" fill="#202b33"/>
      <circle cx="-40" cy="-906" r="38" fill="url(#lens)"/>
      <circle cx="-40" cy="-906" r="50" fill="none" stroke="#c8a15a" stroke-width="8"/>
      <circle cx="-53" cy="-919" r="11" fill="#ffffff" opacity="0.8"/>
      <!-- secondary lens -->
      <circle cx="52" cy="-894" r="26" fill="#202b33"/>
      <circle cx="52" cy="-894" r="17" fill="url(#lensWarm)"/>
      <circle cx="52" cy="-894" r="26" fill="none" stroke="#c8a15a" stroke-width="6"/>
      <circle cx="45" cy="-902" r="6" fill="#ffffff" opacity="0.7"/>
      <!-- stiff polite smile -->
      <path d="M-58 -836 Q -6 -822 50 -836" stroke="#202b33" stroke-width="11" fill="none" stroke-linecap="round"/>
      <circle cx="-60" cy="-838" r="8" fill="#202b33" opacity="0.6"/>
      <circle cx="52" cy="-838" r="8" fill="#202b33" opacity="0.6"/>
      <!-- cheek vents -->
      <g stroke="#202b33" stroke-width="6" stroke-linecap="round" opacity="0.45">
        <path d="M-96 -866 L -70 -866"/><path d="M-96 -850 L -70 -850"/>
        <path d="M86 -862 L 112 -862"/><path d="M86 -846 L 112 -846"/>
      </g>
      <!-- rigid antenna + one askew -->
      <rect x="10" y="-1058" width="22" height="80" rx="10" fill="#5b6a78" stroke="#202b33" stroke-width="6"/>
      <circle cx="21" cy="-1068" r="20" fill="#c4624f" stroke="#202b33" stroke-width="6"/>
      <path d="M-62 -980 L -100 -1036" stroke="#202b33" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="M-62 -980 L -100 -1036" stroke="#5b6a78" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="-104" cy="-1044" r="13" fill="#c8a15a" stroke="#202b33" stroke-width="5"/>
    </g>

    <!-- free-hanging arm -->
    <path d="M-176 -664 Q -212 -540 -200 -418" stroke="#202b33" stroke-width="60" fill="none" stroke-linecap="round"/>
    <path d="M-176 -664 Q -212 -540 -200 -418" stroke="url(#gradDad)" stroke-width="46" fill="none" stroke-linecap="round"/>
    <rect x="-238" y="-452" width="76" height="80" rx="28" fill="url(#gradDad)" stroke="#202b33" stroke-width="6" transform="rotate(-6,-200,-412)"/>
    <rect x="-238" y="-392" width="30" height="52" rx="14" fill="url(#gradDad)" stroke="#202b33" stroke-width="5" transform="rotate(-10,-223,-366)"/>
    <rect x="-196" y="-392" width="30" height="52" rx="14" fill="url(#gradDad)" stroke="#202b33" stroke-width="5" transform="rotate(8,-181,-366)"/>
  </g>

  
</svg>
