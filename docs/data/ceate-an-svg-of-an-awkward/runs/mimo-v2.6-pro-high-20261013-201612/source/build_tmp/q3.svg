<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150">
  <title>Awkward robot family portrait</title>

  <defs>
    <!-- backdrop -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5269"/>
      <stop offset="0.5" stop-color="#2a3d4e"/>
      <stop offset="1" stop-color="#1b2833"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a35"/>
      <stop offset="1" stop-color="#0d151c"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4b98c" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#a08c68" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#93805f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.47" r="0.74">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>

    <!-- metal shading (light comes from the upper left) -->
    <linearGradient id="gradDad" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#414e5a"/><stop offset="0.2" stop-color="#8fa3b1"/>
      <stop offset="0.44" stop-color="#a2b5c1"/><stop offset="0.7" stop-color="#78899a"/>
      <stop offset="1" stop-color="#3f4b56"/>
    </linearGradient>
    <linearGradient id="gradMom" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#72857f"/><stop offset="0.2" stop-color="#cfdcd6"/>
      <stop offset="0.44" stop-color="#e2ece7"/><stop offset="0.7" stop-color="#a9bab4"/>
      <stop offset="1" stop-color="#6c807a"/>
    </linearGradient>
    <linearGradient id="gradTeen" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#2e3841"/><stop offset="0.2" stop-color="#6c7c88"/>
      <stop offset="0.44" stop-color="#8394a0"/><stop offset="0.7" stop-color="#5a6873"/>
      <stop offset="1" stop-color="#2c353d"/>
    </linearGradient>
    <linearGradient id="gradGrandma" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#7e674c"/><stop offset="0.2" stop-color="#d3bd9c"/>
      <stop offset="0.44" stop-color="#e6d2b2"/><stop offset="0.7" stop-color="#b99d80"/>
      <stop offset="1" stop-color="#786144"/>
    </linearGradient>
    <linearGradient id="gradKid" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#8b6624"/><stop offset="0.2" stop-color="#dcb25e"/>
      <stop offset="0.44" stop-color="#f0d189"/><stop offset="0.7" stop-color="#c79c48"/>
      <stop offset="1" stop-color="#85611f"/>
    </linearGradient>
    <linearGradient id="gradBaby" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#72889a"/><stop offset="0.2" stop-color="#cfe0ea"/>
      <stop offset="0.44" stop-color="#e4f1f8"/><stop offset="0.7" stop-color="#adc3d1"/>
      <stop offset="1" stop-color="#6b8294"/>
    </linearGradient>
    <linearGradient id="gradDrone" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#5e6a74"/><stop offset="0.2" stop-color="#a9b7c1"/>
      <stop offset="0.44" stop-color="#c2ced7"/><stop offset="0.7" stop-color="#8d9ba5"/>
      <stop offset="1" stop-color="#586470"/>
    </linearGradient>
    <linearGradient id="gradDog" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#756748"/><stop offset="0.2" stop-color="#c0b091"/>
      <stop offset="0.44" stop-color="#d2c2a3"/><stop offset="0.7" stop-color="#a5956f"/>
      <stop offset="1" stop-color="#6d6042"/>
    </linearGradient>

    <!-- raised arm / hand (own shading, sits outside the body gradient range) -->
    <linearGradient id="gradDadArm" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#4c5a66"/><stop offset="0.25" stop-color="#9db0bd"/>
      <stop offset="0.55" stop-color="#b2c3ce"/><stop offset="0.8" stop-color="#8496a3"/>
      <stop offset="1" stop-color="#55636f"/>
    </linearGradient>

    <!-- glass -->
    <radialGradient id="lens" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#e2f6fd"/>
      <stop offset="0.32" stop-color="#7cc0d6"/>
      <stop offset="0.72" stop-color="#2b5c72"/>
      <stop offset="1" stop-color="#123140"/>
    </radialGradient>
    <radialGradient id="lensWarm" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff2d8"/>
      <stop offset="0.32" stop-color="#d8b877"/>
      <stop offset="0.72" stop-color="#7a5c2c"/>
      <stop offset="1" stop-color="#3c2c12"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b303c"/>
      <stop offset="1" stop-color="#0e1c25"/>
    </linearGradient>

    <!-- effects -->
    <filter id="blur12" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur20" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ======================= STUDIO BACKDROP ======================= -->
  <rect width="1600" height="1150" fill="url(#wall)"/>
  <ellipse cx="790" cy="560" rx="760" ry="560" fill="url(#spot)"/>
  <g opacity="0.05" fill="#ffffff">
    <rect x="120" y="0" width="150" height="900"/>
    <rect x="420" y="0" width="150" height="900"/>
    <rect x="720" y="0" width="150" height="900"/>
    <rect x="1020" y="0" width="150" height="900"/>
    <rect x="1320" y="0" width="150" height="900"/>
  </g>
  <rect x="0" y="898" width="1600" height="252" fill="url(#floor)"/>
  <rect x="0" y="890" width="1600" height="14" fill="#87a2b4" opacity="0.16" filter="url(#blur12)"/>

  <!-- ======================= SHADOWS ======================= -->
  <g fill="#080e14">
    <ellipse cx="240" cy="992" rx="132" ry="24" opacity="0.34" filter="url(#blur12)"/>
    <ellipse cx="440" cy="1046" rx="118" ry="20" opacity="0.32" filter="url(#blur12)"/>
    <ellipse cx="614" cy="1012" rx="128" ry="22" opacity="0.34" filter="url(#blur12)"/>
    <ellipse cx="838" cy="1044" rx="186" ry="30" opacity="0.38" filter="url(#blur12)"/>
    <ellipse cx="1124" cy="1028" rx="140" ry="24" opacity="0.34" filter="url(#blur12)"/>
    <ellipse cx="958" cy="1104" rx="104" ry="18" opacity="0.34" filter="url(#blur12)"/>
    <ellipse cx="1424" cy="1058" rx="92" ry="16" opacity="0.22" filter="url(#blur12)"/>
  </g>

  <!-- ======================= MUM (holding the baby) ======================= -->
  <g transform="translate(1120,1020) scale(0.82)">
    <!-- legs -->
    <path d="M-36 -336 L -46 -172 L -50 -34" stroke="#202b33" stroke-width="52" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-36 -336 L -46 -172 L -50 -34" stroke="url(#gradMom)" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 -336 L 48 -172 L 54 -34" stroke="#202b33" stroke-width="52" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 -336 L 48 -172 L 54 -34" stroke="url(#gradMom)" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-96" y="-46" width="88" height="46" rx="21" fill="#9db1ab" stroke="#202b33" stroke-width="5"/>
    <rect x="16" y="-46" width="88" height="46" rx="21" fill="#9db1ab" stroke="#202b33" stroke-width="5"/>
    <!-- skirt -->
    <path d="M-66 -528 L -112 -320 Q -60 -286 0 -286 Q 60 -286 112 -320 L 66 -528 Z"
          fill="url(#gradMom)" stroke="#202b33" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-96 -372 Q 0 -336 96 -372" stroke="#202b33" stroke-width="5" fill="none" opacity="0.4"/>
    <!-- torso -->
    <path d="M-66 -528 Q -74 -612 -102 -676 L 102 -676 Q 74 -612 66 -528 Z"
          fill="url(#gradMom)" stroke="#202b33" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-52 -560 Q 0 -536 52 -560" stroke="#202b33" stroke-width="5" fill="none" opacity="0.35"/>
    <!-- shoulders -->
    <rect x="-172" y="-704" width="72" height="126" rx="34" fill="url(#gradMom)" stroke="#202b33" stroke-width="6"/>
    <rect x="100" y="-704" width="72" height="126" rx="34" fill="url(#gradMom)" stroke="#202b33" stroke-width="6"/>
    <!-- neck + collar -->
    <rect x="-30" y="-768" width="60" height="72" rx="17" fill="#9db1ab" stroke="#202b33" stroke-width="5"/>
    <path d="M-92 -700 Q 0 -648 92 -700" stroke="#c8a15a" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M-92 -700 Q 0 -648 92 -700" stroke="#202b33" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.18"/>

    <!-- head, tilted toward dad but the dish points away -->
    <g transform="rotate(-7,0,-740)">
      <rect x="-76" y="-886" width="152" height="172" rx="70" fill="url(#gradMom)" stroke="#202b33" stroke-width="6"/>
      <!-- hair plate -->
      <path d="M-78 -830 Q -104 -790 -84 -730 Q -66 -760 -68 -812 Z" fill="#c8a15a" stroke="#202b33" stroke-width="5"/>
      <!-- camera eye -->
      <circle cx="-22" cy="-812" r="42" fill="#202b33"/>
      <circle cx="-22" cy="-812" r="31" fill="url(#lens)"/>
      <circle cx="-22" cy="-812" r="42" fill="none" stroke="#c8a15a" stroke-width="7"/>
      <circle cx="-22" cy="-812" r="17" fill="none" stroke="#0d2430" stroke-width="5" opacity="0.6"/>
      <circle cx="-33" cy="-823" r="9" fill="#ffffff" opacity="0.85"/>
      <!-- other eye -->
      <circle cx="38" cy="-802" r="14" fill="#202b33"/>
      <circle cx="38" cy="-802" r="8" fill="url(#lens)"/>
      <circle cx="33" cy="-807" r="3.5" fill="#ffffff" opacity="0.8"/>
      <!-- gentle small smile -->
      <path d="M-4 -756 Q 16 -744 38 -758" stroke="#202b33" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="52" cy="-772" r="6" fill="#202b33" opacity="0.5"/>
      <!-- dish antenna pointing away -->
      <path d="M28 -884 Q 62 -918 74 -936" stroke="#202b33" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M28 -884 Q 62 -918 74 -936" stroke="#9db1ab" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="96" cy="-952" rx="34" ry="16" transform="rotate(-22,96,-952)" fill="#dfe9e4" stroke="#202b33" stroke-width="5"/>
      <circle cx="96" cy="-952" r="7" fill="#202b33"/>
    </g>

    <!-- far arm hanging, a hair away from dad -->
    <path d="M136 -654 Q 160 -540 138 -442" stroke="#202b33" stroke-width="42" fill="none" stroke-linecap="round"/>
    <path d="M136 -654 Q 160 -540 138 -442" stroke="url(#gradMom)" stroke-width="31" fill="none" stroke-linecap="round"/>
    <rect x="112" y="-458" width="52" height="60" rx="20" fill="url(#gradMom)" stroke="#202b33" stroke-width="5" transform="rotate(6,138,-428)"/>
    <g stroke="#202b33" stroke-width="5" stroke-linecap="round" opacity="0.65">
      <path d="M124 -416 L 152 -410"/><path d="M126 -398 L 154 -392"/><path d="M130 -380 L 156 -376"/>
    </g>

    <!-- baby -->
    <g>
      <rect x="-58" y="-632" width="118" height="118" rx="48" fill="url(#gradBaby)" stroke="#202b33" stroke-width="6"/>
      <rect x="-34" y="-606" width="70" height="66" rx="22" fill="#000000" opacity="0.10"/>
      <circle cx="-16" cy="-586" r="24" fill="#202b33"/>
      <circle cx="-16" cy="-586" r="17" fill="url(#lens)"/>
      <circle cx="-16" cy="-586" r="24" fill="none" stroke="#9db1ab" stroke-width="5"/>
      <circle cx="-23" cy="-593" r="6" fill="#ffffff" opacity="0.85"/>
      <circle cx="24" cy="-580" r="11" fill="#202b33"/>
      <circle cx="24" cy="-580" r="6.5" fill="url(#lens)"/>
      <path d="M-12 -556 Q 4 -546 22 -558" stroke="#202b33" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- rattle antenna -->
      <path d="M-6 -632 Q 16 -664 4 -686" stroke="#202b33" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle cx="2" cy="-694" r="16" fill="#c4624f" stroke="#202b33" stroke-width="5"/>
      <circle cx="2" cy="-694" r="6" fill="#f0d189"/>
      <!-- stubby arms -->
      <path d="M-52 -596 Q -84 -574 -78 -540" stroke="#202b33" stroke-width="26" fill="none" stroke-linecap="round"/>
      <path d="M-52 -596 Q -84 -574 -78 -540" stroke="url(#gradBaby)" stroke-width="17" fill="none" stroke-linecap="round"/>
      <path d="M56 -594 Q 88 -572 84 -542" stroke="#202b33" stroke-width="26" fill="none" stroke-linecap="round"/>
      <path d="M56 -594 Q 88 -572 84 -542" stroke="url(#gradBaby)" stroke-width="17" fill="none" stroke-linecap="round"/>
      <circle cx="-80" cy="-532" r="19" fill="#c4624f" stroke="#202b33" stroke-width="5"/>
      <circle cx="86" cy="-534" r="19" fill="url(#gradBaby)" stroke="#202b33" stroke-width="5"/>
      <!-- mismatched socks -->
      <rect x="-42" y="-528" width="40" height="34" rx="15" fill="#c4624f" stroke="#202b33" stroke-width="5"/>
      <rect x="8" y="-528" width="40" height="34" rx="15" fill="#4fa3a0" stroke="#202b33" stroke-width="5"/>
    </g>

    <!-- near arm cradling the baby -->
    <path d="M-104 -664 Q -150 -592 -112 -528 Q -84 -500 -52 -512"
          stroke="#202b33" stroke-width="42" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-104 -664 Q -150 -592 -112 -528 Q -84 -500 -52 -512"
          stroke="url(#gradMom)" stroke-width="31" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-78" y="-536" width="58" height="50" rx="19" fill="url(#gradMom)" stroke="#202b33" stroke-width="5" transform="rotate(16,-49,-511)"/>
    <g stroke="#202b33" stroke-width="5" stroke-linecap="round" opacity="0.65">
      <path d="M-70 -520 L -46 -506"/><path d="M-62 -508 L -38 -496"/>
    </g>
  </g>

  
</svg>
