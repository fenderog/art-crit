<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_light" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="65%" stop-color="#F2ECE4" />
      <stop offset="100%" stop-color="#E5DCD2" />
    </radialGradient>

    <!-- Organic Pod Gradients -->
    <linearGradient id="gradStone_light" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#3A332C" stop-opacity="1.0" />
      <stop offset="50%" stop-color="#24201C" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#151311" stop-opacity="1.0" />
    </linearGradient>

    <linearGradient id="gradTaupe_light" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#8F8073" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#736559" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#564A40" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="gradCashmere_light" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#C4B5A5" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#AD9D8D" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#8C7C6D" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="gradOat_light" x1="25%" y1="10%" x2="75%" y2="90%">
      <stop offset="0%" stop-color="#E8DFD5" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#D5C9BC" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#BAACA0" stop-opacity="0.88" />
    </linearGradient>

    <radialGradient id="gradCore_light" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#B89F82" stop-opacity="0.98" />
      <stop offset="55%" stop-color="#8F755A" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#5B4835" stop-opacity="1.0" />
    </radialGradient>

    <!-- Natural Soft Shadow -->
    <filter id="shadowOrganic_light" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#14100D" flood-opacity="0.14" />
    </filter>

    <!-- Subtle Ambient Texture Mask / Pattern -->
    <pattern id="noise_light" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.6" fill="#7D7268" opacity="0.3" />
      <circle cx="5" cy="12" r="0.4" fill="#7D7268" opacity="0.2" />
      <circle cx="35" cy="28" r="0.5" fill="#7D7268" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="900" fill="url(#bgGrad_light)" />
  <rect width="1200" height="900" fill="url(#noise_light)" opacity="0.8" />

  <!-- Ambient Generative Field Lines (Constellation & Growth Resonance) -->
  <g opacity="0.35" fill="none">
    <circle cx="600" cy="360" r="320" stroke="#C8BCB0" stroke-width="1.2" stroke-dasharray="3 9" />
    <ellipse cx="600" cy="360" rx="390" ry="220" stroke="#C8BCB0" stroke-width="1" stroke-dasharray="1 8" />
    <path d="M 240,360 C 240,190 400,140 600,140 C 800,140 960,190 960,360 C 960,530 800,580 600,580 C 400,580 240,530 240,360 Z" 
          stroke="#C8BCB0" stroke-width="1" opacity="0.6" stroke-dasharray="6 8" />
    
    <!-- Generative Coordinate Ticks -->
    <line x1="600" y1="35" x2="600" y2="55" stroke="#B5A799" stroke-width="1.5" />
    <line x1="600" y1="845" x2="600" y2="865" stroke="#B5A799" stroke-width="1.5" />
    <line x1="45" y1="360" x2="65" y2="360" stroke="#B5A799" stroke-width="1.5" />
    <line x1="1135" y1="360" x2="1155" y2="360" stroke="#B5A799" stroke-width="1.5" />
  </g>

  <!-- Central Organic Logo Mark -->
  <g id="mark" filter="url(#shadowOrganic_light)" transform="translate(0, 5)">
    <!-- Base Node: The Anchor (Deep Charcoal/Espresso) -->
    <!-- Curvature: Fluid organic petal wrapping from center to bottom right -->
    <path d="M 600,355 
             C 680,390 770,455 750,525 
             C 730,585 620,585 550,545 
             C 475,500 460,420 520,375 
             Z" 
          fill="url(#gradStone_light)" />

    <!-- Flow Node 2: Left Dynamic Swell (Warm Taupe) -->
    <!-- Intertwining smooth morphology -->
    <path d="M 600,355 
             C 490,305 385,340 365,420 
             C 345,505 425,560 505,550 
             C 575,540 605,450 600,355 
             Z" 
          fill="url(#gradTaupe_light)" />

    <!-- Flow Node 3: Ascending Crest (Cashmere / Soft Dune) -->
    <!-- Rising harmonic lobe -->
    <path d="M 600,355 
             C 530,240 505,155 585,135 
             C 665,115 725,195 710,285 
             C 695,365 640,375 600,355 
             Z" 
          fill="url(#gradCashmere_light)" />

    <!-- Flow Node 4: Translucent Overlay Petal (Warm Bone / Oat) -->
    <!-- Creates subtle emergent volumetric overlap -->
    <path d="M 600,355 
             C 655,270 745,260 785,335 
             C 825,410 775,490 695,485 
             C 625,480 605,405 600,355 
             Z" 
          fill="url(#gradOat_light)" />

    <!-- Flow Node 5: The Forward Surge (Soft Luminous Alabaster) -->
    <path d="M 600,355 
             C 515,340 455,255 505,195 
             C 555,135 660,180 670,265 
             C 680,345 630,365 600,355 
             Z" 
          fill="url(#gradTaupe_light)" opacity="0.3" />

    <!-- The Generative Heart: Seed Core (Raw Umber & Ochre Glow) -->
    <path d="M 600,355 
             C 638,325 668,365 660,400 
             C 652,435 615,452 580,440 
             C 545,428 542,390 565,362 
             C 578,348 588,345 600,355 
             Z" 
          fill="url(#gradCore_light)" />

    <!-- Inner Organic Spark / Fenestration -->
    <ellipse cx="602" cy="370" rx="10" ry="14" transform="rotate(-22 602 370)" fill="#FAF8F5" />

    <!-- Refined Linear Filaments (Vector currents symbolizing neural generative pathways) -->
    <path d="M 535,185 C 595,230 645,315 595,465" 
          stroke="rgba(255, 255, 255, 0.75)" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 430,375 C 505,390 590,410 685,510" 
          stroke="rgba(255, 255, 255, 0.75)" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <path d="M 685,235 C 655,300 635,415 540,525" 
          stroke="rgba(50, 42, 36, 0.45)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 6" fill="none" />

    <!-- Micro Focal Points (Biological / Algorithmic Nodes) -->
    <circle cx="585" cy="135" r="3.5" fill="#B5A799" />
    <circle cx="750" cy="525" r="3.5" fill="#B5A799" />
    <circle cx="365" cy="420" r="3.5" fill="#B5A799" />
    <circle cx="785" cy="335" r="3.5" fill="#B5A799" />
  </g>

  <!-- Brand Typography Lockup -->
  <g text-anchor="middle" id="brand-typography">
    <!-- Brand Wordmark -->
    <text x="600" y="710" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Neue Haas Grotesk', 'Helvetica Neue', sans-serif" 
          font-size="44" 
          font-weight="300" 
          letter-spacing="0.38em" 
          fill="#2A2521">M O R P H I C</text>

    <!-- Subtitle / Category Definition -->
    <text x="600" y="750" 
          font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif" 
          font-size="13" 
          font-weight="500" 
          letter-spacing="0.48em" 
          fill="#7D7268">GENERATIVE INTELLIGENCE</text>

    <!-- Refined Geometric Dividing Motif -->
    <line x1="560" y1="775" x2="640" y2="775" stroke="#B5A799" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="600" cy="775" r="2.5" fill="#7D7268" />
  </g>
</svg>