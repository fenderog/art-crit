<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surfing Pelican</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #e39a62;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .vignette {
      position: fixed;
      inset: 0;

      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(48, 18, 8, 0.35) 100%);
    }
  </style>
</head>
<body>
  <div class="vignette" aria-hidden="true"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
