<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Surfing Pelican</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#8fd3e8; font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .caption {
    position:fixed; left:28px; bottom:26px; pointer-events:none; user-select:none;
    color:#083344;
  }
  .caption h1 { font-size:clamp(28px, 4.5vw, 54px); font-weight:700; letter-spacing:-0.02em; line-height:0.95; }
  .caption p { margin-top:8px; font-family: ui-monospace, Menlo, monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.72; }
  .badge {
    position:fixed; top:22px; right:24px; pointer-events:none; user-select:none;
    font-family: ui-monospace, Menlo, monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:#083344; background:rgba(255,255,255,0.55); border:1px solid rgba(8,51,68,0.18);
    padding:8px 11px; border-radius:999px; backdrop-filter: blur(6px);
  }
  @media (prefers-reduced-motion: reduce) {
    .caption p::after { content:" · reduced motion"; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption">
  <h1>The Surfing<br/>Pelican</h1>
  <p>Golden hour &middot; Endless break</p>
</div>
<div class="badge">Live &middot; No controls needed</div>
<script type="module" src="main.js"></script>
</body>
</html>
