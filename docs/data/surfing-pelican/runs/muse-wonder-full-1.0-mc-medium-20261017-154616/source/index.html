<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfing Pelican</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3e8; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .caption {
    position: fixed; left: 20px; bottom: 18px; pointer-events: none; user-select: none;
    font-family: Georgia, "Times New Roman", serif; color: #0b3644;
  }
  .caption h1 { margin: 0; font-size: clamp(22px, 4vw, 40px); font-weight: 700; letter-spacing: .01em; }
  .caption p { margin: 4px 0 0; font-family: system-ui, sans-serif; font-size: 13px; color: #145064; }
</style>
</head>
<body>
  <div id="app" aria-label="Animated scene of a pelican surfing a wave"></div>
  <div class="caption" aria-hidden="true">
    <h1>Surfing Pelican</h1>
    <p>An animated ride on a rolling breaker</p>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
