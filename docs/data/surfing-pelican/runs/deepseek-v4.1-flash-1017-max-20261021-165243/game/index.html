  <body>
    <main id="stage" aria-label="An animated pelican surfing a golden hour wave">
      <canvas id="scene"></canvas>

      <div class="ui" aria-hidden="true">
        <header class="masthead">
          <div class="monogram">P<span>·</span>S</div>
          <div class="brand">
            <span class="brand-name">PELICAN</span>
            <span class="brand-sub">SURF CLUB</span>
          </div>
        </header>

        <div class="edition">
          <span>POINT BREAK</span>
          <span class="edition-line"></span>
          <span>EST. 2026</span>
        </div>

        <div class="title-lockup">
          <p class="eyebrow">GOLDEN HOUR SESSIONS / NO. 01</p>
          <h1>Ride the<br /><em>light.</em></h1>
          <p class="title-note">One bird. One board. No thoughts.</p>
        </div>

        <div class="readout">
          <span class="readout-dot"></span>
          <span>LIVE FROM THE PACIFIC</span>
          <span class="readout-divider"></span>
          <span>18:42 PST</span>
        </div>

        <div class="hint">
          <span class="hint-key">MOVE</span> to look
          <span class="hint-sep">/</span>
          <span class="hint-key">CLICK</span> to splash
        </div>

        <div class="frame-line frame-line--top"></div>
        <div class="frame-line frame-line--bottom"></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
      <div class="curtain" id="curtain"></div>
    </main>
