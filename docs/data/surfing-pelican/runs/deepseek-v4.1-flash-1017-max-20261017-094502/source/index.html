<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e7b39a" />
  <title>The Glide — A Surfing Pelican</title>
  <style>
    :root {
      --paper: #fff4df;
      --paper-dim: rgba(255, 244, 223, 0.64);
      --hairline: rgba(255, 244, 223, 0.24);
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      --sans: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dba98e;
      color: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
      outline: none;
    }

    body.is-dragging #scene { cursor: grabbing; }

    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      padding: clamp(20px, 3.4vw, 48px);
    }

    .overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 82% 72% at 50% 44%, transparent 42%, rgba(9, 36, 44, 0.18) 100%),
        linear-gradient(180deg, rgba(36, 43, 60, 0.16) 0%, transparent 23%, transparent 64%, rgba(6, 36, 43, 0.34) 100%);
      pointer-events: none;
    }

    .overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.15;
      background:
        radial-gradient(circle at 21% 28%, rgba(255, 236, 194, 0.65), transparent 27%),
        radial-gradient(circle at 75% 58%, rgba(185, 236, 225, 0.34), transparent 34%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .topbar {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      opacity: 0;
      transform: translateY(-10px);
      animation: arrive 1.2s cubic-bezier(.2,.8,.2,1) 0.55s forwards;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--paper);
      text-shadow: 0 1px 14px rgba(20, 44, 51, 0.25);
    }

    .brand-mark {
      position: relative;
      width: 25px;
      height: 25px;
      border: 1px solid rgba(255, 244, 223, 0.55);
      border-radius: 50%;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255, 244, 223, 0.74);
      transform: translate(-50%, -50%);
    }

    .brand-mark::before { width: 1px; height: 33px; }
    .brand-mark::after { width: 33px; height: 1px; }

    .top-meta {
      text-align: right;
      font-size: 9px;
      font-weight: 500;
      line-height: 1.85;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      color: var(--paper-dim);
      text-shadow: 0 1px 12px rgba(18, 42, 49, 0.2);
    }

    .top-meta strong {
      display: block;
      color: var(--paper);
      font-weight: 500;
      letter-spacing: 0.2em;
    }

    .content {
      position: absolute;
      left: clamp(20px, 3.4vw, 48px);
      bottom: clamp(25px, 4.2vw, 54px);
      right: clamp(20px, 3.4vw, 48px);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 36px;
    }

    .title-block {
      max-width: 520px;
      opacity: 0;
      transform: translateY(18px);
      animation: arrive 1.3s cubic-bezier(.2,.8,.2,1) 0.9s forwards;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 0 0 12px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--paper-dim);
      text-shadow: 0 1px 12px rgba(7, 27, 32, 0.35);
    }

    .kicker::before {
      content: "";
      display: block;
      width: 33px;
      height: 1px;
      background: rgba(255, 244, 223, 0.52);
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(46px, 7vw, 92px);
      line-height: 0.92;
      letter-spacing: -0.045em;
      color: #fff4df;
      text-shadow: 0 3px 30px rgba(13, 39, 45, 0.18);
    }

    .subtitle {
      margin: 17px 0 0;
      max-width: 290px;
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(13px, 1.3vw, 16px);
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: rgba(255, 244, 223, 0.78);
      text-shadow: 0 1px 15px rgba(7, 27, 32, 0.3);
    }

    .right-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 19px;
      opacity: 0;
      transform: translateY(12px);
      animation: arrive 1.3s cubic-bezier(.2,.8,.2,1) 1.15s forwards;
    }

    .conditions {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      color: var(--paper-dim);
      text-shadow: 0 1px 10px rgba(7, 27, 32, 0.3);
    }

    .conditions span {
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .conditions b {
      font-family: var(--serif);
      font-style: italic;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--paper);
    }

    .conditions i {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 244, 223, 0.46);
    }

    .hint {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 244, 223, 0.62);
      transition: opacity 1s ease;
    }

    .hint svg {
      width: 19px;
      height: 19px;
      opacity: 0.8;
    }

    .hint .sep {
      width: 18px;
      height: 1px;
      background: rgba(255, 244, 223, 0.35);
    }

    body.has-interacted .hint { opacity: 0.28; }

    .frame {
      position: absolute;
      inset: clamp(14px, 2vw, 26px);
      border: 1px solid rgba(255, 244, 223, 0.12);
      pointer-events: none;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 35px;
      height: 35px;
      border-color: rgba(255, 244, 223, 0.32);
      border-style: solid;
    }

    .frame::before {
      top: -1px;
      left: -1px;
      border-width: 1px 0 0 1px;
    }

    .frame::after {
      right: -1px;
      bottom: -1px;
      border-width: 0 1px 1px 0;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 211, 169, 0.95), rgba(197, 132, 119, 0.98));
      color: rgba(67, 45, 47, 0.8);
      transition: opacity 1.1s ease, visibility 1.1s ease;
    }

    .is-ready .loading {
      opacity: 0;
      visibility: hidden;
    }

    .loading-inner {
      text-align: center;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .loading-line {
      width: 110px;
      height: 1px;
      margin: 16px auto 0;
      background: rgba(76, 50, 49, 0.16);
      overflow: hidden;
    }

    .loading-line::after {
      content: "";
      display: block;
      width: 48%;
      height: 100%;
      background: rgba(76, 50, 49, 0.7);
      animation: loadSweep 1.5s ease-in-out infinite;
    }

    @keyframes loadSweep {
      from { transform: translateX(-110%); }
      to { transform: translateX(310%); }
    }

    @keyframes arrive {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .top-meta { display: none; }
      .content {
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-end;
        gap: 27px;
      }
      .right-meta {
        align-items: flex-start;
        gap: 13px;
        width: 100%;
      }
      .conditions { gap: 12px; }
      .conditions b { font-size: 17px; }
      h1 { font-size: clamp(50px, 16vw, 76px); }
      .subtitle { margin-top: 12px; }
      .frame { inset: 12px; }
    }

    @media (max-width: 420px) {
      .brand { font-size: 8px; }
      .brand-mark { width: 21px; height: 21px; }
      .conditions { font-size: 8px; }
      .hint { font-size: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .topbar, .title-block, .right-meta {
        animation-duration: 0.01s;
        animation-delay: 0s;
      }
      .loading-line::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body class="is-loading">
  <canvas id="scene" role="img" aria-label="A cream-coloured pelican in a yellow scarf rides a coral surfboard across a painterly, golden-hour ocean."></canvas>

  <div class="overlay">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Pelican / Field Notes</span>
      </div>
      <div class="top-meta">
        <strong>Pacific light study</strong>
        33&deg; 41&prime; N &nbsp;/&nbsp; 118&deg; 28&prime; W<br />
        Volume 07 &nbsp;&middot;&nbsp; 06:42
      </div>
    </header>

    <div class="content">
      <div class="title-block">
        <p class="kicker">A quiet ride, offshore</p>
        <h1>The Glide</h1>
        <p class="subtitle">One pelican, one longboard, and the last warm minutes of morning.</p>
      </div>

      <div class="right-meta">
        <div class="conditions">
          <span>Onshore <b>2.4<small>ft</small></b></span>
          <i aria-hidden="true"></i>
          <span>Sets <b>11<small>s</small></b></span>
          <i aria-hidden="true"></i>
          <span>Water <b>19<small>&deg;</small></b></span>
        </div>
        <div class="hint" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 11.5V6.75a1.25 1.25 0 0 1 2.5 0v3.5" />
            <path d="M11 10.25V5.5a1.25 1.25 0 0 1 2.5 0v4.5" />
            <path d="M13.5 10V6.75a1.25 1.25 0 0 1 2.5 0v4.5" />
            <path d="M16 10.5v-2a1.25 1.25 0 0 1 2.5 0v5.25c0 2.5-2 4.25-4.5 4.25h-1.15a4 4 0 0 1-3.2-1.6l-3.2-4.3a1.3 1.3 0 0 1 1.9-1.75L11 12.5" />
          </svg>
          drag to drift
          <span class="sep"></span>
          tap to flap
        </div>
      </div>
    </div>

    <div class="frame" aria-hidden="true"></div>
  </div>

  <div class="loading">
    <div class="loading-inner">
      Reading the swell
      <div class="loading-line"></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
