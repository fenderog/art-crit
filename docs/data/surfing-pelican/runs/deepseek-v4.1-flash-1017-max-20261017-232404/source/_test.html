<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#160f23" />
    <title>Pelican Point — A Golden Hour Ride</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #fff0d9;
        --muted: rgba(255, 235, 208, 0.66);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background:
          radial-gradient(circle at 38% 34%, #7f415f 0%, transparent 46%),
          linear-gradient(180deg, #221732 0%, #160f23 70%, #0b1319 100%);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      .vignette {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 47%, transparent 42%, rgba(10, 6, 18, 0.18) 70%, rgba(7, 4, 14, 0.55) 112%),
          linear-gradient(180deg, rgba(14, 8, 24, 0.18) 0%, transparent 22%, transparent 78%, rgba(8, 5, 13, 0.36) 100%);
      }

      .grain {
        position: fixed;
        left: -8%;
        top: -8%;
        z-index: 3;
        width: 116%;
        height: 116%;
        pointer-events: none;
        opacity: 0.055;
        mix-blend-mode: overlay;
        background-repeat: repeat;
        background-size: 180px 180px;
        animation: grain-shift 0.8s steps(2) infinite;
      }

      @keyframes grain-shift {
        0% { transform: translate3d(0, 0, 0); }
        25% { transform: translate3d(-1.2%, 0.9%, 0); }
        50% { transform: translate3d(0.7%, -1.3%, 0); }
        75% { transform: translate3d(1.4%, 0.4%, 0); }
        100% { transform: translate3d(-0.8%, -0.7%, 0); }
      }

      .loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #160f23;
        transition: opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.1s;
      }

      .loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .loader-sun {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #ffbf82;
        box-shadow: 0 0 42px 12px rgba(255, 139, 87, 0.24);
        animation: loader-pulse 1.8s ease-in-out infinite;
      }

      .loader-word {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.42em;
        color: rgba(255, 236, 210, 0.62);
        text-transform: uppercase;
        transform: translateX(0.21em);
      }

      @keyframes loader-pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.88); }
        50% { opacity: 1; transform: scale(1.05); }
      }

      body.is-loaded .loader {
        opacity: 0;
        visibility: hidden;
      }

      .hud {
        position: fixed;
        left: clamp(24px, 4.4vw, 68px);
        top: clamp(26px, 5.2vh, 58px);
        z-index: 4;
        pointer-events: none;
        opacity: 0;
        transform: translateY(12px);
        animation: hud-in 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) 0.9s forwards;
        text-shadow: 0 2px 24px rgba(38, 11, 35, 0.36);
      }

      .hud-kicker {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.3em;
        color: rgba(255, 229, 196, 0.62);
        text-transform: uppercase;
      }

      .hud-kicker::before {
        content: "";
        display: block;
        width: 28px;
        height: 1px;
        background: rgba(255, 211, 165, 0.48);
      }

      .hud-title {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-size: clamp(25px, 3.1vw, 46px);
        font-weight: 400;
        font-style: italic;
        line-height: 0.95;
        letter-spacing: -0.025em;
        color: rgba(255, 243, 222, 0.92);
      }

      .hud-sub {
        margin-top: 9px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 8px;
        font-weight: 400;
        letter-spacing: 0.34em;
        color: rgba(255, 220, 183, 0.5);
        text-transform: uppercase;
      }

      .hud-rule {
        width: 42px;
        height: 1px;
        margin-top: 17px;
        background: linear-gradient(90deg, rgba(255, 209, 163, 0.56), rgba(255, 209, 163, 0));
      }

      @keyframes hud-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .footer-mark {
        position: fixed;
        right: clamp(24px, 4.4vw, 68px);
        bottom: clamp(22px, 4.5vh, 48px);
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: none;
        opacity: 0;
        animation: hud-in 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) 1.3s forwards;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 8px;
        letter-spacing: 0.25em;
        color: rgba(255, 226, 194, 0.4);
        text-transform: uppercase;
      }

      .footer-mark::after {
        content: "";
        width: 18px;
        height: 18px;
        border: 1px solid rgba(255, 208, 160, 0.28);
        border-radius: 50%;
        box-shadow: inset 0 0 0 4px rgba(255, 186, 131, 0.035);
      }

      @media (max-width: 640px) {
        .hud {
          left: 22px;
          top: 24px;
        }

        .hud-title {
          font-size: 27px;
        }

        .hud-sub {
          letter-spacing: 0.24em;
        }

        .footer-mark {
          right: 22px;
          bottom: 20px;
          font-size: 7px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .grain,
        .loader-sun {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="An animated pelican surfing a golden-hour wave"></canvas>

    <div class="vignette"></div>
    <div class="grain" id="grain"></div>

    <header class="hud" aria-hidden="true">
      <div class="hud-kicker">Pacific Coast · 06:42</div>
      <h1 class="hud-title">Pelican Point</h1>
      <div class="hud-sub">A golden hour ride</div>
      <div class="hud-rule"></div>
    </header>

    <div class="footer-mark" aria-hidden="true">No. 07 / Surf Report</div>

    <div class="loader" id="loader" aria-label="Loading">
      <div class="loader-inner">
        <div class="loader-sun"></div>
        <div class="loader-word">Pelican Point</div>
      </div>
    </div>

    <script type="module" src="dev-bundle.js"></script>
  </body>
</html>
