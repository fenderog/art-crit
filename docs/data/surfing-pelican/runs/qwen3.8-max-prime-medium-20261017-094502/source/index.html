<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surfing Pelican</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a2a43;
    }
    #app {
      width: 100vw;
      height: 100vh;
    }
    canvas { display: block; }
    .title {
      position: fixed;
      top: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      font-size: clamp(18px, 3.4vw, 34px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 40, 80, 0.8);
      pointer-events: none;
      opacity: 0.9;
    }
    .subtitle {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.65);
      font-family: "Trebuchet MS", Verdana, sans-serif;
      font-size: clamp(10px, 1.6vw, 14px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="title">Surfing Pelican</div>
  <div class="subtitle">hang loose &middot; fully automatic</div>
  <script type="module" src="main.js"></script>
</body>
</html>
