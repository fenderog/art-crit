<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a4659" />
    <link rel="icon" href="data:," />
    <title>Surfing Pelican — A Study in Balance</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true"></div>

    <header class="masthead">
      <div class="mark">
        <span class="mark-dot"></span>
        <span>Pelican Surf Co.</span>
      </div>
      <div class="coords">33°46′ N&nbsp;&nbsp;·&nbsp;&nbsp;118°11′ W</div>
    </header>

    <main class="overlay">
      <p class="eyebrow reveal d1">A short study in balance</p>
      <h1 class="title reveal d2">Surfing<br /><em>Pelican</em></h1>
      <div class="rule reveal d3"></div>
      <p class="caption reveal d4">
        Pacific coast, golden hour. One bird, one board,<br />
        an unreasonable amount of quiet confidence.
      </p>
    </main>

    <footer class="footer">
      <span class="reveal d4">Golden hour — no. 01</span>
      <span class="reveal d5">Ride the swell.</span>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
