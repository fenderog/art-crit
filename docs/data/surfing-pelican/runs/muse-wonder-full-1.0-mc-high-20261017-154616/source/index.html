<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Surfing Pelican — a non-interactive Three.js daydream</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="stage" aria-label="Animated scene of a pelican surfing a wave. Sit back and watch — there is nothing to click.">
    <canvas id="scene"></canvas>
    <div class="caption" aria-hidden="true">
      <h1>The Surfing Pelican</h1>
      <p>just watch &mdash; no clicks, no controls, only swell</p>
    </div>
    <div class="badge" aria-hidden="true">three.js &middot; non-interactive</div>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
