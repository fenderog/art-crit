<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surfing Pelican</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a120e;

  <div id="veil"></div>
  <script type="module" src="main.js"></script>

</html>
