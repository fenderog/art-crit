<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surfing Pelican</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b2233;
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }

      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .overlay {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(8, 32, 48, 0.42);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #eaf6ff;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        pointer-events: none;
        backdrop-filter: blur(4px);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="overlay">Pelican &middot; afternoon glass</div>
    <script type="module" src="main.js"></script>
  </body>
</html>
