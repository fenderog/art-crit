<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Surfing Pelican 🏄‍♂️</title>

</style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <!-- Header -->
    <header class="header-bar">
      <div class="brand-badge">
        <div class="title-row">
          <span class="title-icon">🏄‍♂️</span>
          <div>
            <h1>The Surfing Pelican</h1>
            <div class="subtitle">Pierre's Endless Summer • Pipeline Break</div>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-sound" class="btn" title="Toggle Ocean Audio">
          <span id="sound-icon">🔈</span>
          <span id="sound-label">Sound: Off</span>
        </button>
        <button id="btn-pause" class="btn" title="Pause / Resume Animation">
          <span id="pause-icon">⏸</span>
          <span id="pause-label">Pause</span>
        </button>
      </div>
    </header>

    <!-- Footer -->
    <footer class="footer-bar">
      <!-- Surfing Telemetry Card -->
      <div class="telemetry-card">
        <div class="telemetry-label">Current Maneuver</div>
        <div id="telemetry-maneuver" class="telemetry-value">Dropping In!</div>
        <div class="telemetry-meter">
          <div id="meter-fill" class="meter-fill"></div>
        </div>
      </div>

      <!-- Camera Angle Switcher -->
      <nav class="camera-bar" id="camera-bar">
        <button class="camera-btn active" data-cam="auto">🎬 Director</button>
        <button class="camera-btn" data-cam="front">🏄 Action</button>
        <button class="camera-btn" data-cam="barrel">🌊 Tube</button>
        <button class="camera-btn" data-cam="rail">💦 Water Rail</button>
        <button class="camera-btn" data-cam="drone">🚁 Drone</button>
        <button class="camera-btn" data-cam="hero">🔍 Hero</button>
        <button class="camera-btn" data-cam="orbit">🔄 Orbit</button>
      </nav>
    </footer>
  </div>
