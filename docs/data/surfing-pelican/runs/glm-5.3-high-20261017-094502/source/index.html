<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surfing Pelican</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #7ec8e3;
    }
    #app {
      position: fixed;
      inset: 0;
    }
    #title {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-size: 22px;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 8px rgba(0, 40, 80, 0.5);
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="title">~ P E L I C A N &nbsp; S U R F ~</div>
  <script type="module" src="main.js"></script>
</body>
</html>
