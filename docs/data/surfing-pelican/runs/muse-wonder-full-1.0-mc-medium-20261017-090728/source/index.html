<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surfing Pelican</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3e8; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      .caption {
        position: fixed; left: 20px; bottom: 16px; pointer-events: none; user-select: none;
        font-family: Georgia, "Times New Roman", serif; color: #10384a;
      }
      .caption h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .01em; }
      .caption p { margin: 3px 0 0; font-size: 13px; font-style: italic; opacity: .75; }
    </style>
  </head>
  <body>
    <div id="app" aria-label="Animated scene of a pelican surfing on ocean waves"></div>
    <div class="caption" aria-hidden="true">
      <h1>Surfing Pelican</h1>
      <p>riding the afternoon swell</p>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
