<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Surfing Pelican</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#7ecbe8; }
  canvas { display:block; width:100%; height:100%; }
  #label {
    position:fixed; left:16px; bottom:14px;
    font:500 13px/1.4 system-ui, sans-serif;
    color:rgba(255,255,255,.95);
    text-shadow:0 1px 6px rgba(0,0,0,.35);
    letter-spacing:.02em; user-select:none; pointer-events:none;
  }
  #label b { font-size:17px; letter-spacing:.06em; }
  #err {
    position:fixed; inset:auto 12px 12px 12px;
    background:#7a1220; color:#fff; padding:10px 14px;
    font:13px/1.5 system-ui, sans-serif; border-radius:8px;
    display:none; white-space:pre-wrap;
  }
</style>
</head>
<body>
<div id="label"><b>Surfing Pelican</b><br>an animated carve on a turquoise wave &middot; watch him ride</div>
<div id="err"></div>
<script type="module" src="main.js"></script>
</body>
</html>
