<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pelican on the Longboard</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3f8fb;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0a2436;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
    }
    #app canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* soft cinematic vignette, purely decorative */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(120% 90% at 50% 42%, rgba(0, 0, 0, 0) 52%, rgba(3, 17, 28, 0.42) 100%);
      mix-blend-mode: multiply;
    }
    .caption {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(14px, env(safe-area-inset-bottom));
      text-align: center;
      pointer-events: none;
      color: rgba(243, 248, 251, 0.82);
      font-size: 12px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      text-shadow: 0 1px 12px rgba(2, 16, 26, 0.75);
      user-select: none;
    }
    .caption b {
      font-weight: 600;
      letter-spacing: 0.42em;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>
  <div class="caption"><b>Pelican</b> &nbsp;·&nbsp; longboard &nbsp;·&nbsp; golden hour</div>
  <script type="module" src="main.js"></script>
</body>
</html>
