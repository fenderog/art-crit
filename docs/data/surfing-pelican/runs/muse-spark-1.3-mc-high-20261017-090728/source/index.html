<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Surfing Pelican</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0b3d51;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  .caption {
    position: fixed;
    left: 16px;
    bottom: 14px;
    color: #fff;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
    pointer-events: none;
    user-select: none;
  }
  .caption h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.5px;
  }
  .caption p {
    margin: 2px 0 0;
    font-size: 13px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption">
  <h1>Surf's Up, Pelican</h1>
  <p>An animated, non-interactive ride &mdash; just watch.</p>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
