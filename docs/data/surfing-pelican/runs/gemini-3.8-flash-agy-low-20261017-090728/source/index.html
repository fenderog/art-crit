<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Kahuna Pete - Surfing Pelican</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #061523;
      user-select: none;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui {
      position: absolute;
      top: 24px;
      left: 28px;
      pointer-events: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(255, 107, 53, 0.85);
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
      box-shadow: 0 2px 10px rgba(255, 107, 53, 0.4);
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #ffdf9e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="badge">Pipeline Point</div>
    <h1>Big Kahuna Pete</h1>
    <p>Riding the golden barrel at Pipeline Reef</p>
  </div>
  <canvas id="webgl-canvas"></canvas>
  <script type="module" src="main.js"></script>
</body>
</html>
