<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surfing Pelican</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #bfe6f7;
    }
    #scene {
      position: fixed;
      inset: 0;
      display: block;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 18vmax rgba(8, 44, 66, 0.20);
    }
    #overlay {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 6vh;
      text-align: center;
      pointer-events: none;
      user-select: none;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      color: #ffffff;
      text-shadow: 0 2px 14px rgba(0, 60, 90, 0.5);
      animation: fadeUp 1.8s ease-out both;
    }
    #overlay h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    #overlay p {
      margin-top: 0.5em;
      font-size: clamp(0.8rem, 1.8vw, 1.1rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.92;
    }
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>
  <div id="overlay">
    <h1>Surfing Pelican</h1>
    <p>catching the swell</p>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
