<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Pelican Surf — Golden Hour</title>
    <style>
      :root {
        --cream: #fff1d8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #081b24;
      }

      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }

      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 46%, rgba(0, 0, 0, 0) 48%, rgba(3, 16, 22, 0.48) 100%),
          linear-gradient(to bottom, rgba(9, 24, 34, 0.18), rgba(0, 0, 0, 0) 24%);
        mix-blend-mode: multiply;
      }

      #caption {
        position: fixed;
        left: clamp(22px, 4vw, 56px);
        bottom: clamp(22px, 5vh, 52px);
        pointer-events: none;
        color: var(--cream);
        opacity: 0;
        transform: translateY(8px);
        animation: caption-in 2.4s cubic-bezier(0.22, 1, 0.36, 1) 1.1s forwards;
        text-shadow: 0 2px 18px rgba(2, 18, 24, 0.55);
      }

      #caption .eyebrow {
        margin: 0 0 8px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        opacity: 0.68;
      }

      #caption .line {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(18px, 2.1vw, 28px);
        font-style: italic;
        letter-spacing: 0.01em;
        opacity: 0.92;
      }

      #fade {
        position: fixed;
        inset: 0;
        background: #081b24;
        pointer-events: none;
        opacity: 1;
        transition: opacity 2.6s ease;
      }

      @keyframes caption-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 600px) {
        #caption .line {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="vignette"></div>
    <div id="caption">
      <p class="eyebrow">Pacific coast · golden hour</p>
      <p class="line">one pelican, one perfect wave</p>
    </div>
    <div id="fade"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
