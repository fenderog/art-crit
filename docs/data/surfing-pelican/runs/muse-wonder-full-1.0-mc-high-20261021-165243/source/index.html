<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surfing Pelican</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#2fb5ea; font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .title {
    position:fixed; left:22px; top:18px; z-index:5; pointer-events:none;
    color:#ffffff; text-shadow:0 2px 14px rgba(0,60,90,.45);
  }
  .title h1 { font-size:clamp(22px,3.4vw,38px); font-weight:700; letter-spacing:.01em; line-height:1; }
  .title p { margin-top:6px; font-size:clamp(12px,1.4vw,15px); font-style:italic; opacity:.92; }
  #err {
    position:fixed; inset:auto 16px 16px 16px; z-index:20; display:none;
    background:#7a1420; color:#fff; padding:12px 14px; border-radius:10px; font-family:monospace; font-size:13px; white-space:pre-wrap;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="title"><h1>Surfing Pelican</h1><p>riding the big turquoise curl</p></div>
<div id="err"></div>
<script>
  window.addEventListener('error', function(e){ var d=document.getElementById('err'); d.style.display='block'; d.textContent='Error: '+(e.message||e.error); });
  window.addEventListener('unhandledrejection', function(e){ var d=document.getElementById('err'); d.style.display='block'; d.textContent='Error: '+e.reason; });
</script>
<script type="module" src="main.js"></script>
</body>
</html>
