<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surfing Pelican</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a2450;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
      }

      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #overlay {
        position: fixed;
        left: clamp(16px, 4vw, 48px);
        bottom: clamp(16px, 4vh, 48px);
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 20, 40, 0.55);
        animation: rise 1.4s ease-out both;
      }

      #overlay h1 {
        font-size: clamp(1.6rem, 4.5vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
      }

      #overlay p {
        margin-top: 0.35rem;
        font-size: clamp(0.8rem, 1.8vw, 1.05rem);
        font-weight: 500;
        color: rgba(255, 255, 255, 0.82);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="overlay">
      <h1>Surf's Up</h1>
      <p>A surfing pelican &mdash; fully animated, hands-free.</p>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
