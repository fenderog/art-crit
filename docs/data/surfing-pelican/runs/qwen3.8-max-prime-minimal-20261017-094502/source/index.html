<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surfing Pelican</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #0a2a43;
  }
  #app { width: 100vw; height: 100vh; display: block; }
  #title {
    position: fixed;
    top: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,40,80,.6);
    pointer-events: none;
    user-select: none;
    letter-spacing: 2px;
  }
  #title h1 { margin: 0; font-size: 26px; }
  #title p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
</style>
</head>
<body>
<div id="title">
  <h1>🏄 Surfing Pelican</h1>
  <p>riding the endless swell</p>
</div>
<canvas id="app"></canvas>
<script type="module" src="main.js"></script>
</body>
</html>
