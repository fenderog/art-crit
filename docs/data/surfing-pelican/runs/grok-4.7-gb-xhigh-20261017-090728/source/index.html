<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surfing Pelican</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f3b08a;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .caption {
      position: fixed;
      left: max(1.2rem, env(safe-area-inset-left));
      bottom: max(1rem, env(safe-area-inset-bottom));
      color: rgba(255, 248, 240, 0.84);
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-shadow: 0 1px 2px rgba(40, 18, 8, 0.4);
      pointer-events: none;
      user-select: none;
    }
    .caption::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(28, 12, 8, 0.28) 100%);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <p class="caption">a pelican, surfing</p>
  <script type="module" src="main.js"></script>
</body>
</html>
