<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#203c46" />
    <title>Surfing Pelican — An Endless Afternoon</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" aria-label="An animated 3D surfing pelican on a golden-hour ocean"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" id="grain" aria-hidden="true"></div>

    <main class="ui" aria-hidden="true">
      <header class="top">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>Pelican Surf Co.</span>
        </div>
        <div class="edition">
          <span>No. 04</span>
          <span class="rule-short"></span>
          <span>Golden hour</span>
        </div>
      </header>

      <section class="title-block">
        <p class="eyebrow">A looping daydream</p>
        <h1>Surfing<br /><em>Pelican</em></h1>
        <p class="sub">
          Somewhere off the coast, a long afternoon refuses to end.
        </p>
      </section>

      <footer class="bottom">
        <div class="coords">
          <span>Pacific drift</span>
          <span>21° 18′ N &nbsp;·&nbsp; 157° 52′ W</span>
        </div>
        <div class="hint">
          <span class="hint-dot"></span>
          <span>move gently</span>
        </div>
      </footer>
    </main>

    <div class="loader" id="loader">
      <div class="loader-inner">
        <div class="loader-sun"></div>
        <p>Waxing the board</p>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
