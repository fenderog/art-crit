<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Surfing Pelican</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87c5e8; }
  #scene { position: fixed; inset: 0; display: block; }
  #caption {
    position: fixed; left: 16px; bottom: 14px; color: #fff;
    font: 600 14px/1.4 system-ui, sans-serif; letter-spacing: .02em;
    text-shadow: 0 1px 8px rgba(0,60,100,.55); pointer-events: none;
    user-select: none;
  }
  #caption small { display: block; font-weight: 400; opacity: .9; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="caption">Surfing Pelican <small>non-interactive &middot; pure three.js animation</small></div>
<script type="module" src="main.js"></script>
</body>
</html>
