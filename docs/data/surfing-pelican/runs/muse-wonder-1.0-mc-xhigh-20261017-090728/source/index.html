<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surfing Pelican — Golden Hour Break</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <div id="scene" aria-label="Animated 3D scene of a pelican surfing on a wave"></div>

      <header class="overlay overlay-top">
        <p class="kicker">Golden hour &bull; Low tide &bull; No lessons required</p>
        <h1>The Surfing Pelican</h1>
        <p class="sub">One very confident bird, one striped board, and a wave that never quite breaks.</p>
      </header>

      <footer class="overlay overlay-bottom">
        <div class="legend">
          <span class="dot dot-board"></span><span>Board: sunset stripe</span>
          <span class="sep"></span>
          <span class="dot dot-pouch"></span><span>Pouch: snack storage</span>
          <span class="sep"></span>
          <span class="dot dot-wave"></span><span>Wave: permanently peeling</span>
        </div>
        <p class="note">Sit back and watch — this one runs itself.</p>
      </footer>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
