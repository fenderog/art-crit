<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfing Pelican</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#7ecbe8;font-family:Georgia,'Times New Roman',serif}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .caption{position:fixed;left:22px;bottom:20px;color:#083344;pointer-events:none;user-select:none}
  .caption h1{font-size:28px;font-weight:700;letter-spacing:.02em;line-height:1}
  .caption p{margin-top:6px;font-size:14px;font-style:italic;opacity:.75}
  @media (max-width:600px){.caption h1{font-size:22px}.caption{left:16px;bottom:14px}}
</style>
</head>
<body>
<div id="app" aria-label="Animated 3D pelican surfing on a wave"></div>
<div class="caption"><h1>The Surfing Pelican</h1><p>riding the morning swell, no hands required</p></div>
<script type="module" src="main.js"></script>
</body>
</html>
