<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surfing Pelican 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <header class="brand-header">
      <h1 class="brand-title">
        <span>🏄‍♂️</span> The Surfing Pelican
      </h1>
      <p class="brand-subtitle">Pipeline Barrel Rider • Endless Summer</p>
    </header>

    <footer class="controls-footer">
      <nav class="camera-badge-container" aria-label="Camera Controls">
        <button class="cam-btn active" data-mode="auto">🎬 Auto Director</button>
        <button class="cam-btn" data-index="0">Action Chase</button>
        <button class="cam-btn" data-index="1">Inside Tube</button>
        <button class="cam-btn" data-index="2">Water Profile</button>
        <button class="cam-btn" data-index="3">Hero View</button>
        <button class="cam-btn" data-index="4">Drone Arc</button>
      </nav>

      <button id="audio-toggle" class="audio-toggle-btn" aria-label="Toggle synthesized ocean sound">
        🔇 Surf Sound: Off
      </button>
    </footer>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
