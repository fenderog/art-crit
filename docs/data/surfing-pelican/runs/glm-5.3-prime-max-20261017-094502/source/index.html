<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfing Pelican</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b1d2a;
  }
  canvas { display: block; }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(6, 20, 30, 0.38) 100%);
  }
  #caption {
    position: fixed;
    left: 20px;
    bottom: 18px;
    color: rgba(255, 255, 255, 0.9);
    font: 500 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.4);
    pointer-events: none;
    user-select: none;
    opacity: 0;
    animation: fadein 2.2s ease 0.8s forwards;
  }
  #caption small {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    letter-spacing: 0.24em;
    opacity: 0.75;
  }
  @keyframes fadein { to { opacity: 1; } }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="caption">Surfing Pelican<small>endless wave &middot; three.js &middot; non-interactive</small></div>
<script type="module" src="main.js"></script>
</body>
</html>
