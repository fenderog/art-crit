<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surf’s up, pelican — an animated dawn session</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a38; }
    canvas { position: fixed; inset: 0; display: block; }

    .ui { position: fixed; z-index: 2; pointer-events: none; color: #fff7ec; text-shadow: 0 1px 14px rgba(70, 30, 15, 0.45); }

    .title { left: clamp(18px, 4vw, 48px); bottom: clamp(18px, 5vh, 48px); max-width: 34em; animation: rise 1.6s ease-out 0.4s both; }
    .title h1 { font: italic 700 clamp(28px, 4.5vw, 52px)/1.05 Georgia, 'Times New Roman', serif; margin: 0 0 0.35em; letter-spacing: 0.01em; }
    .title p { font: 400 clamp(11px, 1.3vw, 15px)/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; margin: 0; opacity: 0.85; letter-spacing: 0.14em; text-transform: uppercase; }

    .report { top: clamp(16px, 3vh, 36px); left: clamp(18px, 4vw, 48px); display: flex; gap: 10px; flex-wrap: wrap; animation: rise 1.6s ease-out 1s both; }
    .report span { font: 500 11px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 0.12em; text-transform: uppercase; padding: 7px 10px; border: 1px solid rgba(255, 247, 236, 0.35); border-radius: 999px; background: rgba(43, 26, 22, 0.18); }

    .vignette { inset: 0; z-index: 1; background: radial-gradient(ellipse at 50% 42%, transparent 58%, rgba(35, 14, 18, 0.38)); }

    #fallback { display: none; position: fixed; inset: 0; place-items: center; color: #ffe9d2; font: 16px/1.6 system-ui, sans-serif; z-index: 3; padding: 2em; text-align: center; }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="ui vignette"></div>
  <div class="ui title">
    <h1>Surf’s up, pelican</h1>
    <p>an animated dawn session · no clicking required</p>
  </div>
  <div class="ui report">
    <span>swell 1.5&thinsp;m</span><span>offshore</span><span>06:12</span><span>beak first</span>
  </div>
  <div id="fallback">This scene needs WebGL, which seems unavailable here.</div>
  <script type="module" src="main.js"></script>
</body>
</html>
