<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Break — a surfing pelican diorama</title>
<style>
  :root {
    --ink: #073b3a;
    --paper: #fff6e8;
    --coral: #ff6b5e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #8ed3e8;
    color: var(--ink);
    font-family: ui-rounded, "Avenir Next", "Trebuchet MS", Verdana, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  #stage canvas {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 90% at 50% 42%, transparent 62%, rgb(7 59 58 / 0.16) 100%);
  }
  .caption {
    position: fixed;
    left: clamp(14px, 3vw, 30px);
    bottom: clamp(14px, 3vw, 30px);
    max-width: min(78vw, 360px);
    padding: 12px 16px 13px;
    background: var(--paper);
    border-bottom: 4px solid var(--coral);
    border-radius: 4px;
    box-shadow: 0 10px 28px rgb(7 59 58 / 0.22);
    pointer-events: none;
  }
  .caption h1 {
    margin: 0;
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: clamp(22px, 3.4vw, 32px);
    line-height: 1.05;
    letter-spacing: 0.01em;
  }
  .caption p {
    margin: 5px 0 0;
    font-size: 13px;
    line-height: 1.45;
  }
  .badge {
    position: fixed;
    top: clamp(12px, 2.4vw, 22px);
    right: clamp(12px, 2.4vw, 22px);
    padding: 6px 11px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    pointer-events: none;
  }
  #fallback {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
  }
  #fallback[hidden] { display: none; }
</style>
</head>
<body>
  <div id="stage" role="img" aria-label="Animated 3D scene of a pelican surfing a curling ocean wave at sunset, carving back and forth with spray trailing from its board."></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="badge" aria-hidden="true">LOOPING DIORAMA</div>
  <header class="caption">
    <h1>Pelican Break</h1>
    <p>One pelican, one endless wave, zero wipeouts so far. Sit back and watch the session.</p>
  </header>
  <div id="fallback"><p>The surf needs WebGL to roll in.<br>Please try a browser with WebGL enabled.</p></div>
  <noscript><p style="padding:24px">This diorama needs JavaScript to animate.</p></noscript>
