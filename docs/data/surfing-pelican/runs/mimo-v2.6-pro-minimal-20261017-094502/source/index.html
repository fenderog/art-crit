<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelican Surf</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a3c64;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 46%,
          rgba(0, 0, 0, 0) 42%,
          rgba(8, 32, 56, 0.16) 78%,
          rgba(6, 24, 44, 0.36) 100%
        );
      }
      .title {
        position: fixed;
        left: 5vw;
        bottom: 7vh;
        margin: 0;
        color: rgba(255, 248, 234, 0.94);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(18px, 2.6vw, 34px);
        font-weight: normal;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-shadow: 0 2px 26px rgba(12, 32, 52, 0.55);
        pointer-events: none;
        animation: titleFade 11s ease forwards;
      }
      .title span {
        display: block;
        margin-top: 0.55em;
        font-size: 0.42em;
        letter-spacing: 0.34em;
        opacity: 0.78;
      }
      @keyframes titleFade {
        0% {
          opacity: 0;
          transform: translateY(14px);
        }
        10% {
          opacity: 1;
          transform: translateY(0);
        }
        72% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>
    <h1 class="title">Surf's Up<span>a pelican, catching a wave</span></h1>
    <script type="module" src="main.js"></script>
  </body>
</html>
