<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surfing Pelican</title>
    <style>
      :root {
        --ink: #fff3e0;
        --shadow: rgba(10, 30, 45, 0.55);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #07131f; }
      body { font-family: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
      #scene { position: fixed; inset: 0; display: block; }
      #scene canvas { display: block; }

      /* soft vignette so the render sits in the page */
      #vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%,
          rgba(0, 0, 0, 0) 45%, rgba(4, 14, 24, 0.35) 100%);
      }

      #caption {
        position: fixed; left: clamp(16px, 4vw, 54px); bottom: clamp(16px, 4vh, 46px);
        color: var(--ink); text-shadow: 0 2px 18px var(--shadow);
        pointer-events: none; user-select: none;
        animation: rise 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #caption h1 {
        font-size: clamp(26px, 5.5vw, 56px); font-weight: 700; letter-spacing: 0.02em;
        line-height: 1.05;
      }
      #caption h1 span { opacity: 0.72; font-weight: 300; }
      #caption p {
        margin-top: 0.5em; font-size: clamp(12px, 1.6vw, 16px); font-weight: 400;
        letter-spacing: 0.09em; text-transform: uppercase; opacity: 0.72;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="vignette"></div>
    <div id="caption">
      <h1>Surfing Pelican <span>— golden hour</span></h1>
      <p>a fully animated, hands-off ride</p>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
