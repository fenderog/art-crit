<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Surfing Pelican</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #79b8d8;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #app, #app canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .caption {
    position: fixed;
    top: 22px;
    left: 26px;
    color: #fff;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 2px 12px rgba(10, 60, 90, 0.55);
  }
  .caption h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .caption p {
    margin: 4px 0 0;
    font-size: 13px;
    font-weight: 500;
    opacity: 0.9;
    letter-spacing: 0.4px;
  }
  .badge {
    position: fixed;
    right: 22px;
    bottom: 18px;
    color: #fff;
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    opacity: 0.85;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 1px 8px rgba(10, 60, 90, 0.6);
  }
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(8, 40, 60, 0.28) 100%);
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption">
  <h1>Surfing Pelican</h1>
  <p>Riding the morning swell &mdash; a non-interactive three.js animation</p>
</div>
<div class="badge">three.js &middot; procedural &middot; offline</div>
<div class="vignette"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
