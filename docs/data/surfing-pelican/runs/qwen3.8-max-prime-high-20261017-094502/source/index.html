<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Surfing Pelican</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #071a26;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #scene {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }
  /* purely decorative overlays — nothing here is interactive */
  .overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #vignette {
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 45%, rgba(3,12,20,0.42) 100%),
      linear-gradient(to bottom, rgba(4,16,26,0.30) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 72%, rgba(3,12,20,0.34) 100%);
    mix-blend-mode: multiply;
  }
  #grain {
    opacity: 0.05;
    background-image: repeating-conic-gradient(rgba(255,255,255,0.9) 0% 0.0008%, rgba(0,0,0,0.9) 0.0008% 0.0016%);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
  }
  #title {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    left: clamp(16px, 3.2vw, 44px);
    bottom: clamp(16px, 3.4vw, 46px);
    inset: auto auto clamp(16px, 3.4vw, 46px) clamp(16px, 3.2vw, 44px);
    animation: rise 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
  }
  #title .kicker {
    font-size: clamp(9px, 0.78vw, 12px);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(255, 226, 190, 0.72);
    font-weight: 600;
  }
  #title h1 {
    margin: 0;
    font-size: clamp(24px, 3.5vw, 54px);
    line-height: 0.95;
    letter-spacing: -0.015em;
    font-weight: 800;
    color: rgba(255, 250, 242, 0.95);
    text-shadow: 0 2px 26px rgba(4, 22, 34, 0.55);
  }
  #title .sub {
    font-size: clamp(10px, 0.9vw, 13.5px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(198, 226, 238, 0.6);
    font-weight: 500;
  }
  #hint {
    right: clamp(16px, 3.2vw, 44px);
    bottom: clamp(16px, 3.4vw, 46px);
    inset: auto clamp(16px, 3.2vw, 44px) clamp(16px, 3.4vw, 46px) auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: clamp(9px, 0.74vw, 11px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(198, 226, 238, 0.42);
    animation: rise 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both;
  }
  #hint .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #ffcf8a;
    box-shadow: 0 0 12px rgba(255, 196, 120, 0.9);
    animation: pulse 3.2s ease-in-out infinite;
  }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    place-content: center;
    text-align: center;
    padding: 2rem;
    color: #cfe6f2;
    font-size: 14px;
    letter-spacing: 0.08em;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    #title, #hint { animation-duration: 0.01ms; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette" class="overlay" aria-hidden="true"></div>
  <div id="grain" class="overlay" aria-hidden="true"></div>
  <div id="title" class="overlay" aria-hidden="true">
    <span class="kicker">Golden hour &middot; open swell</span>
    <h1>Surfing&nbsp;Pelican</h1>
    <span class="sub">Pelecanus radicus &mdash; carving set waves since forever</span>
  </div>
  <div id="hint" class="overlay" aria-hidden="true">
    <span class="dot"></span><span>self-directed reel</span>
  </div>
  <div id="fallback">This scene needs WebGL, which isn't available here.</div>
  <script type="module" src="main.js"></script>
</body>
</html>
