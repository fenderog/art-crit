<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Surfing Pelican</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9adbe8; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .caption {
    position: fixed; left: 22px; bottom: 18px; pointer-events: none; user-select: none;
    font-family: Georgia, 'Times New Roman', serif; color: #0b3b46;
  }
  .caption h1 { margin: 0; font-size: clamp(20px, 3vw, 32px); font-weight: 600; letter-spacing: .01em;
    text-shadow: 0 1px 0 rgba(255,255,255,.55); }
  .caption p { margin: 4px 0 0; font-family: system-ui, sans-serif; font-size: 13px; color: #14505f; }
</style>
</head>
<body>
<div id="app" aria-label="Animated 3D scene of a pelican surfing a curling wave"></div>
<div class="caption">
  <h1>The Surfing Pelican</h1>
  <p>carving the same perfect wave, forever</p>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
