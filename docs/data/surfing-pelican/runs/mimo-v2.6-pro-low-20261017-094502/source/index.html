<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surfing Pelican</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(#2d74c2, #c7dfec 62%, #2c8aa6);
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 45%,
          rgba(0, 0, 0, 0) 52%,
          rgba(8, 26, 44, 0.28) 100%
        );
        mix-blend-mode: multiply;
      }
      #caption {
        position: fixed;
        left: 22px;
        bottom: 18px;
        pointer-events: none;
        color: rgba(255, 255, 255, 0.82);
        font-family: "Trebuchet MS", "Segoe UI", Helvetica, Arial, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 12px;
        text-shadow: 0 1px 10px rgba(6, 30, 52, 0.65);
      }
      #caption b {
        display: block;
        font-size: 17px;
        letter-spacing: 0.22em;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="vignette"></div>
    <div id="caption"><b>Surfing Pelican</b>an endless ride &mdash; three.js</div>
    <script type="module" src="main.js"></script>
  </body>
</html>
