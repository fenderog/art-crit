<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Morning Break — A Surfing Pelican</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="stage" aria-label="Animated scene of a pelican surfing a wave">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <header class="caption">
        <p class="caption__kicker">Three.js diorama · Non-interactive</p>
        <h1>The Morning Break</h1>
        <p class="caption__text">
          A white pelican carves an endless golden-hour wave. There is nothing
          to click or drag — just sit back and watch her ride.
        </p>
      </header>
      <p class="hint">Endless wave · Procedural animation · No controls needed</p>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
