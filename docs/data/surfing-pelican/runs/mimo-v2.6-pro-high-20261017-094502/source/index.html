<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surfing Pelican</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0c2f52;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 42%,
          rgba(0, 0, 0, 0) 52%,
          rgba(6, 26, 48, 0.42) 100%
        );
      }
      .caption {
        position: fixed;
        left: 26px;
        bottom: 22px;
        pointer-events: none;
        font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system,
          sans-serif;
        text-shadow: 0 2px 18px rgba(4, 22, 42, 0.75);
        color: #f2fbff;
      }
      .caption h1 {
        margin: 0;
        font-size: clamp(18px, 2.4vw, 28px);
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      .caption p {
        margin: 4px 0 0;
        font-size: clamp(11px, 1.3vw, 14px);
        opacity: 0.78;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="vignette"></div>
    <div class="caption">
      <h1>Surfing Pelican</h1>
      <p>an endless summer &middot; procedural three.js</p>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
