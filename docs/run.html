<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run &ndash; art-crit</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html"><img src="assets/logo.svg" alt="art-crit" width="99" height="24"></a>
  <span class="crumb">/ <a id="page-link" href="index.html">page</a> / run</span>
</header>
<main class="container page-container" id="main">
  <div class="page-layout" id="page-layout" data-aside="open">
    <aside class="page-aside run-aside" id="page-aside" aria-label="About this run">
      <div class="aside-head">
        <span class="aside-title">Details</span>
        <button class="aside-close" id="aside-close" type="button" aria-label="Hide details" title="Hide details">&times;</button>
      </div>
      <div class="eyebrow" id="run-provider"></div>
      <div class="metric-strip" id="metric-strip"></div>
    </aside>
    <div class="aside-backdrop" id="aside-backdrop"></div>

    <section class="page-main" id="run-main">
      <div class="section-head run-header">
        <button class="aside-toggle" id="aside-toggle" type="button" aria-controls="page-aside" aria-expanded="true" aria-label="Details"></button>
        <h1 id="title">Loading&hellip;</h1>
      </div>

      <div class="tabs" id="tabs" role="tablist">
        <button data-tab="game" class="active" type="button" role="tab">Game</button>
        <button data-tab="transcript" type="button" role="tab">Transcript</button>
        <button data-tab="source" type="button" role="tab">Source</button>
        <button data-tab="metrics" type="button" role="tab">Metrics</button>
      </div>

      <section class="tab-panel" id="panel-game"></section>
      <section class="tab-panel" id="panel-transcript" hidden></section>
      <section class="tab-panel" id="panel-source" hidden></section>
      <section class="tab-panel" id="panel-metrics" hidden></section>
    </section>
  </div>
</main>
<script type="module" src="assets/run.js"></script>
</body>
</html>
